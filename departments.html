<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departments — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>Departments</h1></div>
    <div class="content">
      <div id="alertBox"></div>
      <div class="card">
        <div class="card-head">
          <h2 id="cardTitle">Departments</h2>
          <div style="display:flex; gap:10px; align-items:center;">
            <div class="search-box"><input type="text" id="tableSearch" placeholder="Search departments..."></div>
            <button class="btn" id="btnAddNew">+ Add Department</button>
          </div>
        </div>
        <table>
          <thead><tr><th>Name</th><th>Created</th><th style="width:140px;">Actions</th></tr></thead>
          <tbody id="tableBody">
            <tr><td colspan="3" class="loading">Loading...</td></tr>
          </tbody>
        </table>
        <div style="padding:12px 20px; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;">
          <span id="deptShownCount" style="font-size:12.5px; color:var(--muted);"></span>
          <button class="btn secondary" id="btnDeptLoadMore" style="width:auto; display:none;">Load more</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h3 id="modalTitle">Add Department</h3>
    <div id="modalAlert"></div>
    <form id="deptForm">
      <input type="hidden" id="recordId">
      <div class="field">
        <label for="recordName">Department Name</label>
        <input type="text" id="recordName" required maxlength="100">
      </div>
      <div class="actions">
        <button type="button" class="btn secondary" id="btnCancel">Cancel</button>
        <button type="submit" class="btn" id="btnSave">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/layout.js?v=2"></script>
<script>
  guardPage();
  renderSidebar('departments');

  const tableBody = document.getElementById('tableBody');
  const alertBox = document.getElementById('alertBox');
  const overlay = document.getElementById('formModal');
  const modalAlert = document.getElementById('modalAlert');
  let allRows = [];

  // Paging: 10 rows, "Load more" adds 10. Kept as a count so adding,
  // editing or deleting a department (which reloads the list) keeps your
  // place. Typing a search starts again from the first 10.
  const DEPT_PAGE_SIZE = 10;
  let deptLimit = DEPT_PAGE_SIZE;

  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => (alertBox.innerHTML = ''), 4000);
  }

  function openModal(row = null) {
    document.getElementById('deptForm').reset();
    modalAlert.innerHTML = '';
    if (row) {
      document.getElementById('modalTitle').textContent = 'Edit Department';
      document.getElementById('recordId').value = row.department_id;
      document.getElementById('recordName').value = row.department_name;
    } else {
      document.getElementById('modalTitle').textContent = 'Add Department';
      document.getElementById('recordId').value = '';
    }
    overlay.classList.add('open');
  }
  function closeModal() { overlay.classList.remove('open'); }

  document.getElementById('btnAddNew').addEventListener('click', () => openModal());
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  function matchesSearch(r) {
    const q = document.getElementById('tableSearch').value.trim().toLowerCase();
    return !q || (r.department_name || '').toLowerCase().includes(q);
  }

  function rowHtml(r) {
    return `
      <tr>
        <td><a href="employees.html?department_id=${r.department_id}">${r.department_name}</a></td>
        <td>${new Date(r.created_at).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'})}</td>
        <td>
          <div class="row-actions">
            <button onclick="editRow(${r.department_id})">Edit</button>
            <button class="danger-link" onclick="deleteRow(${r.department_id}, '${r.department_name.replace(/'/g,"\\'")}')">Delete</button>
          </div>
        </td>
      </tr>`;
  }

  // Always renders from the full list through the current search, so a
  // reload after Save/Delete keeps honouring whatever is in the search box.
  function renderTable() {
    const rows = allRows.filter(matchesSearch);
    const label = document.getElementById('deptShownCount');
    const btn = document.getElementById('btnDeptLoadMore');

    document.getElementById('cardTitle').textContent =
      rows.length === allRows.length
        ? `Departments (${allRows.length})`
        : `Departments (${rows.length} of ${allRows.length})`;

    if (rows.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="3" class="empty-state">${allRows.length ? 'No matching departments.' : 'No departments yet.'}</td></tr>`;
      label.textContent = '';
      btn.style.display = 'none';
      return;
    }

    const showing = Math.min(deptLimit, rows.length);
    tableBody.innerHTML = rows.slice(0, showing).map(rowHtml).join('');
    label.textContent = `Showing ${showing} of ${rows.length}`;
    btn.style.display = showing >= rows.length ? 'none' : 'inline-block';
  }

  document.getElementById('btnDeptLoadMore').addEventListener('click', () => {
    deptLimit += DEPT_PAGE_SIZE;
    renderTable();
  });

  async function loadDepartments() {
    try {
      const data = await api.get('departments.list');
      allRows = data.departments || [];
      renderTable();
    } catch (err) {
      document.getElementById('deptShownCount').textContent = '';
      document.getElementById('btnDeptLoadMore').style.display = 'none';
      tableBody.innerHTML = `<tr><td colspan="3"><div class="alert error">${err.message}</div></td></tr>`;
    }
  }

  window.editRow = function (id) {
    const row = allRows.find(r => r.department_id == id);
    openModal(row);
  };

  window.deleteRow = async function (id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    try {
      await api.post('departments.delete', { department_id: id });
      showAlert('Department deleted.');
      loadDepartments();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  };

  document.getElementById('deptForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('recordId').value;
    const name = document.getElementById('recordName').value.trim();
    const btn = document.getElementById('btnSave');
    btn.disabled = true;

    try {
      const payload = { department_name: name };
      if (id) payload.department_id = id;
      await api.post('departments.save', payload);
      closeModal();
      showAlert(id ? 'Department updated.' : 'Department added.');
      loadDepartments();
    } catch (err) {
      modalAlert.innerHTML = `<div class="alert error">${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  });

  let searchTimer = null;
  document.getElementById('tableSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { deptLimit = DEPT_PAGE_SIZE; renderTable(); }, 150);
  });

  loadDepartments();
</script>
</body>
</html>
