<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="30">
<title>Under Maintenance — HRMS</title>
<style>
  :root{
    --navy-900:#111827; --navy-700:#243146; --ink:#1f2430; --muted:#6b7280;
    --accent:#2563eb; --surface:#ffffff; --bg:#f3f4f6;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,var(--navy-900),var(--navy-700));
    display:flex; align-items:center; justify-content:center; padding:20px;
    color:var(--ink);
  }
  .card{
    background:var(--surface); width:100%; max-width:440px; border-radius:14px;
    padding:44px 36px 36px; box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:center;
  }
  .brand{font-weight:800; font-size:20px; letter-spacing:.3px; margin-bottom:26px;}
  .brand span{color:var(--accent);}
  .icon{
    width:64px; height:64px; margin:0 auto 22px; border-radius:50%;
    background:#eef2ff; display:flex; align-items:center; justify-content:center;
  }
  .icon svg{ width:30px; height:30px; animation:spin 2.2s linear infinite; transform-origin:50% 50%; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  h1{font-size:19px; margin:0 0 10px;}
  p{font-size:14px; line-height:1.6; color:var(--muted); margin:0 0 6px;}
  .eta{
    display:inline-block; margin-top:18px; padding:8px 16px; border-radius:20px;
    background:#f3f4f6; font-size:12.5px; color:var(--ink); font-weight:600;
  }
  .foot{margin-top:26px; font-size:12px; color:#9aa3af;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">HR<span>MS</span></div>
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
    </div>
    <h1>We'll be right back</h1>
    <p>HRMS is currently undergoing scheduled maintenance.</p>
    <p>Your data is safe — nothing is being changed except the system itself.</p>
    <div class="eta">This page refreshes automatically</div>
    <div class="foot">If this takes longer than expected, contact your system administrator.</div>
  </div>
</body>
</html>
