<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Excel Files — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>Excel Files</h1></div>
    <div class="content">
      <div id="alertBox"></div>
      <div class="card">
        <div class="card-head">
          <h2 id="cardTitle">Files</h2>
          <div style="display:flex; gap:10px; align-items:center;">
            <div class="search-box"><input type="text" id="tableSearch" placeholder="Search files..."></div>
            <button class="btn" id="btnAddNew">+ Add File</button>
          </div>
        </div>
        <table>
          <thead><tr><th>File Name</th><th>Members</th><th>Link</th><th>Created</th><th style="width:140px;">Actions</th></tr></thead>
          <tbody id="tableBody">
            <tr><td colspan="5" class="loading">Loading...</td></tr>
          </tbody>
        </table>
        <div style="padding:12px 20px; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;">
          <span id="pageShownCount" style="font-size:12.5px; color:var(--muted);"></span>
          <button class="btn secondary" id="btnPageLoadMore" style="width:auto; display:none;">Load more</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h3 id="modalTitle">Add File</h3>
    <div id="modalAlert"></div>
    <form id="fileForm">
      <input type="hidden" id="recordId">
      <div class="field">
        <label for="recordName">File Name</label>
        <input type="text" id="recordName" required maxlength="200" placeholder="e.g. Payroll 2026">
      </div>
      <div class="field">
        <label for="recordUrl">Google Sheet Link (optional)</label>
        <input type="url" id="recordUrl" maxlength="500" placeholder="https://docs.google.com/spreadsheets/...">
      </div>
      <div class="actions">
        <button type="button" class="btn secondary" id="btnCancel">Cancel</button>
        <button type="submit" class="btn" id="btnSave">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="membersModal">
  <div class="modal">
    <h3 id="membersTitle">Members</h3>
    <div id="membersBody" style="max-height:320px; overflow-y:auto;"></div>
    <div class="actions">
      <button type="button" class="btn secondary" id="btnMembersClose">Close</button>
    </div>
  </div>
</div>

<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/layout.js?v=2"></script>
<script>
  guardPage();
  renderSidebar('excel_files');

  const tableBody = document.getElementById('tableBody');
  const alertBox = document.getElementById('alertBox');
  const overlay = document.getElementById('formModal');
  const membersOverlay = document.getElementById('membersModal');
  const modalAlert = document.getElementById('modalAlert');
  let allRows = [];

  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => (alertBox.innerHTML = ''), 4000);
  }

  function openModal(row = null) {
    document.getElementById('fileForm').reset();
    modalAlert.innerHTML = '';
    if (row) {
      document.getElementById('modalTitle').textContent = 'Edit File';
      document.getElementById('recordId').value = row.file_id;
      document.getElementById('recordName').value = row.file_name;
      document.getElementById('recordUrl').value = row.file_url || '';
    } else {
      document.getElementById('modalTitle').textContent = 'Add File';
      document.getElementById('recordId').value = '';
    }
    overlay.classList.add('open');
  }
  function closeModal() { overlay.classList.remove('open'); }

  document.getElementById('btnAddNew').addEventListener('click', () => openModal());
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  document.getElementById('btnMembersClose').addEventListener('click', () => membersOverlay.classList.remove('open'));
  membersOverlay.addEventListener('click', (e) => { if (e.target === membersOverlay) membersOverlay.classList.remove('open'); });

  // Paging: 10 rows, "Load more" adds 10. Kept as a count so adding,
  // editing or deleting (which reloads the list) keeps your place.
  // Typing a search starts again from the first 10.
  const PAGE_SIZE = 10;
  let pageLimit = PAGE_SIZE;

  function matchesSearch(r) {
    const q = document.getElementById('tableSearch').value.trim().toLowerCase();
    return !q || (r.file_name || '').toLowerCase().includes(q);
  }

  function rowHtml(r) {
    return `
      <tr>
        <td>${r.file_name}</td>
        <td><button style="background:none; border:none; color:#1d4ed8; cursor:pointer; font-weight:600; padding:0;" onclick="viewMembers(${r.file_id}, '${r.file_name.replace(/'/g, "\\'")}')">${r.member_count} member${r.member_count == 1 ? '' : 's'}</button></td>
        <td>${r.file_url ? `<a href="${r.file_url}" target="_blank">Open</a>` : '—'}</td>
        <td>${r.created_at ? new Date(r.created_at).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}) : '—'}</td>
        <td>
          <div class="row-actions">
            <button onclick="editRow(${r.file_id})">Edit</button>
            <button class="danger-link" onclick="deleteRow(${r.file_id}, '${r.file_name.replace(/'/g,"\\'")}')">Delete</button>
          </div>
        </td>
      </tr>`;
  }

  // Always renders from the full list through the current search, so a
  // reload after Save/Delete keeps honouring whatever is in the search box.
  function renderTable() {
    const rows = allRows.filter(matchesSearch);
    const label = document.getElementById('pageShownCount');
    const btn = document.getElementById('btnPageLoadMore');

    document.getElementById('cardTitle').textContent =
      rows.length === allRows.length
        ? `Files (${allRows.length})`
        : `Files (${rows.length} of ${allRows.length})`;

    if (rows.length === 0) {
      tableBody.innerHTML = allRows.length
        ? '<tr><td colspan="5" class="empty-state">No matching files.</td></tr>'
        : '<tr><td colspan="5" class="empty-state">No files yet — add your Excel/Google Sheet file names here, then select them while adding employees.</td></tr>';
      label.textContent = '';
      btn.style.display = 'none';
      return;
    }

    const showing = Math.min(pageLimit, rows.length);
    tableBody.innerHTML = rows.slice(0, showing).map(rowHtml).join('');
    label.textContent = `Showing ${showing} of ${rows.length}`;
    btn.style.display = showing >= rows.length ? 'none' : 'inline-block';
  }

  document.getElementById('btnPageLoadMore').addEventListener('click', () => {
    pageLimit += PAGE_SIZE;
    renderTable();
  });

  async function loadFiles() {
    try {
      const data = await api.get('excel_files.list');
      allRows = data.files || [];
      renderTable();
    } catch (err) {
      document.getElementById('pageShownCount').textContent = '';
      document.getElementById('btnPageLoadMore').style.display = 'none';
      tableBody.innerHTML = `<tr><td colspan="5"><div class="alert error">${err.message}</div></td></tr>`;
    }
  }

  window.editRow = function (id) {
    const row = allRows.find(r => r.file_id == id);
    openModal(row);
  };

  window.deleteRow = async function (id, name) {
    if (!confirm(`Delete file "${name}"?\n\nEmployees stay — only the file entry and its mappings are removed.`)) return;
    try {
      await api.post('excel_files.delete', { file_id: id });
      showAlert('File deleted.');
      loadFiles();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  };

  window.viewMembers = async function (id, name) {
    document.getElementById('membersTitle').textContent = `Members — ${name}`;
    document.getElementById('membersBody').innerHTML = '<div class="loading" style="padding:10px 0;">Loading...</div>';
    membersOverlay.classList.add('open');
    try {
      const data = await api.get('excel_files.members', { file_id: id });
      const members = data.members || [];
      document.getElementById('membersBody').innerHTML = members.length === 0
        ? '<div style="color:#888; padding:10px 0;">No employees mapped to this file yet.</div>'
        : members.map(m => `
            <div style="padding:8px 0; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center; gap:10px;">
              <a href="employee_detail.html?id=${m.employee_id}">${m.full_name} <span class="badge">${m.employee_code}</span></a>
              <span style="color:#888; font-size:13px;">${m.mobile || ''}</span>
            </div>`).join('');
    } catch (err) {
      document.getElementById('membersBody').innerHTML = `<div class="alert error">${err.message}</div>`;
    }
  };

  document.getElementById('fileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('recordId').value;
    const name = document.getElementById('recordName').value.trim();
    const url = document.getElementById('recordUrl').value.trim();
    const btn = document.getElementById('btnSave');
    btn.disabled = true;
    try {
      const payload = { file_name: name, file_url: url };
      if (id) payload.file_id = id;
      await api.post('excel_files.save', payload);
      closeModal();
      showAlert(id ? 'File updated.' : 'File added.');
      loadFiles();
    } catch (err) {
      modalAlert.innerHTML = `<div class="alert error">${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  });

  let searchTimer = null;
  document.getElementById('tableSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { pageLimit = PAGE_SIZE; renderTable(); }, 150);
  });

  loadFiles();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
