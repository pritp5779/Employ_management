<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Ex-Employees — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=3">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>Ex-Employees</h1></div>
    <div class="content">
      <div id="alertBox"></div>

      <div class="card">
        <div class="card-head">
          <h2 id="cardTitle">Ex-Employees</h2>
          <div class="search-box"><input type="text" id="tableSearch" placeholder="Search name, code, mobile..."></div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Code</th>
              <th>Name</th>
              <th>Department</th>
              <th>Mobile</th>
              <th>Left On</th>
              <th style="width:200px;">Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="6" class="loading">Loading...</td></tr>
          </tbody>
        </table>
        <div style="padding:12px 20px; display:flex; align-items:center; justify-content:center; gap:14px; flex-wrap:wrap;">
          <span id="exShownCount" style="font-size:12.5px; color:var(--muted);"></span>
          <button class="btn secondary" id="btnExLoadMore" style="width:auto; display:none;">Load more</button>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/layout.js?v=2"></script>
<script>
  guardPage();
  renderSidebar('ex_employees');

  const tableBody = document.getElementById('tableBody');
  const alertBox = document.getElementById('alertBox');
  let allRows = [];

  // Paging: 10 rows, "Load more" adds 10. Kept as a count so that after a
  // Rejoin or Delete (which reloads the list) you stay where you were.
  // Typing a search starts again from the first 10.
  const EX_PAGE_SIZE = 10;
  let exLimit = EX_PAGE_SIZE;

  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => (alertBox.innerHTML = ''), 4000);
  }

  function fmtDate(dateStr) {
    return dateStr ? new Date(dateStr).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '—';
  }

  function matchesSearch(r) {
    const q = document.getElementById('tableSearch').value.trim().toLowerCase();
    if (!q) return true;
    return (r.full_name || '').toLowerCase().includes(q) ||
      (r.employee_code || '').toLowerCase().includes(q) ||
      (r.mobile || '').includes(q);
  }

  function rowHtml(e) {
    return `
      <tr>
        <td><span class="badge inactive">${e.employee_code}</span></td>
        <td><a href="employee_detail.html?id=${e.employee_id}">${e.full_name}</a></td>
        <td>${e.department_name || '—'}</td>
        <td>${e.mobile || '—'}</td>
        <td>${fmtDate(e.left_at)}</td>
        <td>
          <div class="row-actions">
            <button onclick="rejoinEmployee(${e.employee_id}, '${(e.full_name || '').replace(/'/g, "\\'")}')">Rejoin</button>
            <button class="danger-link" onclick="destroyEmployee(${e.employee_id}, '${(e.full_name || '').replace(/'/g, "\\'")}')">Delete</button>
          </div>
        </td>
      </tr>`;
  }

  // Always renders from the full list through the current search, so a
  // reload after Rejoin/Delete keeps honouring whatever is in the search box.
  function renderTable() {
    const rows = allRows.filter(matchesSearch);
    const label = document.getElementById('exShownCount');
    const btn = document.getElementById('btnExLoadMore');

    document.getElementById('cardTitle').textContent =
      rows.length === allRows.length
        ? `Ex-Employees (${allRows.length})`
        : `Ex-Employees (${rows.length} of ${allRows.length})`;

    if (rows.length === 0) {
      tableBody.innerHTML = `<tr><td colspan="6" class="empty-state">${allRows.length ? 'No matching ex-employees.' : 'No ex-employees.'}</td></tr>`;
      label.textContent = '';
      btn.style.display = 'none';
      return;
    }

    const showing = Math.min(exLimit, rows.length);
    tableBody.innerHTML = rows.slice(0, showing).map(rowHtml).join('');
    label.textContent = `Showing ${showing} of ${rows.length}`;
    btn.style.display = showing >= rows.length ? 'none' : 'inline-block';
  }

  document.getElementById('btnExLoadMore').addEventListener('click', () => {
    exLimit += EX_PAGE_SIZE;
    renderTable();
  });

  async function loadExEmployees() {
    try {
      const data = await api.get('employees.list', { status: 'ex' });
      allRows = data.employees || [];
      renderTable();
    } catch (err) {
      document.getElementById('exShownCount').textContent = '';
      document.getElementById('btnExLoadMore').style.display = 'none';
      tableBody.innerHTML = `<tr><td colspan="6"><div class="alert error">${err.message}</div></td></tr>`;
    }
  }

  window.rejoinEmployee = async function (id, name) {
    if (!confirm(`Rejoin "${name}"? They will move back to active Employees with all their documents intact.`)) return;
    try {
      await api.post('employees.rejoin', { employee_id: id });
      showAlert('Employee rejoined.');
      loadExEmployees();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  };

  window.destroyEmployee = async function (id, name) {
    if (!confirm(`PERMANENTLY delete "${name}"?\n\nThis removes the employee AND all their uploaded documents forever. This cannot be undone.`)) return;
    try {
      await api.post('employees.destroy', { employee_id: id });
      showAlert('Employee permanently deleted.');
      loadExEmployees();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  };

  let searchTimer = null;
  document.getElementById('tableSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { exLimit = EX_PAGE_SIZE; renderTable(); }, 150);
  });

  loadExEmployees();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
