<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sales Control Tower — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  .ldseg{display:flex; gap:4px;} .ldseg button{width:auto; min-height:0; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:99px; padding:4px 12px; font-size:12px; font-weight:800; cursor:pointer;} .ldseg button.on{background:#111827; color:#fff; border-color:#111827;}
  .ldr{display:grid; grid-template-columns:26px 1fr auto; gap:10px; align-items:center; padding:8px 4px; border-top:1px solid var(--line);} .ldr:first-child{border-top:0;}
  .ldr .rk{text-align:center; font-weight:900; color:var(--muted);} .ldr .nm b{font-weight:800;} .ldr .nm em{font-style:normal; font-size:10.5px; font-weight:800; color:#b45309; background:#fef3c7; border-radius:99px; padding:1px 8px; margin-left:4px;}
  .ldr .bar{height:5px; border-radius:4px; background:#e5e7eb; margin-top:4px; overflow:hidden;} .ldr .bar i{display:block; height:100%; background:linear-gradient(90deg,#4ade80,#16a34a);}
  .ldr .cv{text-align:right;} .ldr .cv b{display:block; font-size:15px; font-weight:900;} .ldr .cv b.ok{color:#15803d;} .ldr .cv b.warn{color:#b45309;} .ldr .cv small{font-size:10.5px; color:var(--muted);}
  .ldt{border-radius:10px; padding:8px 11px; margin-top:6px; font-size:12.5px; line-height:1.45; background:#EEF2FF; color:#3730a3;} .ldt.coach{background:#FFF7ED; color:#9a3412;} .ldt b{display:block; font-size:13px;}
  @media (max-width:640px){ #p-today, #p-alerts, #p-md, #p-rt, #qbTop, #qbBot, #aqCard, #p-bench, #p-set, #tabs{zoom:.8;} }
  .ct-tabs{display:flex; gap:6px; flex-wrap:wrap; margin:0 0 14px;}
  .ct-tab{border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 16px; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink);}
  .ct-tab.on{background:var(--ink); color:#fff; border-color:var(--ink);}
  .ct-tab .n{display:inline-block; margin-left:6px; background:#e02424; color:#fff; border-radius:10px; padding:0 7px; font-size:11px;}
  .ct-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:14px;}
  .ct-tile{background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px 16px; position:relative; overflow:hidden;}
  .ct-tile .k{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  .ct-tile .v{font-size:26px; font-weight:800; margin-top:4px; line-height:1.1;}
  .ct-tile .v small{font-size:13px; font-weight:600; color:var(--muted);}
  .ct-tile .s{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.4;}
  .ct-tile::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:#d1d5db;}
  .ct-tile.ok::before{background:#16a34a;} .ct-tile.warn::before{background:#f59e0b;} .ct-tile.red::before{background:#dc2626;}
  .bar{height:7px; background:#eef0f3; border-radius:6px; overflow:hidden; margin-top:8px;}
  .bar i{display:block; height:100%; background:#16a34a; border-radius:6px;} .bar.warn i{background:#f59e0b;} .bar.red i{background:#dc2626;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
  .chip{font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:#f3f4f6; color:#4b5563;}
  .chip.hit,.chip.ok{background:#e4f6ec; color:#16945a;} .chip.miss,.chip.red{background:#fdecea; color:#d9423b;} .chip.warn{background:#fef3c7; color:#92400e;}
  .al{display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-bottom:1px solid var(--line);}
  .al:last-child{border-bottom:0;}
  .al .dot{flex:none; width:10px; height:10px; border-radius:50%; margin-top:6px; background:#9ca3af;}
  .al.red .dot{background:#dc2626;} .al.warn .dot{background:#f59e0b;} .al.info .dot{background:#3b82f6;}
  .al.meet{background:#fff7ed;}
  .al .t{font-weight:700; font-size:13.5px;} .al .b{font-size:12.5px; color:#4b5563; margin-top:2px; line-height:1.45; white-space:pre-wrap;}
  .al .m{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .al .act{margin-left:auto; flex:none;}
  .tag{font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; background:#fde68a; color:#78350f; border-radius:6px; padding:2px 6px; margin-left:6px;}
  .tbl-wrap{overflow-x:auto;}
  table.ct td, table.ct th{white-space:nowrap;}
  .pc{font-weight:700;} .pc.ok{color:#16945a;} .pc.warn{color:#b45309;} .pc.red{color:#d9423b;}
  .md-it{padding:12px 16px; border-bottom:1px solid var(--line);} .md-it:last-child{border-bottom:0;}
  .md-it .h{display:flex; gap:10px; align-items:flex-start; flex-wrap:wrap;}
  .md-it .lab{font-weight:700; font-size:13.5px; flex:1 1 280px;}
  .md-it .adv{font-size:12.5px; color:#4b5563; margin-top:4px; line-height:1.45;}
  .md-it .txt{font-size:12px; background:#f6f7f9; border-radius:8px; padding:8px 10px; margin-top:6px; white-space:pre-wrap;}
  .st{font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; background:#f3f4f6; color:#4b5563;}
  .st.open{background:#fdecea; color:#d9423b;} .st.changed{background:#e0e7ff; color:#3730a3;} .st.improved{background:#e4f6ec; color:#16945a;} .st.cleared{background:#e4f6ec; color:#16945a;} .st.removed{background:#f3f4f6;}
  .sub{font-size:12px; color:var(--muted);}
  .set-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 16px; padding:14px 18px;}
  .set-grid label{display:block; font-size:12px; font-weight:600; color:#4b5563; margin-bottom:3px;}
  .set-grid input, .set-grid select, .set-grid textarea{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; background:#fff;}
  .set-h{padding:12px 18px 0; font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}
  .res-list{display:flex; flex-wrap:wrap; gap:8px; padding:8px 18px 14px;}
  .res-list label{display:flex; gap:6px; align-items:center; font-size:13px; background:#f6f7f9; border-radius:999px; padding:5px 12px; cursor:pointer;}
  .al .rv{margin-top:6px; font-size:12.5px; color:#166534; background:#f0fdf4; border:1px solid #bbf7d0; border-radius:10px; padding:6px 10px;} .al .rv .rn{color:#14532d; font-weight:600; margin-top:2px; word-break:break-word;}
  .rt-seg{display:flex; gap:6px; flex-wrap:wrap;} .rt-sum{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0 4px;} .rt-sum div{background:#f6f7f9; border-radius:12px; padding:8px 10px;} .rt-sum b{display:block; font-size:19px; font-weight:900;} .rt-sum small{font-size:11px; color:var(--muted); font-weight:700;}
  .rt-p{border-top:1px solid var(--line);} .rt-p>summary{list-style:none; cursor:pointer; display:grid; grid-template-columns:26px 1fr auto; gap:10px; align-items:center; padding:10px 4px;} .rt-p>summary::-webkit-details-marker{display:none;}
  .rt-sc{font-weight:900; font-size:15px; border-radius:99px; padding:2px 12px; background:#e5e7eb;} .rt-sc.g{background:#dcfce7; color:#166534;} .rt-sc.a{background:#fef3c7; color:#92400e;} .rt-sc.r{background:#fee2e2; color:#991b1b;}
  .rt-lb{font-size:11.5px; color:var(--muted); font-weight:700;} .rt-body{padding:0 4px 10px 36px;}
  .rt-r{display:grid; grid-template-columns:1fr auto; column-gap:10px; padding:5px 0; border-top:1px dashed var(--line); font-size:13px;} .rt-r:first-child{border-top:0;} .rt-r .rn{font-weight:800;} .rt-r .rv{font-weight:900; text-align:right;}
  .rt-bar{grid-column:1/-1; height:5px; border-radius:4px; background:#e5e7eb; overflow:hidden; margin:3px 0;} .rt-bar i{display:block; height:100%;} .rt-bar i.g{background:#16a34a;} .rt-bar i.a{background:#f59e0b;} .rt-bar i.r{background:#ef4444;}
  .rt-rm{grid-column:1/-1; font-size:12px; color:#92400e; background:#fffbeb; border-radius:8px; padding:3px 8px; margin-top:2px;}
  @media (max-width:640px){ .rt-sum{grid-template-columns:repeat(2,1fr);} .rt-body{padding-left:4px;} }
  .empty{padding:26px; text-align:center; color:var(--muted); font-size:13.5px;}
  .big-ok{font-size:15px; font-weight:700; color:#16945a;}
  @media (max-width:820px){ .al{flex-wrap:wrap;} .al .act{margin-left:22px;} .ct-tile .v{font-size:23px;} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar">
      <h1>Sales Control Tower</h1>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <input type="date" id="datePick" title="Business day (10 AM to 10 AM)" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
        <button class="btn secondary" id="btnRefresh" style="width:auto;">↻ Refresh</button>
      </div>
    </div>
    <div class="content">
      <div id="alertBox"></div>
      <div class="ct-tabs" id="tabs">
        <button class="ct-tab on" data-t="today">Today</button>
        <button class="ct-tab" data-t="alerts">Alerts <span class="n" id="nAl" style="display:none;"></span></button>
        <button class="ct-tab" data-t="md">Message Doctor <span class="n" id="nMd" style="display:none;"></span></button>
        <button class="ct-tab" data-t="qb">🏁 Query Boost</button>
        <button class="ct-tab" data-t="rt">⭐ Ratings</button>
        <button class="ct-tab" data-t="bench">Benchmarks &amp; Ideas</button>
        <button class="ct-tab" data-t="set" id="tabSet" style="display:none;">Settings</button>
      </div>

      <section id="p-today"></section>
      <section id="p-alerts" style="display:none;"></section>
      <section id="p-md" style="display:none;"></section>
      <section id="p-rt" style="display:none;"></section>
      <section id="p-qb" style="display:none;"><div id="qbTop"></div><div class="card" id="aqCard" style="margin-bottom:14px;"><div class="card-head"><div><h2>📋 Assign queries</h2><div class="sub">Give the queries here — the suggestion above and the assigning are in one place now.</div></div></div><iframe id="aqFrame" title="Assign queries" style="width:100%;border:0;display:block;min-height:420px;background:transparent;" loading="lazy"></iframe></div><div id="qbBot"></div></section>
      <section id="p-bench" style="display:none;"></section>
      <section id="p-set" style="display:none;"></section>
    </div>
  </main>
</div>

<div class="modal-overlay" id="resModal">
  <div class="modal" style="max-width:420px;">
    <h3 id="resTitle">Mark resolved</h3>
    <div class="sub" id="resSub" style="margin-bottom:10px;"></div>
    <div class="field"><label for="resNote">Comment <b style="color:#dc2626;">(required)</b> — what did you do? e.g. "spoke to him, he will send proofs"</label><input type="text" id="resNote" maxlength="280" autocomplete="off"><div class="sub" id="resErr" style="color:#dc2626;font-weight:700;display:none;margin-top:6px;">Please write a comment (at least 3 letters) to mark this resolved.</div></div>
    <div class="actions">
      <button type="button" class="btn secondary" id="resCancel">Cancel</button>
      <button type="button" class="btn" id="resOk">✅ Resolved</button>
    </div>
  </div>
</div>

<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/layout.js?v=3"></script>
<script>
  guardPage();
  renderSidebar('control_tower');

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inr = (n) => n == null ? '—' : '₹' + Math.round(Number(n)).toLocaleString('en-IN');
  const alertBox = document.getElementById('alertBox');
  function showAlert(msg, type = 'success') { alertBox.innerHTML = `<div class="alert ${type}">${esc(msg)}</div>`; window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(() => (alertBox.innerHTML = ''), 6000); }
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, '0');
  const dstr = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());

  let T = null, MD = null, BM = null, tab = 'today';
  // "Unknown action" = the server still runs the OLD api.php (the new one has not been uploaded yet).
  const errHtml = (err) => /unknown action/i.test(err.message || '')
    ? `<div class="empty" style="text-align:left;max-width:640px;margin:0 auto;"><b style="font-size:15px;">⚠️ The server still has the old api.php</b><br><br>The Control Tower needs the new <b>api.php</b> from the update zip.<br>
       hPanel → fourpirates.space → Files → File Manager → <b>public_html/empmanagment</b> → upload the new <b>api.php</b> and choose <b>Overwrite</b> (do not touch config.php). Then refresh this page.</div>`
    : `<div class="empty">${esc(err.message)}</div>`;
  const nameOf = (id) => ((T && T.names || []).find(n => Number(n.id) === Number(id)) || {}).name || ('#' + id);
  const stCls = (s) => s === 'ok' || s === 'hit' || s === 'top' ? 'ok' : (s === 'warn' || s === 'near' || s === 'climb' ? 'warn' : (s === 'red' || s === 'miss' || s === 'low' ? 'red' : ''));
  const pctCls = (v, goal, amber, red) => v == null ? '' : (v >= goal ? 'ok' : (v >= amber ? 'warn' : 'red'));
  const bar = (v, max, cls) => `<div class="bar ${cls || ''}"><i style="width:${Math.max(0, Math.min(100, max ? v / max * 100 : 0))}%"></i></div>`;

  // ---------- tabs ----------
  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.ct-tab'); if (!b) return;
    tab = b.dataset.t;
    document.querySelectorAll('.ct-tab').forEach(x => x.classList.toggle('on', x === b));
    ['today', 'alerts', 'md', 'qb', 'rt', 'bench', 'set'].forEach(k => $('p-' + k).style.display = k === tab ? '' : 'none');
    if (tab === 'qb') ensureAq();
    if (tab === 'rt') loadRt();
    if (tab === 'md' && !MD) loadMd(false);
    if (tab === 'bench' && !BM) loadBench();
    if (tab === 'bench' && !MD) loadMd(false);
    if (tab === 'set') renderSettings();
  });

  // ---------- TODAY ----------
  async function loadTower(refresh) {
    try {
      const day = $('datePick').value;
      T = await api.get('ct.tower', Object.assign({}, day ? { date: day } : {}, refresh ? { refresh: 1 } : {}));
      if (!$('datePick').value) $('datePick').value = T.day;
      $('tabSet').style.display = T.can_settings ? '' : 'none';
      renderToday(); renderAlerts(); renderQb();
      const open = (T.alerts || []).filter(a => a.status === 'open' && a.kind !== 'digest').length;
      const nAl = $('nAl'); nAl.textContent = open; nAl.style.display = open ? '' : 'none';
      if (tab === 'set') renderSettings();
    } catch (err) { $('p-today').innerHTML = `<div class="card">${errHtml(err)}</div>`; }
  }

  function renderToday() {
    const t = T.team || {}, cfg = T.cfg || {};
    const qs = stCls(t.q_state);
    const qTarget = Number(t.q_target || cfg.q_target || 0);
    const steps = (cfg.ticket_steps || [2600, 2700]);
    const tk = Number(t.ticket || 0);
    const tkCls = tk >= steps[steps.length - 1] ? 'ok' : (tk >= steps[0] ? 'warn' : 'red');
    const checks = (t.comm_checks || []).map(c => `<span class="chip ${c.state === 'hit' ? 'hit' : c.state === 'miss' ? 'miss' : ''}">${esc(c.at)} · ${c.have}/${c.need}</span>`).join('');
    const mixP = Number(t.mix_pct || 0);
    const mixCls = pctCls(mixP, cfg.mix_goal || 85, cfg.mix_amber || 80);
    const codeP = t.code_rate == null ? null : Number(t.code_rate);
    const isToday = T.day === T.today;
    const tiles = `
      <div class="ct-grid">
        <div class="ct-tile ${qs}"><div class="k">Query orders</div>
          <div class="v">${t.query_orders ?? 0} <small>/ ${qTarget} goal</small></div>
          ${bar(t.query_orders || 0, qTarget, qs)}
          <div class="s">${isToday ? `Should be ~<b>${Math.round(t.q_expected_now || 0)}</b> by now · on track for ~<b>${Math.round(t.q_projected || 0)}</b>` : 'Final for the day'}</div></div>
        <div class="ct-tile"><div class="k">Community / campaign orders</div>
          <div class="v">${t.community_orders ?? 0} <small>/ ${t.comm_target || cfg.comm_target || 200}</small></div>
          ${bar(t.community_orders || 0, t.comm_target || cfg.comm_target || 200)}
          <div class="chips">${checks || '<span class="sub">No checkpoints</span>'}</div></div>
        <div class="ct-tile ${tkCls}"><div class="k">Average ticket</div>
          <div class="v">${inr(tk)}</div>
          <div class="s">Ladder: ${steps.map(s => inr(s)).join(' → ')} · big orders (above ${inr(cfg.big_order)}) are shown separately per person</div></div>
        <div class="ct-tile ${mixCls}"><div class="k">Dark green + light green + white</div>
          <div class="v">${mixP.toFixed(0)}% <small>of pieces (goal ${cfg.mix_goal || 85}%)</small></div>
          ${bar(mixP, 100, mixCls)}
          <div class="s">DG ${t.dg ?? 0} · LG ${t.lg ?? 0} · WH ${t.wh ?? 0} · other ${t.oth ?? 0}</div></div>
        <div class="ct-tile ${codeP == null ? '' : (codeP >= 65 ? 'ok' : codeP >= 50 ? 'warn' : 'red')}"><div class="k">Order-code share</div>
          <div class="v">${codeP == null ? '—' : codeP.toFixed(0) + '%'} <small>(goal 65%)</small></div>
          ${bar(codeP || 0, 100, codeP >= 65 ? '' : 'warn')}</div>
      </div>`;
    const open = (T.alerts || []).filter(a => a.status === 'open' && a.kind !== 'digest');
    const top = open.slice(0, 6);
    const alerts = `<div class="card" style="margin-bottom:14px;"><div class="card-head"><h2>Needs attention ${open.length ? '(' + open.length + ')' : ''}</h2>${open.length > 6 ? '<button class="btn secondary" style="width:auto;padding:6px 12px;font-size:12.5px;" onclick="goTab(\'alerts\')">See all</button>' : ''}</div>
      ${top.length ? top.map(alertRow).join('') : '<div class="empty"><span class="big-ok">✅ Nothing is red right now.</span><br>Everything the tower watches is on track.</div>'}</div>`;

    const rows = (T.emps || []).map(e => {
      const tv = e.tv || {}, mix = e.mix || {}, pr = e.proof || {};
      const tCls = stCls(tv.state === 'top' || tv.state === 'raise' ? 'ok' : tv.state === 'near' ? 'near' : tv.state === 'low' ? 'low' : tv.state === 'climb' ? 'warn' : '');
      const codeTxt = e.code_rate == null ? '—' : Math.round(e.code_rate) + '%';
      const missing = (pr.orders_no_chat || 0) + (pr.orders_no_call || 0) + (pr.pending_queries || 0);
      const empAl = open.filter(a => Number(a.emp) === Number(e.id));
      return `<tr>
        <td><b>${esc(e.name)}</b>${empAl.some(a => a.meet) ? '<span class="tag">meet admin</span>' : ''}</td>
        <td>${e.orders ?? 0} <span class="sub">(${e.qo ?? 0} query · ${e.co ?? 0} community)</span></td>
        <td>${e.queries ?? 0} <span class="sub">${e.conv != null ? '· ' + Math.round(e.conv) + '% conv' : ''}</span></td>
        <td><span class="pc ${tCls}">${inr(e.ticket)}</span> <span class="sub">clean ${inr(e.clean_ticket)}${tv.carried ? ' · carried by big order' : ''}${tv.need_next ? ' · next order ' + inr(tv.need_next) : ''}</span></td>
        <td><span class="pc ${e.code_ok ? 'ok' : 'warn'}">${codeTxt}</span> <span class="sub">${e.code_left > 0 ? e.code_left + ' more codes' : ''}</span></td>
        <td><span class="pc ${pctCls(mix.pct, cfg.mix_goal || 85, cfg.mix_amber || 80)}">${mix.pct == null ? '—' : Math.round(mix.pct) + '%'}</span> <span class="sub">${mix.pieces ?? 0} pcs</span></td>
        <td><span class="pc ${missing ? 'red' : 'ok'}">${missing ? missing + ' missing' : '✓ all'}</span> <span class="sub">${pr.orders_no_chat ? pr.orders_no_chat + ' chat · ' : ''}${pr.orders_no_call ? pr.orders_no_call + ' call · ' : ''}${pr.pending_queries ? pr.pending_queries + ' queries' : ''}</span></td>
        <td>${empAl.length ? `<span class="chip ${empAl.some(a => a.sev === 'red') ? 'red' : 'warn'}">${empAl.length} alert${empAl.length > 1 ? 's' : ''}</span>` : '<span class="chip ok">clear</span>'}</td>
      </tr>`;
    }).join('');
    const people = `<div class="card"><div class="card-head"><div><h2>Salespeople — ${esc(T.day)}</h2><div class="sub">Business day runs 10 AM → 10 AM. Updated ${esc((T.now || '').slice(11, 16))}.</div></div></div>
      <div class="tbl-wrap"><table class="ct"><thead><tr><th>Name</th><th>Orders</th><th>Queries</th><th>Ticket</th><th>Codes</th><th>DG+LG+WH</th><th>Proof</th><th>Status</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="8" class="empty">No sales team data for this day.</td></tr>'}</tbody></table></div></div>`;
    $('p-today').innerHTML = tiles + alerts + people;
  }

  // ---------- Query → order ranking: orders ÷ queries given (today + last 7 days), who ordered first, and who to give more queries to ----------
  let LV = 'today';
  function leadersCard() {
    const L = T.leaders; if (!L || !L.today) return '';

      <div class="ldseg"><button type="button" class="${LV === 'today' ? 'on' : ''}" onclick="setLV('today')">Today</button><button type="button" class="${LV === 'week' ? 'on' : ''}" onclick="setLV('week')">7 days</button></div></div>

  // ---------- RATINGS: every salesperson's rating, by person or by section, with the remarks ----------

    renderRt();
  }
  window.setRV = (v) => { RV = v; loadRt(); };
  window.setRM = (m) => { RM = m; renderRt(); };
  function renderRt() {
    const D = RT[RV], box = $('p-rt'); if (!box) return;
    const seg = `<div class="rt-seg"><div class="ldseg">${[['today', 'Today'], ['month', 'This month'], ['last', 'Last month']].map(([k, l]) => `<button type="button" class="${RV === k ? 'on' : ''}" onclick="setRV('${k}')">${l}</button>`).join('')}</div>
      <div class="ldseg">${[['person', 'By person'], ['section', 'By section']].map(([k, l]) => `<button type="button" class="${RM === k ? 'on' : ''}" onclick="setRM('${k}')">${l}</button>`).join('')}</div></div>`;
    if (!D || D.error) { box.innerHTML = `<div class="card"><div class="card-head"><div><h2>⭐ Sales ratings</h2></div>${seg}</div><div class="empty">${esc(D ? D.error : 'No data')}</div></div>`; return; }
    const P = D.parts || {}, keys = Object.keys(P), rows = D.rows || [], tm = D.team || {};
    const cl = (v) => v == null ? '' : v >= 7 ? 'g' : v >= 5.5 ? 'a' : 'r';
    const lab = (s) => s == null ? '' : s >= 8.5 ? '🌟 Star' : s >= 7 ? '💪 Strong' : s >= 5.5 ? '📈 Growing' : '🎯 Focus mode';
    const partRow = (k, r) => { const v = r.parts ? r.parts[k] : null, nt = r.notes ? r.notes[k] : '';
      return `<div class="rt-r"><span class="rn">${P[k].icon} ${esc(P[k].label)}</span><span class="rv">${v == null ? '—' : v}</span>${v == null ? '' : `<div class="rt-bar"><i class="${cl(v)}" style="width:${Math.max(2, Math.min(100, v * 10))}%"></i></div>`}${nt ? `<div class="rt-rm">${esc(nt)}</div>` : ''}</div>`; };
    const wk = tm.weak ? `${P[tm.weak.k] ? P[tm.weak.k].label : tm.weak.k} (${tm.weak.avg})` : '—';
    const sum = `<div class="rt-sum"><div><b>${tm.avg != null ? tm.avg : '—'}</b><small>Team average</small></div><div><b>${tm.strong || 0}</b><small>Strong (7+)</small></div><div><b>${tm.focus || 0}</b><small>Focus mode (&lt;5.5)</small></div><div><b style="font-size:14px;">${esc(wk)}</b><small>Weakest section</small></div></div>`;
    let body = '';
    if (!rows.length) body = '<div class="empty">No ratings yet for this period.</div>';
    else if (RM === 'person') body = rows.map((r, i) => `<details class="rt-p"><summary><span class="rk" style="text-align:center;font-weight:900;color:var(--muted);">${['🥇', '🥈', '🥉'][i] || (i + 1)}</span><div><b>${esc(r.name)}</b><div class="rt-lb">${lab(r.score)}${r.prev != null && r.score != null ? ' · ' + (r.score >= r.prev ? '▲' : '▼') + ' ' + Math.abs(Math.round((r.score - r.prev) * 10) / 10) + ' vs before' : ''}${r.days ? ' · ' + r.days + ' days' : ''}</div></div><span class="rt-sc ${cl(r.score)}">${r.score != null ? r.score : '—'}</span></summary>
        <div class="rt-body">${keys.map(k => partRow(k, r)).join('')}${r.insight && r.insight.lift ? `<div class="rt-rm" style="background:#eff6ff;color:#1e40af;">💡 Biggest lift: ${esc((P[r.insight.lift.k] || {}).label || r.insight.lift.k)} ${r.insight.lift.from} → ${r.insight.lift.to} = +${r.insight.lift.gain} on the rating</div>` : ''}</div></details>`).join('');
    else body = keys.map(k => {
      const list = rows.filter(r => r.parts && r.parts[k] != null).sort((a, b) => a.parts[k] - b.parts[k]);
      const avg = (D.part_avg || {})[k];
      return `<details class="rt-p" open><summary><span>${P[k].icon}</span><div><b>${esc(P[k].label)}</b><div class="rt-lb">weight ${P[k].w}% · ${list.length} people · lowest first</div></div><span class="rt-sc ${cl(avg)}">${avg != null ? avg : '—'}</span></summary>
        <div class="rt-body">${list.length ? list.map(r => `<div class="rt-r"><span class="rn">${esc(r.name)}</span><span class="rv">${r.parts[k]}</span><div class="rt-bar"><i class="${cl(r.parts[k])}" style="width:${Math.max(2, Math.min(100, r.parts[k] * 10))}%"></i></div>${r.notes && r.notes[k] ? `<div class="rt-rm">${esc(r.notes[k])}</div>` : ''}</div>`).join('') : '<div class="sub">Nobody has this one yet.</div>'}</div></details>`;
    }).join('');
    box.innerHTML = `<div class="card"><div class="card-head"><div><h2>⭐ Sales ratings</h2><div class="sub">Every salesperson's rating out of 10 — the same ratings they see on My Sales, with the remarks. ${esc(D.period || '')}</div></div>${seg}</div>${sum}${body}</div>`;

  // ---------- Assign Queries lives HERE only (inside Query Boost) — the standalone page is just loaded in embed mode ----------

  window.addEventListener('message', (ev) => {

    const f = $('aqFrame'); if (f) f.style.height = Math.max(420, Math.min(6000, Math.ceil(ev.data.aqh) + 8)) + 'px';

  // ---------- QUERY BOOST (after Message Doctor): who converts queries best → who should get the most queries ----------
  function renderQb() {
    const box = $('qbTop'), bot = $('qbBot'); if (!box || !bot) return;
    const L = T && T.leaders;
    if (!L || !L.today) { box.innerHTML = '<div class="card" style="margin-bottom:14px;"><div class="empty">No query data yet.</div></div>'; bot.innerHTML = ''; return; }
    const V = L[LV] || L.today, min = L.min || 5;
    const best = (V.rows || []).filter(r => r.rank != null && r.conv > 0 && r.queries >= min).sort((a, b) => b.conv - a.conv).slice(0, 5);
    const sum = best.reduce((x, r) => x + r.conv, 0);
    const split = best.map(r => Math.round(sum > 0 ? r.conv / sum * 100 : 0));
    if (split.length) split[0] += 100 - split.reduce((x, n) => x + n, 0);          // the shares add up to exactly 100
    const medal = (i) => ['🥇', '🥈', '🥉', '4', '5'][i];
    const rows = best.map((r, i) => `<div class="ldr"><span class="rk">${medal(i)}</span><div class="nm"><b>${esc(r.name)}</b><div class="bar"><i style="width:${Math.min(100, r.conv * 2)}%"></i></div></div><div class="cv"><b class="ok">${r.conv}%</b><small>${r.orders} orders / ${r.queries} queries</small></div><div class="cv" style="min-width:74px;"><b>${split[i]}</b><small>of next 100</small></div></div>`).join('');
    box.innerHTML = `<div class="card" style="margin-bottom:14px;"><div class="card-head"><div><h2>🎯 Give the most queries to</h2>
      <div class="sub">Best orders ÷ queries ${V === L.week ? 'in the last 7 days' : 'today'} · team ${V.team_conv != null ? V.team_conv + '%' : '—'}. People under ${min} queries are not ranked yet. <b>Suggestion only</b> — assign the queries in <b>Assign queries</b> just below.</div></div>
      <div class="ldseg"><button type="button" class="${LV === 'today' ? 'on' : ''}" onclick="setLV('today')">Today</button><button type="button" class="${LV === 'week' ? 'on' : ''}" onclick="setLV('week')">7 days</button></div></div>
      ${rows ? '<div class="sub" style="font-weight:800;margin:6px 0 2px;">If you have 100 more queries to give, split them like this:</div>' + rows : '<div class="empty">Not enough queries yet — nobody has reached ' + min + ' queries.</div>'}</div>`;
    bot.innerHTML = leadersCard();
  }
  window.setLV = (v) => { LV = v; renderQb(); };
  window.goTab = (k) => document.querySelector(`.ct-tab[data-t="${k}"]`).click();

  // ---------- ALERTS ----------

      ${a.status === 'open' ? `<div class="act"><button class="btn secondary" style="width:auto;padding:6px 12px;font-size:12.5px;" onclick="askResolve(${a.id})">✅ Resolved</button></div>` : ''}

  function renderAlerts() {

    const sec = (title, list, sub) => `<div class="card" style="margin-bottom:14px;"><div class="card-head"><div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div></div>${list.length ? list.map(alertRow).join('') : '<div class="empty">None 🎉</div>'}</div>`;
    $('p-alerts').innerHTML =
      sec('Meet admin (' + meet.length + ')', meet, 'These stay until Admin / HR or a named resolver presses ✅ Resolved and writes a comment on what was done.') +
      sec('Open alerts (' + rest.length + ')', rest) +
      (digests.length ? sec('Latest digests', digests) : '') +
      sec('Recently resolved', done);
  }
  let resId = 0;
  window.askResolve = (id) => { resId = id; const a = (T.alerts || []).find(x => x.id === id) || {}; $('resSub').textContent = a.title || ''; $('resNote').value = ''; $('resErr').style.display = 'none'; $('resOk').disabled = true; $('resModal').classList.add('open'); setTimeout(() => $('resNote').focus(), 50); };
  $('resNote').oninput = () => { const ok = $('resNote').value.trim().length >= 3; $('resOk').disabled = !ok; if (ok) $('resErr').style.display = 'none'; };
  $('resNote').onkeydown = (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); $('resOk').click(); } };
  $('resCancel').onclick = () => $('resModal').classList.remove('open');
  $('resOk').onclick = async () => {
    const note = $('resNote').value.trim();
    if (note.length < 3) { $('resErr').style.display = 'block'; $('resNote').focus(); return; }
    try { await api.post('ct.resolve', { id: resId, note }); $('resModal').classList.remove('open'); showAlert('Marked resolved.'); loadTower(false); }
    catch (err) { showAlert(err.message, 'error'); }

  // ---------- MESSAGE DOCTOR ----------
  async function loadMd(refresh) {
    $('p-md').innerHTML = '<div class="card"><div class="empty">The Doctor is reading the chats…</div></div>';
    try { MD = await api.get('md.report', refresh ? { refresh: 1 } : {}); }
    catch (err) { $('p-md').innerHTML = `<div class="card">${errHtml(err)}</div>`; return; }
    renderMd(); renderIdeas();
    const open = (MD.weak || []).filter(w => w.status === 'open').length;
    const n = $('nMd'); n.textContent = open; n.style.display = open ? '' : 'none';
  }
  const TYPE_LAB = { section: 'Skill section', msg: 'Message', offer: 'Offer', flash: 'Flash offer' };
  function mTxt(it) {
    const m = it.m || {};
    if (it.itype === 'msg') return `used ${m.uses ?? 0}× · ${m.reply ?? '?'}% customers replied · ${m.orders ?? '?'}% ended in an order`;
    if (it.itype === 'offer') return `pitched ${m.pitched ?? 0}× · accepted ${m.accepted ?? 0}%`;
    if (it.itype === 'flash') return `${m.orders ?? 0} of ${m.of_orders ?? 0} orders used it (${m.share ?? 0}%) in ${m.hours ?? 0} h`;
    if (it.itype === 'section') return `team score ${m.score ?? '?'}/10${m.prev != null ? ' (was ' + m.prev + ')' : ''} over ${m.chats ?? 0} chats`;
    return '';
  }
  function mdRow(it, weak) {
    const stl = { open: 'Not fixed', changed: 'Changed — watching', improved: 'Improved ✓', cleared: 'Cleared ✓', removed: 'Removed' }[it.status] || it.status;
    const days = it.flagged_days > 1 ? ` · flagged ${it.flagged_days} days` : '';
    const fixBtn = weak && (it.status === 'open') ? `<button class="btn secondary" style="width:auto;padding:6px 12px;font-size:12.5px;" onclick="mdFix('${esc(it.ikey)}')">🔧 I fixed it</button>` : '';
    const verdict = it.verdict ? ` · after the change: <b>${esc(it.verdict)}</b>` : '';
    return `<div class="md-it"><div class="h"><div class="lab"><span class="sub" style="text-transform:uppercase;font-weight:700;">${esc(TYPE_LAB[it.itype] || it.itype)}</span><br>${esc(it.label)}</div>
      ${weak ? `<span class="st ${esc(it.status)}">${esc(stl)}</span>` : ''}${fixBtn}</div>
      <div class="sub" style="margin-top:3px;">${esc(mTxt(it))}${days}${verdict}</div>
      <div class="adv">${esc(it.advice || '')}</div>
      ${it.text ? `<div class="txt">${esc(it.text)}</div>` : ''}</div>`;
  }
  function renderMd() {
    const weak = MD.weak || [], good = MD.good || [], log = MD.log || [], cfg = MD.cfg || {};
    const stuck = weak.filter(w => w.status === 'open' && (w.flagged_days || 1) >= (cfg.ignore_days || 3));
    const byT = (t) => weak.filter(w => w.itype === t);
    const group = (t, title) => byT(t).length ? `<div class="set-h" style="padding-top:14px;">${title}</div>${byT(t).map(w => mdRow(w, true)).join('')}` : '';
    $('p-md').innerHTML = `
      ${stuck.length ? `<div class="alert error" style="margin-bottom:12px;">🚨 ${stuck.length} thing${stuck.length > 1 ? 's have' : ' has'} been flagged for ${cfg.ignore_days || 3}+ days and nobody has changed ${stuck.length > 1 ? 'them' : 'it'}. Admin is notified until they are fixed.</div>` : ''}
      <div class="card" style="margin-bottom:14px;"><div class="card-head"><div><h2>What is NOT working</h2>
        <div class="sub">Read from ${MD.chats_read ?? 0} chat screenshots / calls of the last 30 days. After you press “I fixed it” the Doctor keeps watching and tells you if it helped.</div></div>
        <button class="btn secondary" style="width:auto;padding:6px 12px;font-size:12.5px;" onclick="loadMd(true)">↻ Re-read now</button></div>
        ${weak.length ? group('section', 'Sections to fix') + group('msg', 'Messages customers ignore') + group('offer', 'Offers customers do not take') + group('flash', 'Flash offers that did not sell') : '<div class="empty"><span class="big-ok">✅ Nothing weak found.</span><br>Not enough chats yet, or everything is working.</div>'}
      </div>

      <div class="card"><div class="card-head"><div><h2>Fix log — did it help?</h2><div class="sub">Every change you marked, and what the Doctor saw afterwards.</div></div></div>
        ${log.length ? log.map(l => `<div class="md-it"><div class="h"><div class="lab">${esc(l.label)}</div><span class="st ${esc(l.status)}">${esc(l.status)}</span></div>
          <div class="sub">${l.fixed_by ? 'changed by ' + esc(l.fixed_by) + ' · ' : ''}${esc((l.fixed_at || '').slice(0, 16))}${l.verdict ? ' · result: <b>' + esc(l.verdict) + '</b>' : ' · still watching'}</div></div>`).join('') : '<div class="empty">No fixes logged yet.</div>'}</div>`;

  function renderSettings() {
    if (!T || !T.can_settings) { $('p-set').innerHTML = '<div class="card"><div class="empty">Only Admin / HR can change the settings.</div></div>'; return; }
    const c = T.cfg;
    const inp = (k, label, kind) => `<div><label>${esc(label)}</label><input data-k="${k}" ${kind === 'list' ? 'data-list="1"' : 'type="number" step="any"'} value="${esc(kind === 'list' ? (c[k] || []).join(', ') : c[k])}"></div>`;
    const grp = SET_FIELDS.map(([t, f]) => `<div class="set-h">${t}</div><div class="set-grid">${f.map(x => inp(x[0], x[1], x[2])).join('')}</div>`).join('');
    const cc = (c.comm_checks || []).map(x => x[0] + '=' + x[1]).join(', ');
    const meet = (c.meet || []).map(m => `<tr data-id="${esc(m.id)}"><td><input type="checkbox" class="mOn" ${m.on ? 'checked' : ''}></td><td>${esc(m.label)}<div class="sub">${esc(m.hint || '')}</div></td>
      <td><input type="number" step="any" class="mV1" value="${m.v1}" style="width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;"></td>
      <td><input type="number" step="any" class="mV2" value="${m.v2}" style="width:90px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;"></td></tr>`).join('');
    const res = (T.names || []).map(n => `<label><input type="checkbox" class="resCb" value="${n.id}" ${(c.resolvers || []).map(Number).includes(Number(n.id)) ? 'checked' : ''}> ${esc(n.name)}</label>`).join('');
    const md = c.md || {}, id = c.ideas || {}, ow = c.outcome_weights || {};
    $('p-set').innerHTML = `<div class="card">
      <div class="card-head"><div><h2>Control Tower settings</h2><div class="sub">Everything here can be changed any time. Saved settings apply from the next 5-minute pass.</div></div><button class="btn" id="btnSave" style="width:auto;">Save settings</button></div>
      ${grp}
      <div class="set-h">Community checkpoints</div><div class="set-grid"><div style="grid-column:1/-1;"><label>Time=orders needed, comma separated (24 h clock) — e.g. 13:00=50, 14:00=80, 15:00=110, 18:00=160</label><input id="sCc" value="${esc(cc)}"></div>
        <div style="grid-column:1/-1;"><label>Admin digest hours (24 h clock, comma separated)</label><input id="sDig" value="${esc((c.digest_hours || []).join(', '))}"></div></div>
      <div class="set-h">Who can press “Resolved” (besides Admin / HR)</div><div class="res-list">${res || '<span class="sub">No salespeople loaded.</span>'}</div>
      <div class="set-h">“Meet admin” triggers</div>
      <div class="tbl-wrap"><table class="ct"><thead><tr><th>On</th><th>When</th><th>Value 1</th><th>Value 2</th></tr></thead><tbody id="meetBody">${meet}</tbody></table></div>
      <div class="set-h">Message Doctor &amp; learning ideas</div>
      <div class="set-grid">
        <div><label>Weak if used at least (times)</label><input type="number" data-md="min_uses" value="${md.min_uses}"></div>
        <div><label>Tell Admin if not fixed after (days)</label><input type="number" data-md="ignore_days" value="${md.ignore_days}"></div>
        <div><label>Weak when customer replies below (%)</label><input type="number" data-md="weak_reply" value="${md.weak_reply}"></div>
        <div><label>Skill section judged after (chats)</label><input type="number" data-md="min_chats_section" value="${md.min_chats_section}"></div>
        <div><label>First learning idea after (days)</label><input type="number" data-id="after_days" value="${id.after_days}"></div>
        <div><label>“Rigid” if no change after (days)</label><input type="number" data-id="rigid_days" value="${id.rigid_days}"></div>
      </div>
      <div class="set-h">Outcome rating weights (%)</div>
      <div class="set-grid">${['conv:Conversion', 'ticket:Clean ticket', 'speed:Speed', 'volume:Volume'].map(s => { const [k, l] = s.split(':'); return `<div><label>${l}</label><input type="number" data-ow="${k}" value="${ow[k]}"></div>`; }).join('')}</div>
      <div class="set-h">🪔 Diwali theme</div>
      <div class="set-grid">
        <div><label>Mode</label><select id="sTheme"><option value="auto">Auto (between the dates)</option><option value="on">Always on</option><option value="off">Off</option></select></div>
        <div><label>From</label><input type="date" id="sFrom" value="${esc(c.theme_from)}"></div>
        <div><label>To</label><input type="date" id="sTo" value="${esc(c.theme_to)}"></div>
        <div style="align-self:end;" class="sub">Right now: <b>${T.theme && T.theme.on ? 'ON 🪔' : 'off'}</b></div>
      </div>
      <div style="padding:6px 18px 18px;"><button class="btn" id="btnSave2" style="width:auto;">Save settings</button></div>
    </div>`;
    $('sTheme').value = c.theme || 'auto';
    $('btnSave').onclick = $('btnSave2').onclick = saveSettings;
  }
  async function saveSettings() {
    const b = {};
    document.querySelectorAll('#p-set [data-k]').forEach(el => { b[el.dataset.k] = el.dataset.list ? el.value.split(',').map(x => parseFloat(x)).filter(x => x > 0) : parseFloat(el.value); });
    b.comm_checks = $('sCc').value.split(',').map(x => x.trim().split('=')).filter(x => x.length === 2).map(x => [x[0].trim(), parseInt(x[1], 10)]);
    b.digest_hours = $('sDig').value.split(',').map(x => parseInt(x, 10)).filter(x => x >= 0 && x <= 23);
    b.resolvers = [...document.querySelectorAll('.resCb:checked')].map(x => parseInt(x.value, 10));
    b.meet = [...document.querySelectorAll('#meetBody tr')].map(tr => ({ id: tr.dataset.id, on: tr.querySelector('.mOn').checked ? 1 : 0, v1: parseFloat(tr.querySelector('.mV1').value) || 0, v2: parseFloat(tr.querySelector('.mV2').value) || 0 }));
    b.md = {}; document.querySelectorAll('[data-md]').forEach(el => b.md[el.dataset.md] = parseFloat(el.value));
    b.ideas = {}; document.querySelectorAll('[data-id]').forEach(el => b.ideas[el.dataset.id] = parseFloat(el.value));
    b.outcome_weights = {}; document.querySelectorAll('[data-ow]').forEach(el => b.outcome_weights[el.dataset.ow] = parseFloat(el.value));
    b.theme = $('sTheme').value; b.theme_from = $('sFrom').value; b.theme_to = $('sTo').value;
    try {
      await api.post('ct.cfg_set', b);
      showAlert('Settings saved.');
      try { localStorage.removeItem('hrms_theme_cache'); if (window.hrmsTheme) window.hrmsTheme.refresh(); } catch (e) {}
      await loadTower(true);
    } catch (err) { showAlert(err.message, 'error'); }
  }

  $('btnRefresh').onclick = () => { loadTower(true); if (MD) loadMd(true); if (BM) loadBench(); };
  $('datePick').onchange = () => loadTower(false);
  loadTower(false);
  loadMd(false);
  setInterval(() => { if (!document.hidden && $('datePick').value === (T && T.today)) loadTower(false); }, 120000);
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
