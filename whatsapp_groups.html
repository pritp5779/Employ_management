<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Groups — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=1">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>WhatsApp Groups</h1></div>
    <div class="content">
      <div id="alertBox"></div>
      <div class="card">
        <div class="card-head">
          <h2 id="cardTitle">Groups</h2>
          <div style="display:flex; gap:10px; align-items:center;">
            <div class="search-box"><input type="text" id="tableSearch" placeholder="Search groups..."></div>
            <button class="btn" id="btnAddNew">+ Add Group</button>
          </div>
        </div>
        <table>
          <thead><tr><th>Group Name</th><th>Members</th><th>Created</th><th style="width:140px;">Actions</th></tr></thead>
          <tbody id="tableBody">
            <tr><td colspan="4" class="loading">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h3 id="modalTitle">Add Group</h3>
    <div id="modalAlert"></div>
    <form id="groupForm">
      <input type="hidden" id="recordId">
      <div class="field">
        <label for="recordName">Group Name</label>
        <input type="text" id="recordName" required maxlength="150" placeholder="e.g. Dispatch Team">
      </div>
      <div class="actions">
        <button type="button" class="btn secondary" id="btnCancel">Cancel</button>
        <button type="submit" class="btn" id="btnSave">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="membersModal">
  <div class="modal">
    <h3 id="membersTitle">Members</h3>
    <div id="membersBody" style="max-height:320px; overflow-y:auto;"></div>
    <div class="actions">
      <button type="button" class="btn secondary" id="btnMembersClose">Close</button>
    </div>
  </div>
</div>

<script src="assets/js/config.js?v=1"></script>
<script src="assets/js/api.js?v=1"></script>
<script src="assets/js/layout.js?v=1"></script>
<script>
  guardPage();
  renderSidebar('whatsapp_groups');

  const tableBody = document.getElementById('tableBody');
  const alertBox = document.getElementById('alertBox');
  const overlay = document.getElementById('formModal');
  const membersOverlay = document.getElementById('membersModal');
  const modalAlert = document.getElementById('modalAlert');
  let allRows = [];

  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => (alertBox.innerHTML = ''), 4000);
  }

  function openModal(row = null) {
    document.getElementById('groupForm').reset();
    modalAlert.innerHTML = '';
    if (row) {
      document.getElementById('modalTitle').textContent = 'Edit Group';
      document.getElementById('recordId').value = row.group_id;
      document.getElementById('recordName').value = row.group_name;
    } else {
      document.getElementById('modalTitle').textContent = 'Add Group';
      document.getElementById('recordId').value = '';
    }
    overlay.classList.add('open');
  }
  function closeModal() { overlay.classList.remove('open'); }

  document.getElementById('btnAddNew').addEventListener('click', () => openModal());
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  document.getElementById('btnMembersClose').addEventListener('click', () => membersOverlay.classList.remove('open'));
  membersOverlay.addEventListener('click', (e) => { if (e.target === membersOverlay) membersOverlay.classList.remove('open'); });

  function renderTable(rows) {
    document.getElementById('cardTitle').textContent = `Groups (${rows.length})`;
    if (rows.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="4" class="empty-state">No groups yet — add your WhatsApp group names here, then select them while adding employees.</td></tr>';
      return;
    }
    tableBody.innerHTML = rows.map(r => `
      <tr>
        <td>${r.group_name}</td>
        <td><button style="background:none; border:none; color:#1d4ed8; cursor:pointer; font-weight:600; padding:0;" onclick="viewMembers(${r.group_id}, '${r.group_name.replace(/'/g, "\\'")}')">${r.member_count} member${r.member_count == 1 ? '' : 's'}</button></td>
        <td>${r.created_at ? new Date(r.created_at).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}) : '—'}</td>
        <td>
          <div class="row-actions">
            <button onclick="editRow(${r.group_id})">Edit</button>
            <button class="danger-link" onclick="deleteRow(${r.group_id}, '${r.group_name.replace(/'/g,"\\'")}')">Delete</button>
          </div>
        </td>
      </tr>`).join('');
  }

  async function loadGroups() {
    try {
      const data = await api.get('whatsapp_groups.list');
      allRows = data.groups;
      renderTable(allRows);
    } catch (err) {
      tableBody.innerHTML = `<tr><td colspan="4"><div class="alert error">${err.message}</div></td></tr>`;
    }
  }

  window.editRow = function (id) {
    const row = allRows.find(r => r.group_id == id);
    openModal(row);
  };

  window.deleteRow = async function (id, name) {
    if (!confirm(`Delete group "${name}"?\n\nEmployees stay — only the group and its mappings are removed.`)) return;
    try {
      await api.post('whatsapp_groups.delete', { group_id: id });
      showAlert('Group deleted.');
      loadGroups();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  };

  window.viewMembers = async function (id, name) {
    document.getElementById('membersTitle').textContent = `Members — ${name}`;
    document.getElementById('membersBody').innerHTML = '<div class="loading" style="padding:10px 0;">Loading...</div>';
    membersOverlay.classList.add('open');
    try {
      const data = await api.get('whatsapp_groups.members', { group_id: id });
      const members = data.members || [];
      document.getElementById('membersBody').innerHTML = members.length === 0
        ? '<div style="color:#888; padding:10px 0;">No employees mapped to this group yet.</div>'
        : members.map(m => `
            <div style="padding:8px 0; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center; gap:10px;">
              <a href="employee_detail.html?id=${m.employee_id}">${m.full_name} <span class="badge">${m.employee_code}</span></a>
              <span style="color:#888; font-size:13px;">${m.mobile || ''}</span>
            </div>`).join('');
    } catch (err) {
      document.getElementById('membersBody').innerHTML = `<div class="alert error">${err.message}</div>`;
    }
  };

  document.getElementById('groupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('recordId').value;
    const name = document.getElementById('recordName').value.trim();
    const btn = document.getElementById('btnSave');
    btn.disabled = true;
    try {
      const payload = { group_name: name };
      if (id) payload.group_id = id;
      await api.post('whatsapp_groups.save', payload);
      closeModal();
      showAlert(id ? 'Group updated.' : 'Group added.');
      loadGroups();
    } catch (err) {
      modalAlert.innerHTML = `<div class="alert error">${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('tableSearch').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    renderTable(allRows.filter(r => r.group_name.toLowerCase().includes(q)));
  });

  loadGroups();
</script>
</body>
</html>
