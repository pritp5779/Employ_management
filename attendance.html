<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Attendance — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  /* Camera stays off until a punch button is tapped. */
  .cam-idle{display:flex; flex-direction:column; align-items:center; gap:8px; padding:26px 12px; border:1px dashed var(--line); border-radius:12px; color:var(--muted); font-size:13px; text-align:center;}
  .cam-idle svg{width:34px; height:34px;}
  .cam-panel{position:relative; width:100%; max-width:400px; margin:0 auto; border-radius:14px; overflow:hidden; background:#0b0b0f;
    animation:camIn .32s cubic-bezier(.2,.8,.2,1);}
  .cam-panel[hidden]{display:none;}
  @keyframes camIn{from{opacity:0; transform:translateY(14px) scale(.98);}}
  .cam-panel video{display:block; width:100%; transform:scaleX(-1);}   /* mirror, like a selfie */
  /* Face guide oval: dashed while searching, green once matched. */
  .cam-oval{position:absolute; left:50%; top:47%; width:52%; aspect-ratio:3/4; transform:translate(-50%,-50%); border-radius:50%;
    border:3px dashed rgba(255,255,255,.6); box-shadow:0 0 0 999px rgba(0,0,0,.28); transition:border-color .25s, box-shadow .25s; pointer-events:none;}
  .cam-oval.ok{border:3px solid #22c55e; box-shadow:0 0 0 999px rgba(0,0,0,.2), 0 0 16px #22c55e;}
  .cam-live{position:absolute; top:10px; left:10px; display:flex; align-items:center; gap:6px; color:#fff; font-size:11.5px; font-weight:600;
    background:rgba(0,0,0,.35); padding:4px 9px; border-radius:12px;}
  .cam-live b{width:8px; height:8px; border-radius:50%; background:#ef4444; animation:camBlink 1s infinite;}
  @keyframes camBlink{50%{opacity:.3;}}
  .cam-cancel{position:absolute; top:8px; right:8px; width:36px; height:36px; min-height:0; border-radius:50%; border:none; background:rgba(0,0,0,.45);
    color:#fff; font-size:17px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .cam-cancel:focus-visible{outline:3px solid #fff; outline-offset:2px;}
  .cam-overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:14px;
    text-align:center; padding:12px; background:rgba(0,0,0,.45);}
  .cam-overlay[hidden]{display:none;}
  .punch-btns{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap;}
  .punch-btns .btn{min-width:150px;}
  .done-note{text-align:center; margin-top:12px; font-size:14px; font-weight:600; color:var(--ok-fg,#0f7a41);}
  .done-note[hidden]{display:none;}
  @media (max-width:820px){ .punch-btns .btn{flex:1 1 140px; min-height:48px; font-size:15px;} }
  @media (prefers-reduced-motion: reduce){ .cam-panel{animation:none;} .cam-live b{animation:none;} .cam-oval{transition:none;} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>Attendance</h1></div>
    <div class="content">
      <div id="alertBox"></div>

      <div class="card" style="max-width:560px;">
        <div class="card-head"><h2 id="statusTitle">Today</h2></div>
        <div style="padding:16px 20px;">
          <div id="todayStatus" class="loading" style="padding:0;">Loading...</div>
        </div>
      </div>

      <div class="card" style="max-width:560px;">
        <div class="card-head"><h2 id="camTitle">Punch</h2></div>
        <div style="padding:16px 20px;">
          <div id="camHint" style="font-size:13px; color:var(--muted); margin-bottom:10px;">Tap Punch In or Punch Out — the camera opens only then, and closes when you're done.</div>

          <div id="camIdle" class="cam-idle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M9.5 5H15l1.5 2H20a1 1 0 0 1 1 1v9.5M17 19H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1h2"/><path d="M9.9 10.3A3 3 0 0 0 14 14.4"/></svg>
            Camera is off until you punch
          </div>

          <div id="camPanel" class="cam-panel" hidden>
            <video id="cam" playsinline muted></video>
            <div id="camOval" class="cam-oval" aria-hidden="true"></div>
            <div class="cam-live" aria-hidden="true"><b></b>Camera on</div>
            <button type="button" class="cam-cancel" id="btnCancel" aria-label="Cancel and turn the camera off">✕</button>
            <div id="camOverlay" class="cam-overlay">Starting camera…</div>
          </div>
          <canvas id="snap" style="display:none;"></canvas>

          <div class="punch-btns">
            <button class="btn" id="btnPunchIn" disabled>Punch In</button>
            <button class="btn secondary" id="btnPunchOut" disabled>Punch Out</button>
          </div>
          <div id="doneNote" class="done-note" hidden>You're done for today ✓</div>
          <div id="verifyMsg" role="status" aria-live="polite" style="text-align:center; margin-top:10px; font-size:13.5px; min-height:20px;"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/layout.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script>
  guardPage();
  renderSidebar('attendance');

  const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model';
  const MATCH_THRESHOLD = 0.45;  // euclidean distance — lower is stricter
  const MATCHES_NEEDED = 3;      // consecutive matching frames; one mismatch resets the count
  const MIN_FACE_FRAC = 0.22;    // face must span at least this share of the frame width
  const OTHER_MARGIN = 0.08;     // live face must be this much closer to YOU than to anyone else
  let slowDevice = false;        // set when the models had to fall back to the CPU

  const alertBox = document.getElementById('alertBox');
  const video = document.getElementById('cam');
  const panel = document.getElementById('camPanel');
  const idle = document.getElementById('camIdle');
  const overlay = document.getElementById('camOverlay');
  const oval = document.getElementById('camOval');
  const verifyMsg = document.getElementById('verifyMsg');
  const btnIn = document.getElementById('btnPunchIn');
  const btnOut = document.getElementById('btnPunchOut');

  let enrolledDescriptor = null; // Float32Array
  let otherDescriptors = [];     // a few other employees' fingerprints, for the look-alike check
  let enrollMode = false;
  let faceLoaded = false;        // face.get answered (decides Enroll vs Punch)
  let busy = false;
  let stream = null;             // the live camera, only while a punch runs
  let cancelled = false;         // ✕ tapped, or the app was left mid-punch

  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => (alertBox.innerHTML = ''), 5000);
  }
  function setMsg(text, color) {
    verifyMsg.textContent = text;
    verifyMsg.style.color = color || 'var(--muted)';
  }

  // ---------- Today's status ----------
  async function loadToday() {
    try {
      const data = await api.get('attendance.today');
      const a = data.attendance;
      const fmt = (t) => t ? new Date(t.replace(' ', 'T')).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) : '—';
      document.getElementById('todayStatus').innerHTML = `
        <div style="display:flex; gap:24px; flex-wrap:wrap;">
          <div><div style="font-size:11.5px; color:var(--muted); text-transform:uppercase;">Punch In</div><div style="font-size:20px; font-weight:600;">${fmt(a && a.punch_in)}</div></div>
          <div><div style="font-size:11.5px; color:var(--muted); text-transform:uppercase;">Punch Out</div><div style="font-size:20px; font-weight:600;">${fmt(a && a.punch_out)}</div></div>
        </div>`;
      if (!enrollMode) {
        btnIn.style.display = (a && a.punch_in) ? 'none' : '';
        btnOut.style.display = (a && a.punch_in && !a.punch_out) ? '' : 'none';
      }
      const done = !!(a && a.punch_in && a.punch_out);
      document.getElementById('doneNote').hidden = !done;
      if (!stream) idle.style.display = done ? 'none' : '';   // don't show "camera off" while it's on
    } catch (err) {
      document.getElementById('todayStatus').innerHTML = `<div class="alert error">${err.message}</div>`;
    }
  }

  // ---------- Face models: loaded once, in the background ----------
  // Loading starts as the page opens so the camera is ready quickly when a
  // button is tapped; a punch simply waits for it if it isn't done yet.
  let modelsPromise = null;
  let modelsLoaded = false;
  function loadModels() {
    if (!modelsPromise) {
      modelsPromise = (async () => {
        // Face fingerprints need 32-bit maths. Ask the graphics chip for it
        // (fast); only if this device can't provide it, fall back to the
        // processor (exact but slow) — never the other way round.
        const tf = faceapi.tf;
        if (tf && tf.env) {
          try { tf.env().set('WEBGL_FORCE_F16_TEXTURES', false); } catch (e) {}
          try { await tf.ready(); } catch (e) {}
          let exact = true;
          try { exact = tf.getBackend() !== 'webgl' || tf.env().getBool('WEBGL_RENDER_FLOAT32_ENABLED'); } catch (e) {}
          if (!exact) { try { await tf.setBackend('cpu'); await tf.ready(); slowDevice = true; } catch (e) {} }
        }
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
          faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
          faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
        ]);
      })().catch(err => { modelsPromise = null; throw new Error('Could not load the face check — check your internet and tap again.'); });
    }
    return modelsPromise;
  }

  // Whether this person still needs to enroll decides what the first button does.
  async function loadFace() {
    try {
      const faceData = await api.get('face.get');
      otherDescriptors = (faceData.others || []).map(d => { try { return new Float32Array(JSON.parse(d)); } catch (e) { return null; } }).filter(Boolean);
      if (faceData.descriptor) {
        enrolledDescriptor = new Float32Array(JSON.parse(faceData.descriptor));
        enrollMode = false;
        document.getElementById('camHint').textContent = 'Tap Punch In or Punch Out — the camera opens only then. Look at it and blink once when asked; it closes as soon as you\'re done.';
      } else {
        enrollMode = true;
        document.getElementById('camTitle').textContent = 'First time: enroll your face';
        document.getElementById('camHint').textContent = 'Your face is not enrolled yet. Tap Enroll My Face, look straight at the camera in good light. This is done only once.';
        btnIn.textContent = 'Enroll My Face';
        btnIn.style.display = '';
        btnOut.style.display = 'none';
      }
      faceLoaded = true;
      btnIn.disabled = false;
      btnOut.disabled = false;
    } catch (err) {
      setMsg(err.message, 'var(--bad-fg)');
    }
  }

  // ---------- Camera: on only while a punch runs ----------
  async function openCamera() {
    idle.style.display = 'none';
    panel.hidden = false;
    oval.classList.remove('ok');
    overlay.hidden = false;
    overlay.textContent = 'Starting camera…';
    setMsg('');
    try {
      // Ask for the front camera strictly first — a loose request lets iOS
      // pick or switch cameras. Fall back to the loose form on devices
      // that don't label their cameras.
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: 'user' }, width: { ideal: 640 } }, audio: false });
      } catch (strict) {
        if (strict && strict.name !== 'OverconstrainedError' && strict.name !== 'NotFoundError') throw strict;
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 } }, audio: false });
      }
    } catch (err) {
      if (err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')) {
        throw new Error('Camera permission is blocked — allow camera access for this site in your browser settings, then tap again.');
      }
      if (err && err.name === 'NotFoundError') throw new Error('No camera found on this device.');
      throw new Error('Could not start the camera — close other apps using it and tap again.');
    }
    if (cancelled) { closeCamera(); return; }     // ✕ tapped while the permission prompt was up
    video.srcObject = stream;
    await new Promise(r => (video.readyState >= 1 ? r() : (video.onloadedmetadata = r)));
    await video.play().catch(() => {});
    // "Ready" arrives before the first real picture on both Android and
    // iOS. A face check on that empty frame finds nothing — which is what
    // closed the camera straight away on enrolment. Wait for frames first.
    const t0 = Date.now();
    while (!cancelled && Date.now() - t0 < 8000 && !(video.readyState >= 2 && video.videoWidth > 0)) {
      await new Promise(r => setTimeout(r, 100));
    }
    if (cancelled) { closeCamera(); return; }
    if (!(video.videoWidth > 0)) throw new Error('The camera started but sent no picture — close other apps using it and tap again.');
    await new Promise(r => setTimeout(r, 350));    // let exposure settle
    overlay.hidden = true;
  }

  // Stops every camera track (turns the camera light off) and hides the view.
  function closeCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null;
    video.onloadedmetadata = null;
    panel.hidden = true;
    oval.classList.remove('ok');
    idle.style.display = document.getElementById('doneNote').hidden ? '' : 'none';
  }

  function detectOnce() {
    return faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 320 }))
      .withFaceLandmarks()
      .withFaceDescriptor();
  }

  function eyeAspectRatio(eye) {
    const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    return (d(eye[1], eye[5]) + d(eye[2], eye[4])) / (2 * d(eye[0], eye[3]));
  }

  async function enrollFlow() {
    setMsg('Look at the camera and hold still...', 'var(--accent)');
    // Keep looking until three good captures are in, rather than failing
    // on the first frame without a face (people need a moment to line up).
    const samples = [];
    const t0 = Date.now();
    const limit = slowDevice ? 30000 : 20000;
    let lastHint = '';
    while (samples.length < 3 && !cancelled && Date.now() - t0 < limit) {
      const det = await detectOnce();
      if (cancelled) return;
      let hint = '';
      if (!det) hint = 'No face found yet — face the camera in good light.';
      else if (det.detection.box.width < MIN_FACE_FRAC * video.videoWidth) hint = 'Come closer — your face must fill the oval.';
      if (hint) {
        oval.classList.remove('ok');
        if (hint !== lastHint) { setMsg(hint, 'var(--accent)'); lastHint = hint; }
        await new Promise(r => setTimeout(r, 150));
        continue;
      }
      oval.classList.add('ok');
      samples.push(det.descriptor);
      setMsg(`Hold still... capture ${samples.length} of 3`, 'var(--accent)');
      lastHint = '';
      await new Promise(r => setTimeout(r, 400));
    }
    if (cancelled) return;
    if (samples.length < 3) {
      setMsg(lastHint === 'Come closer — your face must fill the oval.'
        ? 'Face too far from the camera — hold the phone closer and tap Enroll again.'
        : 'No face found — face the camera in good light and tap Enroll again.', 'var(--bad-fg)');
      return;
    }
    // The three captures must agree with each other; if they don't, the
    // fingerprint is unreliable (moving, poor light, GPU precision).
    for (let i = 1; i < samples.length; i++) {
      if (faceapi.euclideanDistance(samples[0], samples[i]) > 0.35) {
        setMsg('Could not get a steady reading — hold still in good light and tap Enroll again.', 'var(--bad-fg)');
        return;
      }
    }
    const avg = new Array(128).fill(0);
    samples.forEach(s => s.forEach((v, i) => (avg[i] += v / samples.length)));
    // A fingerprint that already matches another employee would let two
    // people punch for each other; ask for a better capture instead.
    const avgF = new Float32Array(avg);
    for (const o of otherDescriptors) {
      if (faceapi.euclideanDistance(avgF, o) < MATCH_THRESHOLD) {
        setMsg('This capture resembles another employee too closely — move to better light, face the camera straight on, and tap Enroll again.', 'var(--bad-fg)');
        return;
      }
    }

    await api.post('face.enroll', { descriptor: avg });
    showAlert('Face enrolled. You can punch in now.');
    enrolledDescriptor = new Float32Array(avg);
    enrollMode = false;
    document.getElementById('camTitle').textContent = 'Punch';
    btnIn.textContent = 'Punch In';
    document.getElementById('camHint').textContent = 'Tap Punch In or Punch Out — the camera opens only then. Look at it and blink once when asked.';
    setMsg('');
    loadToday();
  }

  async function verifyAndPunch(type) {
    // One combined loop: face matching AND liveness run together from the
    // first frame, so an early blink counts. Liveness = a blink (relative to
    // YOUR normal eye shape — works with glasses) OR a slight head turn.
    setMsg('Look at the camera...', 'var(--accent)');

    let matches = 0;           // consecutive matching frames
    let bestDist = Infinity;   // closest score seen, for the failure message
    let tooFar = false;
    let frame = 0;
    let baselineEAR = 0;
    let sawClosed = false;
    let live = false;
    let noseBase = null;
    const t0 = Date.now();
    const limit = slowDevice ? 30000 : 18000;
    let lookalike = false;

    while (Date.now() - t0 < limit && !cancelled) {
      frame++;
      const needDescriptor = matches < MATCHES_NEEDED && (slowDevice || frame % 2 === 1);
      let det;
      if (needDescriptor) {
        det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 256 }))
          .withFaceLandmarks().withFaceDescriptor();
      } else {
        det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 256 }))
          .withFaceLandmarks();
      }
      if (cancelled) return;

      if (det) {
        // Face match: several frames in a row must match; a frame that
        // doesn't resets the count, so a stranger can't collect matches
        // from occasional lucky frames.
        if (det.descriptor && matches < MATCHES_NEEDED) {
          if (det.detection.box.width < MIN_FACE_FRAC * video.videoWidth) {
            tooFar = true;
            setMsg('Come closer — your face must fill the oval.', 'var(--accent)');
          } else {
            tooFar = false;
            const dist = faceapi.euclideanDistance(det.descriptor, enrolledDescriptor);
            bestDist = Math.min(bestDist, dist);
            // Look-alike guard: the face must be clearly closer to YOU than
            // to any other employee. Works whatever the phone's maths does —
            // a stranger who scores near you scores near the others too.
            let nearestOther = Infinity;
            for (const o of otherDescriptors) nearestOther = Math.min(nearestOther, faceapi.euclideanDistance(det.descriptor, o));
            const distinct = nearestOther - dist >= OTHER_MARGIN;
            if (dist < MATCH_THRESHOLD && !distinct) lookalike = true;
            matches = (dist < MATCH_THRESHOLD && distinct) ? matches + 1 : 0;
          }
        }
        oval.classList.toggle('ok', matches >= MATCHES_NEEDED);

        // Liveness A: blink, relative to this person's own open-eye shape
        const ear = (eyeAspectRatio(det.landmarks.getLeftEye()) + eyeAspectRatio(det.landmarks.getRightEye())) / 2;
        if (ear > baselineEAR) baselineEAR = ear; // learn their normal open eyes
        if (baselineEAR > 0.12) {
          if (ear < baselineEAR * 0.72) sawClosed = true;
          else if (sawClosed && ear > baselineEAR * 0.9) live = true;
        }

        // Liveness B: slight head turn (easier with glasses)
        const nose = det.landmarks.getNose()[3];
        const box = det.detection.box;
        const rel = (nose.x - box.x) / box.width;
        if (noseBase === null) noseBase = rel;
        if (Math.abs(rel - noseBase) > 0.10) live = true;

        if (matches >= MATCHES_NEEDED && !live) setMsg('Face matched ✓ Blink once or turn your head slightly...', 'var(--accent)');
        if (matches >= MATCHES_NEEDED && live) break;
      }
      await new Promise(r => setTimeout(r, slowDevice ? 20 : 60));
    }
    if (cancelled) return;

    if (matches < MATCHES_NEEDED) {
      const score = bestDist < Infinity ? ` (closest score ${bestDist.toFixed(2)}, needs under ${MATCH_THRESHOLD})` : '';
      if (lookalike) setMsg('Face not recognized — this face also resembles another employee, so it was refused. Re-enrol in good light if this is really you.', 'var(--bad-fg)');
      else setMsg((tooFar ? 'Face too far from the camera' : 'Face not recognized') + ' — tap again in better light, closer to the camera.' + score, 'var(--bad-fg)');
      return;
    }
    if (!live) {
      setMsg('Could not confirm a live face — tap again, then blink or turn your head slightly.', 'var(--bad-fg)');
      return;
    }

    // Capture the verified frame, then turn the camera off before saving.
    setMsg('Verified ✓ Saving...', 'var(--ok-fg)');
    const canvas = document.getElementById('snap');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    closeCamera();
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.8));

    const formData = new FormData();
    formData.append('type', type);
    formData.append('photo', blob, 'punch.jpg');

    const res = await fetch(api.buildUrl('attendance.punch'), {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + api.token() },
      body: formData,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Punch failed.');

    showAlert(data.message);
    setMsg('');
    loadToday();
  }

  async function handle(type) {
    if (busy || !faceLoaded) return;
    busy = true;
    cancelled = false;
    [btnIn, btnOut].forEach(b => (b.disabled = true));
    try {
      // Open the camera at once (while the tap is fresh — iOS wants the
      // video started close to the tap) and load the face models at the
      // same time, instead of making the camera wait for a 6 MB download.
      const camReady = openCamera();
      const modelsReady = loadModels();
      camReady.catch(() => {});                     // reported below, not as unhandled
      if (!modelsLoaded) setMsg('Loading the face check… first time can take a few seconds', 'var(--accent)');
      await modelsReady;
      modelsLoaded = true;
      if (cancelled) return;
      await camReady;
      if (cancelled) return;
      if (enrollMode) await enrollFlow();
      else await verifyAndPunch(type);
    } catch (err) {
      if (!cancelled) setMsg(err.message, 'var(--bad-fg)');
    } finally {
      closeCamera();        // always off afterwards: success, failure or cancel
      [btnIn, btnOut].forEach(b => (b.disabled = false));
      busy = false;
    }
  }

  btnIn.addEventListener('click', () => handle('in'));
  btnOut.addEventListener('click', () => handle('out'));

  document.getElementById('btnCancel').addEventListener('click', () => {
    cancelled = true;
    closeCamera();
    setMsg('Cancelled — camera off, nothing saved.');
  });

  // Leaving the app (switching apps, locking the phone, closing the tab)
  // mid-punch turns the camera off instead of leaving it running.
  function stopOnLeave() {
    if (!stream) return;
    cancelled = true;
    closeCamera();
    setMsg('Camera turned off because you left the app — tap again to punch.');
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopOnLeave(); });
  window.addEventListener('pagehide', stopOnLeave);

  loadToday();
  loadFace();
  loadModels().then(() => { modelsLoaded = true; }).catch(() => { /* retried on tap, with a clear message */ });
</script>
