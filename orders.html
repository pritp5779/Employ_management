<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Orders — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  .plat-cards{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px;}
  .plat-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 14px 10px; border-top:4px solid var(--c);}
  .plat-card h3{margin:0 0 8px; font-size:14px; color:var(--c); display:flex; justify-content:space-between; align-items:baseline;}
  .plat-card h3 small{font-size:11px; color:var(--muted); font-weight:400;}
  .plat-card .li{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:5px 0; border-bottom:1px dashed var(--line); font-size:13px;}
  .plat-card .li span{color:var(--muted);} .plat-card .li b{font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .plat-card .li[data-go]{cursor:pointer;} .plat-card .li[data-go]:hover{background:#f3f4f6;} .plat-card .li[data-go]:hover span{text-decoration:underline;}
  .plat-card .li.q span{color:#1d4ed8;} .plat-card .li.c span{color:#b45f06;}
  .plat-card .li.t{border-bottom:none; background:#f9fafb; margin:3px -6px 0; padding:6px 6px; border-radius:6px;} .plat-card .li.t b{font-size:14px;}
  .plat-card .g{color:#0f7a41;} .plat-card .a{color:#b45f06;} .plat-card .r{color:#c81e1e;}
  /* Phones: cards stack, and each card's nine figures become a 3×3 grid of
     small tiles (label above value) so all three platforms fit in about
     one screen instead of 27 long lines. */
  @media (max-width:820px){
    .plat-cards{grid-template-columns:1fr; gap:10px;}
    .plat-card{padding:10px 12px 12px;}
    .plat-card h3{font-size:13.5px; margin-bottom:8px;}
    .plat-lines{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:6px;}
    .plat-card .li{flex-direction:column; align-items:flex-start; gap:2px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:#fafbfc; font-size:12px; min-width:0;}
    .plat-card .li span{font-size:10px; line-height:1.2;}
    .plat-card .li b{font-size:13px; max-width:100%; overflow:hidden; text-overflow:ellipsis;}
    .plat-card .li.q{background:#f3f7ff; border-color:#dbe7ff;} .plat-card .li.c{background:#fff8ec; border-color:#fbe4bd;}
    .plat-card .li.t{margin:0; padding:6px 8px; background:#111827; border-color:#111827;} .plat-card .li.t span{color:#9ca3af;} .plat-card .li.t b{color:#fff;}
  }
  /* Stat cards carry a full and a short label/amount; only one shows at a
     time. Kept here as well as in style.css so the cards render correctly
     even when a browser or local server has an older stylesheet. */
  .lbl-short, .amt-short{display:none;}
  @media (max-width:820px){ .lbl-full, .amt-full{display:none;} .lbl-short{display:inline;} .amt-short{display:block;} }
  .topbar .tb-title{display:flex; align-items:center; gap:12px; min-width:0;}
  .topbar .tb-title h1{margin:0; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .topbar .back-btn{display:inline-flex; align-items:center; gap:4px; flex:0 0 auto !important; width:auto;
    height:34px; padding:0 12px 0 8px; border:1px solid var(--line); border-radius:8px; background:#fff;
    color:var(--ink,#111827); font-size:13px; font-weight:600; cursor:pointer; transition:background .15s ease, border-color .15s ease;}
  .topbar .back-btn:hover{background:#f6f7f9; border-color:#cfd4dc;}
  .topbar .back-btn:active{transform:scale(.97);}
  .topbar .back-btn:focus-visible{outline:3px solid rgba(37,99,235,.35); outline-offset:2px;}
  .topbar .back-btn[hidden]{display:none;}
  @media (max-width:820px){
    .topbar .tb-title{width:100%; flex-wrap:nowrap !important;}
    .topbar .tb-title h1{font-size:16px;}
  }
  /* ---- Employee sheet (Admin / HR): tabs + one-row-per-employee table ---- */
  .vtabs{display:flex; gap:6px; margin:4px 0 12px; flex-wrap:wrap; align-items:center;}
  .vtabs button{background:#fff; color:var(--ink); border:1px solid var(--line); padding:10px 16px; border-radius:22px; font-size:13.5px; font-weight:700; cursor:pointer; min-height:0; width:auto;}
  .vtabs button.on{background:var(--navy-900); color:#fff; border-color:var(--navy-900);}
  .vtabs .cnt{opacity:.75; font-weight:600; margin-left:4px;}
  .es-tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;}
  .es-tools input,.es-tools select{padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; background:#fff; min-height:0; width:auto;}
  .es-tools input[type=search]{width:190px;}
  .es-chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:0 0 10px;}
  .es-chips .lbl{font-size:12px; color:var(--muted); font-weight:600; margin-right:2px;}
  .es-chip{border:1px solid var(--line); background:#fff; color:var(--ink); padding:5px 11px; border-radius:16px; font-size:12px; cursor:pointer; min-height:0; font-weight:600; width:auto;}
  .es-chip.on{background:var(--navy-900); color:#fff; border-color:var(--navy-900);}
  .es-wrap{background:#fff; border:1px solid var(--line); border-radius:10px; overflow-x:auto; min-height:200px; -webkit-overflow-scrolling:touch;}
  table.es-tbl{border-collapse:separate; border-spacing:0; width:100%; font-size:12.5px; white-space:nowrap;}
  .es-tbl th,.es-tbl td{padding:8px 10px; border-bottom:1px solid #eef0f3; text-align:right; background:#fff;}
  .es-tbl .l{text-align:left;}
  .es-tbl thead th{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.2px; background:#fafafa; border-bottom:1px solid var(--line);}
  .es-tbl thead tr.g1 th{text-align:center; font-size:11px; letter-spacing:.4px; color:#fff; border-bottom:none; padding:6px 10px;}
  .es-tbl thead tr.g1 th.g-emp{position:sticky; left:0; z-index:5;}
  .g-emp{background:#111827 !important;} .g-tgt{background:#2563eb !important;} .g-ord{background:#0f7a41 !important;}
  .g-qry{background:#7c3aed !important;} .g-cmp{background:#b45309 !important;} .g-pay{background:#0e7490 !important;}
  .g-rat{background:#be185d !important;} .g-clr{background:#475569 !important;}
  .es-tbl .gl{border-left:2px solid #e5e7eb;}
  .es-tbl tbody tr:hover td{background:#f8faff;}
  .es-tbl .st{position:sticky; left:0; z-index:2; min-width:218px;}
  .es-tbl .nm{position:sticky; left:218px; z-index:2; min-width:150px; box-shadow:2px 0 0 #eef0f3;}
  .es-tbl thead th.st,.es-tbl thead th.nm{z-index:4;}
  .es-tbl tr.abs td{background:#fff8f8;} .es-tbl tr.abs:hover td{background:#fff1f1;} .es-tbl tr.abs .dim{color:#b9bec7;}
  .es-tbl tr.un td{background:#f8fafc; color:var(--muted);}
  .es-tbl tfoot td{background:#f1f5f9; font-weight:700; border-top:2px solid var(--line); border-bottom:none;}
  .es-tbl tfoot td.st,.es-tbl tfoot td.nm{z-index:4;}
  .es-ec{display:block; font-size:11px; color:var(--muted); font-weight:500; margin:1px 0 0 15px;}
  .oc-chip{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:12px; background:#eef2ff; color:#3730a3; font-weight:700; font-size:12px; font-family:ui-monospace,Menlo,Consolas,monospace; white-space:nowrap;}
  .oc-chip.none{background:#fff7ed; color:#b45f06; font-family:inherit; font-weight:600;}
  .oc-chip[data-oc]{cursor:pointer;} .oc-chip[data-oc]:hover{filter:brightness(.96);}
  .cx-btn{min-height:0; width:auto; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; border:1px solid #f3c9c9; background:#fff; color:var(--bad-fg);}
  .cx-btn:hover{background:#fdecec;} .cx-btn.undo{border-color:#bfd3ff; color:#1d4ed8;} .cx-btn.undo:hover{background:#eef4ff;} .cx-btn:disabled{opacity:.5; cursor:default;}
  .cx-by{font-size:11px; color:var(--muted); margin-right:4px;}
  .oc-edit{display:inline-flex; gap:5px; align-items:center;}
  .oc-edit input{width:104px; padding:4px 7px; border:1px solid var(--accent); border-radius:6px; font-size:12.5px; min-height:0; text-transform:uppercase; font-family:ui-monospace,Menlo,Consolas,monospace;}
  .oc-edit button{min-height:0; width:auto; padding:4px 9px; border-radius:6px; font-size:12px; cursor:pointer; border:1px solid var(--line); background:#fff;}
  .oc-edit button.ok{background:var(--accent); color:#fff; border-color:var(--accent);}
  .es-pill{display:inline-block; padding:2px 9px; border-radius:12px; font-size:11px; font-weight:700;}
  .es-in{background:var(--ok-bg); color:var(--ok-fg);} .es-out{background:var(--bad-bg); color:var(--bad-fg);} .es-late{background:#fff4db; color:#8a5a00;} .es-part{background:#fff4db; color:#8a5a00;} .es-na{background:#f1f2f4; color:#9aa1ad;}
  .es-mk-wfh{background:#e0f2fe; color:#075985;} .es-mk-leave{background:#f3e8ff; color:#6b21a8;} .es-mk-half_leave{background:#fce7f3; color:#9d174d;} .es-mk-holiday{background:#ecfccb; color:#3f6212;} .es-mk-week_off{background:#f1f5f9; color:#475569;}
  .es-tm{font-size:11px; color:var(--muted); font-weight:600;}
  .es-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; vertical-align:middle;} .es-dot.o{background:#16a34a;} .es-dot.l{background:#f59e0b;} .es-dot.x{background:#dc2626;} .es-dot.n{background:#cbd5e1;}
  .es-rt{display:inline-block; padding:2px 8px; border-radius:10px; font-size:11.5px; font-weight:700;}
  .es-rt.g{background:#e7f7ee; color:#0f7a41;} .es-rt.a{background:#fdf3e3; color:#b45f06;} .es-rt.r{background:#fdecec; color:#c81e1e;} .es-rt.n{background:#f1f2f4; color:#9aa1ad;}
  .es-star{color:#f59e0b; letter-spacing:1px; font-size:12px;} .es-star .e{color:#e2e5ea;} .es-star small{color:var(--muted); letter-spacing:0; margin-left:4px; font-size:11px; font-weight:600;}
  .es-sl{color:#c3c8d0;} .es-pd{color:var(--ok-fg); font-weight:600;}
  .es-dots{display:inline-flex; gap:10px; align-items:center;} .es-dots span{display:inline-flex; align-items:center; gap:4px; font-weight:600;} .es-dots i{width:9px; height:9px; border-radius:50%; display:inline-block; border:1px solid #cbd5e1;}
  .c-dg{background:#14532d;} .c-lg{background:#86efac;} .c-wh{background:#fff;} .c-ot{background:#94a3b8;}
  .es-lk{color:inherit; text-decoration:none; border-bottom:1px dashed #9ca3af;} .es-lk:hover{color:var(--accent); border-color:var(--accent);}
  .es-nm{color:inherit; text-decoration:none;} .es-nm b{font-size:13px; border-bottom:1px dashed #9ca3af;} .es-nm:hover b{color:var(--accent); border-color:var(--accent);}
  .es-empty{padding:30px; text-align:center; color:var(--muted); font-size:13px;}
  .es-note{font-size:11.5px; color:var(--muted); line-height:1.6; margin-top:10px;}
  .es-who{display:inline-flex; gap:8px; align-items:center; background:#eef2ff; color:#3730a3; border-radius:18px; padding:5px 6px 5px 12px; font-size:12.5px; font-weight:700;}
  .es-who[hidden]{display:none;}
  .es-who button{background:#fff; border:none; border-radius:50%; width:20px; height:20px; padding:0; font-size:12px; cursor:pointer; min-height:0; line-height:1; color:#3730a3;}
  /* status control, target chip and progress bar — same look as the Targets page */
  .tgt-chip{cursor:pointer; border:1px solid var(--line); background:var(--bg); border-radius:6px; padding:4px 9px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-size:13px;}
  .tgt-chip:hover{border-color:#b6c2d6;} .tgt-chip.empty{color:var(--accent); font-weight:600;} .tgt-chip.ro{cursor:default;} .tgt-chip.ro:hover{border-color:var(--line);}
  .tgt-pill{font-size:10px; font-weight:600; padding:1px 6px; border-radius:8px; display:inline-block;}
  .tgt-pill.auto{background:#e7f7ee; color:#0f7a41;} .tgt-pill.man{background:#fdf3e3; color:#b45f06;}
  .tgt-how{font-size:10.5px; color:var(--muted); margin-top:3px; line-height:1.35; max-width:240px; white-space:normal; text-align:right; margin-left:auto;}
  .tgt-revert{background:none; border:none; padding:0; margin-top:3px; font-size:11px; color:var(--accent); cursor:pointer; min-height:0; width:auto;}
  .tgt-edit{display:inline-flex; gap:5px; align-items:center;}
  .tgt-edit input{width:96px; padding:4px 7px; border:1px solid var(--accent); border-radius:6px; font-size:13px; min-height:0;}
  .tgt-edit button{min-height:0; width:auto; padding:4px 9px; border-radius:6px; font-size:12px; cursor:pointer; border:1px solid var(--line); background:#fff;}
  .tgt-edit button.ok{background:var(--accent); color:#fff; border-color:var(--accent);}
  .stedit{border:none; background:none; color:var(--accent); cursor:pointer; font-size:13px; padding:0 2px; min-height:0; width:auto; vertical-align:middle;}
  .stbox{display:flex; align-items:center; gap:5px; flex-wrap:nowrap;}
  .cl1{display:flex; align-items:center; gap:8px; justify-content:flex-end;}
  .seg{display:flex; width:96px; height:10px; background:var(--bg); border-radius:5px; overflow:hidden; flex:none;}
  .cl2{display:flex; gap:10px; justify-content:flex-end; margin-top:4px; font-size:10.5px; color:var(--muted);}
  .cl2 span{display:inline-flex; align-items:center; gap:4px;} .cl2 i{width:7px; height:7px; border-radius:2px; display:inline-block;}
  .stpop{position:fixed; z-index:50; width:300px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 12px 36px rgba(15,23,42,.22); padding:14px 14px 12px; font-size:13px; text-align:left; white-space:normal;}
  .stpop h4{margin:0 0 10px; font-size:14px;} .stpop h4 small{color:var(--muted); font-weight:500;}
  .stpop .op{display:flex; gap:9px; align-items:flex-start; padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:7px; cursor:pointer; line-height:1.35;}
  .stpop .op input{margin-top:3px; width:auto; min-height:0;} .stpop .op:has(input:checked){border-color:var(--accent); background:#f3f7ff;}
  .stpop small{color:var(--muted); font-size:11.5px;}
  .stpop .tin{display:none; margin:-2px 0 8px 28px; align-items:center; gap:8px; flex-wrap:wrap; font-size:12px; color:var(--muted);}
  .stpop .tin.show{display:flex;} .stpop .tin input{padding:5px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px; width:auto; min-height:0;}
  .stpop .acts{display:flex; gap:8px; justify-content:flex-end; margin-top:10px;} .stpop .acts button{width:auto; min-height:0; padding:7px 14px;}
  .stpop .err{color:var(--bad-fg); font-size:12px; margin-top:6px;}
  @media (max-width:820px){
    .stpop{left:10px !important; right:10px; width:auto;}
    .es-tools{display:grid; grid-template-columns:1fr 1fr; gap:8px;} .es-tools input,.es-tools select{width:100%; min-width:0;} .es-tools input[type=search]{grid-column:1 / -1;}
    .vtabs button{flex:1; padding:10px 8px; font-size:13px;}
    /* same one-row table on the phone: only the Name column stays put, the rest scrolls sideways */
    .es-tbl{font-size:12px;} .es-tbl th,.es-tbl td{padding:7px 8px;}
    .es-tbl tbody .st,.es-tbl tfoot .st,.es-tbl thead th.st{position:static; min-width:0 !important;}
    .es-tbl .nm{left:0; min-width:112px;} .es-tbl thead tr.g1 th.g-emp{left:auto; position:static;}
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar">
      <div class="tb-title">
        <button type="button" class="back-btn" id="btnBack" hidden aria-label="Go back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
          Back
        </button>
        <h1>Shopify Orders</h1>
      </div>
    </div>
    <div class="content">
      <div id="alertBox"></div>

      <div class="card">
        <div class="card-head" style="flex-wrap:wrap;">
          <h2>Filters <span id="dayNote" style="font-size:11.5px; color:var(--muted); font-weight:400;">(day = 10 AM to next day 10 AM)</span></h2>
          <div style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
            <div>
              <label style="display:block; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; margin-bottom:4px;">From</label>
              <input type="date" id="dateFrom" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
            </div>
            <div>
              <label style="display:block; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; margin-bottom:4px;">To</label>
              <input type="date" id="dateTo" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
            </div>
            <div>
              <label style="display:block; font-size:11px; font-weight:600; color:var(--muted); text-transform:uppercase; margin-bottom:4px;">Store</label>
              <select id="storeFilter" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
                <option value="">All Stores</option>
              </select>
            </div>
            <button class="btn secondary" id="btnToday">Today</button>
            <span id="loadingHint" style="display:none; font-size:13px; color:var(--muted); align-self:center;">Loading...</span>
            <button class="btn" id="btnAddOrder">+ Add Order</button>
          </div>
        </div>
      </div>

      <div class="stat-grid" id="summaryGrid" style="display:none;"></div>

      <!-- Platform summary: query / campaign / totals per platform for the selected dates -->
      <div id="platformCard" style="display:none; margin-bottom:20px;">
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin:0 0 10px;"><h2 style="font-size:15px; margin:0;">Platform summary</h2><span id="platformSub" style="font-size:12px; color:var(--muted);"></span></div>
        <div class="plat-cards" id="platCards"></div>
      </div>

      <!-- Employee sheet (Admin / HR): one row per sales employee for the dates above -->
      <div class="vtabs" id="vtabs" hidden>
        <button type="button" data-v="sheet" class="on">Employee sheet<span class="cnt" id="cntSheet"></span></button>
        <button type="button" data-v="orders">All orders<span class="cnt" id="cntOrders"></span></button>
        <button type="button" data-v="query">Query orders<span class="cnt" id="cntQuery"></span></button>
        <button type="button" data-v="campaign">Campaign orders<span class="cnt" id="cntCampaign"></span></button>
        <button type="button" data-v="cancelled">Cancelled orders<span class="cnt" id="cntCancelled"></span></button>
      </div>
      <div id="paneSheet" hidden>
        <div class="es-tools">
          <input type="search" id="esQ" placeholder="Search name or code…">
          <select id="esSt"><option value="all">All employees</option><option value="present">Present only</option><option value="absent">Absent only</option></select>
          <select id="esSort">
            <option value="name">Sort: Name</option><option value="coll">Sort: Collection</option><option value="ach">Sort: Target achieved %</option>
            <option value="ord">Sort: Orders</option><option value="ratio">Sort: Ratio</option><option value="rate">Sort: Employee rating</option>
          </select>
        </div>
        <div class="es-chips" id="esChips"><span class="lbl">Show columns:</span></div>
        <div class="es-wrap"><table class="es-tbl" id="esTbl"></table></div>
        <div class="es-note" id="esNote"></div>
      </div>

      <div id="paneOrders">
      <div class="card" id="ordersCard" style="display:none;">
        <div class="card-head">
          <h2 id="ordersTitle">Orders</h2>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
            <span class="es-who" id="esWho" hidden><span id="esWhoN"></span><button type="button" id="esWhoX" aria-label="Show all salesmen">&#10005;</button></span>
            <div class="search-box"><input type="text" id="orderSearch" placeholder="Search order #, customer, store, payment..."></div>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th class="th-sort" data-key="order_name" style="cursor:pointer; user-select:none;">Order</th>
              <th class="th-sort" data-key="store" style="cursor:pointer; user-select:none;">Store</th>
              <th class="th-sort" data-key="salesman" style="cursor:pointer; user-select:none;">Salesman</th>
              <th class="th-sort" data-key="code" style="cursor:pointer; user-select:none;">Code</th>
              <th class="th-sort" data-key="created_at" style="cursor:pointer; user-select:none;">Time</th>
              <th class="th-sort" data-key="customer" style="cursor:pointer; user-select:none;">Customer</th>
              <th class="th-sort" data-key="phone" style="cursor:pointer; user-select:none;">Mobile</th>
              <th class="th-sort" data-key="items" style="cursor:pointer; user-select:none;">Items</th>

</div>

<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/layout.js?v=3"></script>
<script>
  guardPage();
  renderSidebar('orders');

  // Employee view: same page, scoped by the server to their own orders.
  if ((api.currentUser() || {}).role === 'Employee') {
    document.querySelector('.topbar h1').textContent = 'My Orders';
    document.getElementById('btnAddOrder').style.display = 'none';
  }

  const alertBox = document.getElementById('alertBox');

  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
  }


  // ---------- Business-day timing (Admin: Targets → Day timing) ----------
  // Start time per weekday [Sun..Sat], default 10:00. A business day runs
  // from its start until the next day's start. Loaded once per page.
  let DAY_START = ['10:00', '10:00', '10:00', '10:00', '10:00', '10:00', '10:00'];
  const timingReady = api.get('day_timing.get').then(d => { if (Array.isArray(d.start) && d.start.length === 7) DAY_START = d.start; }).catch(() => {});
  function bizDayOf(dt) {           // Date -> 'YYYY-MM-DD'
    const d = new Date(dt);
    const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if (hm < DAY_START[d.getDay()]) d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  const fmtHM = (t) => { const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}${m ? ':' + String(m).padStart(2, '0') : ''} ${h >= 12 ? 'PM' : 'AM'}`; };
  function dayWindowText() {
    const all = new Set(DAY_START);
    if (all.size === 1) { const t = fmtHM(DAY_START[0]); return `${t} to next day ${t}`; }
    const names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    return 'each day from ' + DAY_START.map((t, i) => `${names[i]} ${fmtHM(t)}`).join(', ');
  }
  function todayStr() { return bizDayOf(new Date()); }
  timingReady.then(() => { const el = document.getElementById('dayNote'); if (el) el.textContent = '(day = ' + dayWindowText() + ')'; });

  function fmtMoney(v, cur) {
    const n = Number(v || 0);
    return (cur === 'INR' ? '₹' : cur + ' ') + n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }

  // Abbreviated amount for the 3-per-row mobile stat cards, where the full
  // "₹64,082.26" simply doesn't fit in a third of a phone screen.
  function fmtMoneyShort(v, cur) {
    const n = Number(v || 0);
    const sym = cur === 'INR' ? '₹' : cur + ' ';
    if (n >= 10000000) return sym + (n / 10000000).toFixed(1).replace(/\.0$/, '') + 'cr';
    if (n >= 100000) return sym + (n / 100000).toFixed(1).replace(/\.0$/, '') + 'L';
    if (n >= 1000) return sym + (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return sym + Math.round(n);
  }

  function dateLabel(dstr) {
    return new Date(dstr + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
  }

  async function loadStores() {
    try {
      const data = await api.get('shopify.stores');
      const sel = document.getElementById('storeFilter');
      sel.innerHTML = '<option value="">All Stores</option>' +
        (data.stores || []).map(s => `<option value="${s.key}">${s.label}</option>`).join('') +
        '<option value="tm4u">TM4U (orders tagged tm4u)</option>' +
        '<option value="tmsg">TM Shower Gel</option>' +
        '<option value="tmh4">TM House 4th</option>' +
        '<option value="manual">Manual</option>';
    } catch (err) {
      showAlert(err.message, 'error');
    }
  }

  async function loadOrders() {
    const from = document.getElementById('dateFrom').value;
    const to = document.getElementById('dateTo').value;
    const store = document.getElementById('storeFilter').value;
    if (!from || !to) { showAlert('Pick both dates.', 'error'); return; }
    if (from > to) { showAlert('"From" date must be before "To" date.', 'error'); return; }

    alertBox.innerHTML = '';
    document.getElementById('loadingHint').style.display = 'inline';

    // Changing the dates quickly fires several requests; a slower, older one
    // must not overwrite the newest one's results when it finally arrives.
    const reqId = ++ordersReqId;
    try {
      loadPlatformQueries(from, to);
      loadTeamSheet(from, to, store);
      const data = await api.get('shopify.orders', { date_from: from, date_to: to, store });
      if (reqId !== ordersReqId) return;
      const orders = data.orders || [];
      (data.errors || []).forEach(e => showAlert(e, 'error'));
      render(orders);
    } catch (err) {
      if (reqId !== ordersReqId) return;
      showAlert(err.message, 'error');
    } finally {
      if (reqId === ordersReqId) document.getElementById('loadingHint').style.display = 'none';
    }
  }
  let ordersReqId = 0;

  let allOrders = [];
  let filteredOrders = [];
  let currentPage = 1;
  let sortKey = 'created_at';
  let sortDir = 'desc';

  const TH_LABELS = {
    order_name: 'Order', store: 'Store', salesman: 'Salesman', code: 'Code', created_at: 'Time', customer: 'Customer', phone: 'Mobile',
    items: 'Items', total: 'Total', financial_status: 'Payment', fulfillment_status: 'Fulfillment',
  };

  // Order code (the Order Codes page): shown on every order; Admin / HR can type or change it here.
  // Saving writes it to the same place as the Order Codes page (HRMS + tag on the Shopify order).
  const OC_CAN = ['Admin', 'HR'].includes((api.currentUser() || {}).role);
  let ocEdit = -1;
  const ocEsc = (v) => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  function ocCell(o) {
    const has = String(o.code || '');
    const canRow = OC_CAN && o.id !== undefined && o.id !== null && o.store_key && o.store_key !== 'manual';
    if (canRow && ocEdit === o._i) return `<span class="oc-edit"><input type="text" id="ocIn" maxlength="40" value="${ocEsc(has)}" placeholder="e.g. AG00123"><button class="ok" data-oc="save" data-i="${o._i}">✓</button><button data-oc="x">✕</button></span>`;
    if (!has) return canRow ? `<span class="oc-chip none" data-oc="edit" data-i="${o._i}" title="Type the order code">+ Add</span>` : '<span style="color:var(--muted);">—</span>';
    return `<span class="oc-chip"${canRow ? ` data-oc="edit" data-i="${o._i}" title="Click to change"` : ''}>${ocEsc(has)}${canRow ? ' ✎' : ''}</span>`;
  }
  async function ocSave(i) {
    const o = allOrders[i]; if (!o) return;
    const code = document.getElementById('ocIn').value.trim().toUpperCase().replace(/\s+/g, '');
    if (code === String(o.code || '')) { ocEdit = -1; renderPage(); return; }
    try {
      const r = await api.post('order_codes.set', { source: o.store_key, order_id: String(o.id), order_name: o.order_name, code, old_code: o.code || '' });
      o.code = code; ocEdit = -1; renderPage();
      if (r && r.tag_error) alert(r.message);
    } catch (er) { alert(er.message); }
  }
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-oc]'); if (!b) return;
    ev.preventDefault();
    const act = b.dataset.oc;
    if (act === 'edit') { ocEdit = Number(b.dataset.i); renderPage(); const inp = document.getElementById('ocIn'); if (inp) { inp.focus(); inp.select(); } }
    else if (act === 'x') { ocEdit = -1; renderPage(); }
    else if (act === 'save') ocSave(Number(b.dataset.i));
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.target.id !== 'ocIn') return;
    if (ev.key === 'Enter') ocSave(ocEdit);
    if (ev.key === 'Escape') { ocEdit = -1; renderPage(); }
  });

  // Cancel / Undo (Admin / HR, on the Employee-sheet view). Saved in HRMS only — the Shopify order is not touched.
  // A cancelled order leaves every total and the Employee sheet and shows under "Cancelled orders" with an Undo button.
  function cxBtn(o, card) {
    if (typeof ES_ALLOWED === 'undefined' || !ES_ALLOWED || o.id === undefined || o.id === null || !o.store_key || o.store_key === 'manual') return o.cancelled ? '<span class="cx-by">Cancelled</span>' : '';
    const st = card ? ' style="margin-left:auto;"' : '';
    if (o.cancelled) {
      const by = o.cancelled.by ? 'by ' + ocEsc(o.cancelled.by) : '';
      return `<span class="cx-by">${by}</span> <button type="button" class="cx-btn undo" data-cx="undo" data-i="${o._i}"${st} onclick="cxClick(this, event)">↶ Undo</button>`;
    }
    return `<button type="button" class="cx-btn" data-cx="cancel" data-i="${o._i}"${st} onclick="cxClick(this, event)">✕ Cancel</button>`;
  }
  async function cxSet(i, cancel) {
    const o = allOrders[i]; if (!o) return;
    try {
      const r = await api.post('orders.cancel', { source: o.store_key, order_id: String(o.id), order_name: o.order_name, cancel: cancel ? 1 : 0 });
      o.cancelled = cancel ? { by: (r && r.by) || '', at: (r && r.at) || '' } : null;
      renderSummary(); renderPlatformSummary(); applyFilters(); renderTeamSheet();
    } catch (er) { alert(er.message); }
  }
  function cxClick(b, ev) {
    ev.preventDefault(); ev.stopPropagation();   // the phone card itself opens the order details
    b.disabled = true;
    cxSet(Number(b.dataset.i), b.dataset.cx === 'cancel');
  }

  // The orders this page is about: one salesperson's when opened from
  // Targets (?salesman=Name), otherwise everything loaded. The stat cards,
  // the list and its title all use this, so they can never disagree.
  function scopedAll() {
    return urlSalesman ? allOrders.filter(o => o.salesman === urlSalesman) : allOrders;
  }
  // Cancelled orders are left out of every total, card and the sheet; they only show under "Cancelled orders".
  function scopedOrders() {
    return scopedAll().filter(o => !o.cancelled);
  }

  // The list under the stat cards: the scoped orders, narrowed to one person
  // when a name was clicked in the Employee sheet (the cards stay unchanged).
  let pickSalesman = '';
  let housePick = '';      // a platform card was clicked: only that platform's orders (cleared with the ✕ chip)
  let listType = '';      // '' = all orders, 'query' / 'campaign' = only that kind (Query orders / Campaign orders tabs)
  const LIST_NAMES = { '': 'Orders', query: 'Query orders', campaign: 'Campaign orders', cancelled: 'Cancelled orders' };
  function listBase() {
    let b = listType === 'cancelled' ? scopedAll().filter(o => o.cancelled) : scopedOrders();
    if (pickSalesman) b = b.filter(o => o.salesman === pickSalesman);
    if (housePick) b = b.filter(o => (o.house || STORE_HOUSE_MAP[o.store_key]) === housePick);
    return listType && listType !== 'cancelled' ? b.filter(o => orderTagType(o.tags) === listType) : b;
  }

  function render(orders) {
    orders.forEach((o, i) => { o._i = i; });
    allOrders = orders;
    currentPage = 1;
    document.getElementById('orderSearch').value = '';
    renderSummary();
    renderPlatformSummary();
    applyFilters();
    renderTeamSheet();
  }

  function applyFilters() {
    const q = document.getElementById('orderSearch').value.trim().toLowerCase();
    filteredOrders = listBase().filter(o => {
      if (!q) return true;
      const qDigits = q.replace(/\D/g, '');
      return (o.order_name || '').toLowerCase().includes(q)
        || (o.customer || '').toLowerCase().includes(q)
        || (o.store || '').toLowerCase().includes(q)
        || (o.salesman || '').toLowerCase().includes(q)
        || (o.code || '').toLowerCase().includes(q)
        || (o.financial_status || '').toLowerCase().includes(q)
        || (o.fulfillment_status || '').toLowerCase().includes(q)
        || (qDigits.length >= 3 && (o.phone || '').replace(/\D/g, '').includes(qDigits));
    });

    const dir = sortDir === 'asc' ? 1 : -1;
    filteredOrders.sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (sortKey === 'items' || sortKey === 'total') {
        return (Number(va || 0) - Number(vb || 0)) * dir;
      }
      if (sortKey === 'order_name') {
        return (Number(String(va).replace(/\D/g, '')) - Number(String(vb).replace(/\D/g, ''))) * dir;
      }
      return String(va || '').localeCompare(String(vb || '')) * dir;
    });

    renderPage();
  }

  // ---------- Platform summary ----------
  // One column per platform (house). A platform is the house tag first,
  // then the store — the same rule the server uses (o.house). Query counts
  // come from Assign Queries for the same dates.
  const PLATFORMS = [['tmph', 'TM Perfume House', 'ph'], ['tmf', 'TM Fragrance', 'fr'], ['tm4u', 'TM4U', 'fu'], ['tmsg', 'TM Shower Gel', 'sg'], ['tmh4', 'TM House 4th', 'h4']];
  const QUERY_TAGS = ['query', 's'], CAMPAIGN_TAGS = ['campaign', 'c'];
  const STORE_HOUSE_MAP = { tmperfumehouse: 'tmph', tmfragrance: 'tmf' };
  function orderTagType(tags) {
    const t = String(tags || '').split(',').map(x => x.trim().toLowerCase());
    if (t.some(x => QUERY_TAGS.includes(x))) return 'query';
    if (t.some(x => CAMPAIGN_TAGS.includes(x))) return 'campaign';
    return 'other';
  }
  let platformQueries = {};          // house -> { query, campaign } for the loaded dates
  let platformQueriesFor = '';
  async function loadPlatformQueries(from, to) {
    const key = from + '|' + to;
    if (platformQueriesFor === key) return;
    try {
      const d = await api.get('queries.platform_totals', { date_from: from, date_to: to });
      platformQueries = d.queries || {};
      platformQueriesFor = key;
    } catch (e) { platformQueries = {}; }
    renderPlatformSummary();
  }
  function renderPlatformSummary() {
    const card = document.getElementById('platformCard');
    const base = scopedOrders().filter(o => STORE_HOUSE_MAP[o.store_key] || o.house);   // Shopify orders only
    const storeSel = document.getElementById('storeFilter').value;
    const shown = PLATFORMS.filter(([k]) => !storeSel || (STORE_HOUSE_MAP[storeSel] || storeSel) === k);
    if (!base.length && !Object.keys(platformQueries).length) { card.style.display = 'none'; return; }
    const stats = {};
    [...PLATFORMS.map(p => p[0]), 'all'].forEach(k => stats[k] = { q: 0, c: 0, qo: 0, qc: 0, co: 0, cc: 0, to: 0, tc: 0 });
    PLATFORMS.forEach(([k]) => { const pq = platformQueries[k] || {}; stats[k].q = pq.query || 0; stats[k].c = pq.campaign || 0; });
    base.forEach(o => {
      const h = o.house || STORE_HOUSE_MAP[o.store_key]; if (!stats[h]) return;
      const t = orderTagType(o.tags), amt = Number(o.total) || 0;
      stats[h].to++; stats[h].tc += amt;
      if (t === 'query') { stats[h].qo++; stats[h].qc += amt; }
      if (t === 'campaign') { stats[h].co++; stats[h].cc += amt; }
    });
    const inr = (v) => '₹' + Math.round(v).toLocaleString('en-IN');
    const ratio = (p) => { if (!p.q) return '<b style="color:var(--muted); font-weight:400;">—</b>'; const r = Math.round(p.qo / p.q * 100); return `<b class="${r >= 25 ? 'g' : (r >= 10 ? 'a' : 'r')}">${r}%</b>`; };
    const lines = (p, k) => [
      ['q', 'Query', `<b>${p.q}</b>`],
      ['q', 'Query order', `<b>${p.qo}</b>`, 'query'],
      ['q', 'Query ratio', ratio(p)],
      ['q', 'Query collection', `<b>${inr(p.qc)}</b>`, 'query'],
      ['c', 'Campaign order', `<b>${p.co}</b>`, 'campaign'],
      ['c', 'Campaign collection', `<b>${inr(p.cc)}</b>`, 'campaign'],
      ['', 'Ticket size', `<b>${p.to ? inr(p.tc / p.to) : '—'}</b>`],
      ['t', 'Total collection', `<b>${inr(p.tc)}</b>`, 'orders'],
      ['t', 'Total order', `<b>${p.to}</b>`, 'orders'],
    ].map(([c, l, v, go]) => go ? `<div class="li ${c}" data-go="${go}" data-h="${k}" title="Click to see these orders"><span>${l}</span>${v}</div>` : `<div class="li ${c}"><span>${l}</span>${v}</div>`).join('');
    const colors = { tmph: '#1d4ed8', tmf: '#b45f06', tm4u: '#7e22ce', tmsg: '#15803d', tmh4: '#be123c' };
    document.getElementById('platCards').innerHTML = shown.map(([k, label]) =>
      `<div class="plat-card" style="--c:${colors[k]};"><h3>${label}<small>${stats[k].to} order${stats[k].to === 1 ? '' : 's'}</small></h3><div class="plat-lines">${lines(stats[k], k)}</div></div>`).join('');
    const from = document.getElementById('dateFrom').value, to = document.getElementById('dateTo').value;
    const fmt = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
    document.getElementById('platformSub').textContent = from === to ? fmt(from) : `${fmt(from)} – ${fmt(to)}`;
    card.style.display = '';
  }

  function renderSummary() {
    const base = scopedOrders();
    const byStore = {};
    let grandTotal = 0;
    base.forEach(o => {
      byStore[o.store] = byStore[o.store] || { count: 0, total: 0, currency: o.currency };
      byStore[o.store].count++;
      byStore[o.store].total += Number(o.total || 0);
      grandTotal += Number(o.total || 0);
    });

    const grid = document.getElementById('summaryGrid');
    // Each card carries both a full label/amount and a short one; CSS shows
    // whichever fits (short only under the mobile breakpoint).
    grid.innerHTML = `
      <div class="stat-card">
        <div class="label"><span class="lbl-full">All Orders</span><span class="lbl-short">Orders</span></div>
        <div class="value">${base.length}</div>
      </div>
      <div class="stat-card">
        <div class="label"><span class="lbl-full">Total Revenue</span><span class="lbl-short">Revenue</span></div>
        <div class="value"><span class="amt-full">${fmtMoney(grandTotal, 'INR')}</span><span class="amt-short">${fmtMoneyShort(grandTotal, 'INR')}</span></div>
      </div>
      ${Object.entries(byStore).map(([label, s]) => `
        <div class="stat-card">
          <div class="label"><span class="lbl-full">${label}</span><span class="lbl-short">${label.replace(/^TM Perfume House$/i, 'TM Perfume')}</span></div>
          <div class="value">${s.count}
            <span class="amt-full" style="font-size:13px; font-weight:500; color:var(--muted);"> / ${fmtMoney(s.total, s.currency)}</span>
            <span class="amt-short">${fmtMoneyShort(s.total, s.currency)}</span>
          </div>
        </div>`).join('')}
    `;
    grid.style.display = 'grid';
  }

  // Which house the order counts under, and why — same rule as the server:
  // a house tag (tmph / tmf / tm4u) beats the store; two house tags = store.
  const HOUSE_TAG = { tm4u: 'tm4u', tmforu: 'tm4u', tmph: 'tmph', 'tm perfume house': 'tmph', tmf: 'tmf', 'tm fragrance': 'tmf', tmsg: 'tmsg', 'tm shower gel': 'tmsg', tmh4: 'tmh4', 'tm house 4th': 'tmh4' };
  const HOUSE_LABEL = { tmph: 'TM Perfume House', tmf: 'TM Fragrance', tm4u: 'TM4U', tmsg: 'TM Shower Gel', tmh4: 'TM House 4th' };
  const STORE_HOUSE = { tmperfumehouse: 'tmph', tmfragrance: 'tmf' };
  function houseReason(o, tags) {
    if (!STORE_HOUSE[o.store_key]) return '—';
    const found = String(tags || '').split(',').map(t => t.trim()).filter(t => HOUSE_TAG[t.toLowerCase()]);
    const houses = [...new Set(found.map(t => HOUSE_TAG[t.toLowerCase()]))];
    if (houses.length === 1) return `<b>${HOUSE_LABEL[houses[0]]}</b> — because of the tag “${found[0]}”`;
    if (houses.length > 1) return `<b>${HOUSE_LABEL[STORE_HOUSE[o.store_key]]}</b> — the store's house (this order has ${houses.length} house tags: ${found.join(', ')})`;
    return `<b>${HOUSE_LABEL[STORE_HOUSE[o.store_key]]}</b> — the store's house (no house tag)`;
  }

  function dayKey(o) {
    // The server stamps every order with its business day (Day timing
    // setting); the local rule below is the same, for anything without it.
    if (o.biz_date) return o.biz_date;
    return bizDayOf(new Date(o.created_at));
  }

  function renderPage() {
    const body = document.getElementById('ordersBody');
    const pagerBar = document.getElementById('pagerBar');
    const scopeCount = listBase().length;
    document.getElementById('ordersTitle').textContent =
      filteredOrders.length === scopeCount
        ? `${LIST_NAMES[listType]} (${scopeCount})`
        : `${LIST_NAMES[listType]} (${filteredOrders.length} of ${scopeCount})`;
    document.getElementById('ordersCard').style.display = 'block';

    // Sort arrows on headers
    document.querySelectorAll('.th-sort').forEach(th => {
      const key = th.dataset.key;
      th.innerHTML = TH_LABELS[key] + (key === sortKey ? (sortDir === 'asc' ? ' &#9650;' : ' &#9660;') : '');
    });

    if (filteredOrders.length === 0) {
      body.innerHTML = '<tr><td colspan="12" class="empty-state">No matching orders.</td></tr>';
      document.getElementById('ordersCards').innerHTML = '<div class="empty-state">No matching orders.</div>';
      pagerBar.style.display = 'none';
      return;
    }

    // Page slice
    const sizeSel = document.getElementById('pageSize').value;
    const pageSize = sizeSel === 'all' ? filteredOrders.length : Number(sizeSel);
    const totalPages = Math.max(1, Math.ceil(filteredOrders.length / pageSize));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * pageSize;
    const pageOrders = filteredOrders.slice(start, start + pageSize);

    const rowHtml = (o) => `
        <tr>
          <td style="font-weight:600;"><a href="#" onclick="openDetail(${o._i}); return false;">${o.order_name}</a>${o.manual_order_id ? ` <button class="danger-link" title="Delete this manual order" aria-label="Delete order" style="background:none;border:1px solid #f3c9c9;border-radius:6px;cursor:pointer;color:var(--bad-fg);font-size:12px;padding:4px 8px;margin-left:6px;line-height:1;" onclick="deleteManual(${o.manual_order_id})">✕</button>` : ''}</td>
          <td><span style="color:var(--muted);">${o.store}</span></td>
          <td>${o.salesman || '—'}${(o.house_tags || []).length > 1 ? '<div style="font-size:10.5px; color:#c81e1e;" title="This order has more than one house tag, so it is counted under its store\'s house">⚠ 2 house tags</div>' : ''}</td>
          <td>${ocCell(o)}</td>
          <td>${new Date(o.created_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}</td>
          <td>${o.customer}</td>
          <td style="white-space:nowrap;">${o.phone || '—'}</td>
          <td>${o.items}</td>
          <td style="font-weight:600;">${fmtMoney(o.total, o.currency)}</td>
          <td><span class="badge ${o.financial_status === 'paid' ? '' : 'inactive'}">${o.financial_status || '—'}</span></td>
          <td><span class="badge ${o.fulfillment_status === 'fulfilled' ? '' : 'inactive'}">${o.fulfillment_status || 'unfulfilled'}</span></td>
          <td style="white-space:nowrap;">${cxBtn(o)}</td>
        </tr>`;

    // Mobile equivalent of one order row: order # + total on top, customer
    // and phone as a subtitle, store/time/items on one line, payment and
    // fulfillment as pills at the bottom — same data as the table row above,
    // just laid out as a card instead of ten cramped columns.
    const cardHtml = (o) => `
        <div style="background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px;" onclick="openDetail(${o._i})">
          <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
            <span style="font-weight:600; color:var(--accent);">${o.order_name}</span>
            <span style="font-weight:600;">${fmtMoney(o.total, o.currency)}</span>
          </div>
          <div style="font-size:12px; color:var(--muted); margin-top:4px;">${o.customer}${o.phone ? ' · ' + o.phone : ''}${o.salesman ? ' · ' + o.salesman : ''}${o.code ? ' · ' + o.code : ''}</div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
            <span style="font-size:12px; color:var(--muted);">${o.store}</span>
            <span style="font-size:12px; color:var(--muted);">${new Date(o.created_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })} · ${o.items} item${o.items === 1 ? '' : 's'}</span>
          </div>
          <div style="display:flex; gap:6px; margin-top:8px;">
            <span class="badge ${o.financial_status === 'paid' ? '' : 'inactive'}">${o.financial_status || '—'}</span>
            <span class="badge ${o.fulfillment_status === 'fulfilled' ? '' : 'inactive'}">${o.fulfillment_status || 'unfulfilled'}</span>
            ${cxBtn(o, true)}
            ${o.manual_order_id ? `<button class="danger-link" style="background:none;border:1px solid #f3c9c9;border-radius:6px;cursor:pointer;color:var(--bad-fg);font-size:12px;padding:6px 12px;margin-left:auto;line-height:1.3;" onclick="event.stopPropagation(); deleteManual(${o.manual_order_id})">Delete</button>` : ''}
          </div>
        </div>`;

    const cardsEl = document.getElementById('ordersCards');

    if (sortKey === 'created_at') {
      // Time sort: keep the day-wise grouping with full-day totals for the
      // current filtered set.
      const dayTotals = {};
      filteredOrders.forEach(o => {
        const k = dayKey(o);
        dayTotals[k] = dayTotals[k] || { count: 0, total: 0 };
        dayTotals[k].count++;
        dayTotals[k].total += Number(o.total || 0);
      });

      const groups = {};
      const order = [];
      pageOrders.forEach(o => {
        const key = dayKey(o);
        if (!groups[key]) { groups[key] = []; order.push(key); }
        groups[key].push(o);
      });

      body.innerHTML = order.map(day => {
        const dt = dayTotals[day];
        return `
          <tr style="background:#f0f4ff;">
            <td colspan="12" style="font-weight:700;">
              ${dateLabel(day)}
              <span style="float:right; font-weight:600; color:var(--muted);">${dt.count} order${dt.count === 1 ? '' : 's'} · ${fmtMoney(dt.total, 'INR')}</span>
            </td>
          </tr>` + groups[day].map(rowHtml).join('');
      }).join('');

      cardsEl.innerHTML = order.map(day => {
        const dt = dayTotals[day];
        return `
          <div style="font-weight:700; font-size:13px; padding:8px 2px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:2px 10px;">
            <span style="min-width:0;">${dateLabel(day)}</span>
            <span style="font-weight:600; color:var(--muted); min-width:0;">${dt.count} order${dt.count === 1 ? '' : 's'} · ${fmtMoney(dt.total, 'INR')}</span>
          </div>` + groups[day].map(cardHtml).join('');
      }).join('');
    } else {
      // Sorting by another column: flat list (day grouping wouldn't make sense).
      body.innerHTML = pageOrders.map(rowHtml).join('');
      cardsEl.innerHTML = pageOrders.map(cardHtml).join('');
    }

    // Pager UI
    pagerBar.style.display = 'flex';
    document.getElementById('pagerInfo').textContent =
      `Showing ${start + 1}–${start + pageOrders.length} of ${filteredOrders.length} orders`;
    document.getElementById('pageLabel').textContent = `Page ${currentPage} / ${totalPages}`;
    document.getElementById('btnPrev').disabled = currentPage <= 1;
    document.getElementById('btnNext').disabled = currentPage >= totalPages;
  }

  document.querySelectorAll('.th-sort').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortKey === key) {
        sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        sortKey = key;
        sortDir = key === 'created_at' ? 'desc' : 'asc';
      }
      currentPage = 1;
      applyFilters();
    });
  });

  let searchTimer = null;
  document.getElementById('orderSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { currentPage = 1; applyFilters(); }, 200);
  });

  document.getElementById('btnPrev').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderPage(); window.scrollTo(0, 0); } });
  document.getElementById('btnNext').addEventListener('click', () => { currentPage++; renderPage(); window.scrollTo(0, 0); });
  document.getElementById('pageSize').addEventListener('change', () => { currentPage = 1; renderPage(); });

  // Auto-load whenever a filter changes — no button needed.
  document.getElementById('dateFrom').addEventListener('change', loadOrders);
  document.getElementById('dateTo').addEventListener('change', loadOrders);
  document.getElementById('storeFilter').addEventListener('change', loadOrders);
  document.getElementById('btnToday').addEventListener('click', () => {
    document.getElementById('dateFrom').value = todayStr();
    document.getElementById('dateTo').value = todayStr();
    loadOrders();
  });

  // ---- Order detail modal
  const detailModal = document.getElementById('detailModal');
  function closeDetail() {
    detailModal.classList.remove('open');
    document.body.style.overflow = '';
  }
  document.getElementById('btnDetailClose').addEventListener('click', closeDetail);
  detailModal.addEventListener('click', (e) => { if (e.target === detailModal) closeDetail(); });

  function detailRow(label, value) {
    if (!value) return '';
    return `<div style="display:flex; gap:12px; padding:5px 0; font-size:13.5px;">
      <div style="min-width:110px; color:var(--muted); font-weight:600;">${label}</div>
      <div>${value}</div></div>`;
  }

  window.openDetail = async function (i) {
    const o = allOrders[i];
    if (!o) return;
    document.getElementById('detailTitle').textContent = `${o.order_name} — ${o.store}`;
    const body = document.getElementById('detailBody');
    detailModal.classList.add('open');
    document.body.style.overflow = 'hidden'; // freeze the page behind the popup

    if (o.store_key === 'manual' || o.custom_store) {
      body.innerHTML =
        detailRow('Date', new Date(o.created_at).toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })) +
        detailRow('Customer', o.customer) +
        detailRow('Mobile', o.phone) +
        detailRow('Items', o.items) +
        detailRow('Total', fmtMoney(o.total, o.currency)) +
        detailRow('Payment', o.financial_status) +
        detailRow('Fulfillment', o.fulfillment_status) +
        detailRow('Remarks', o.remarks) +
        detailRow('Added by', o.created_by) +
        (o.custom_store ? detailRow('Counted under', o.allocated
          ? `<b>${o.store}</b> — moved from ${o.store_src || 'MySales'} on the Order Allocation page${o.allocated_by ? ' by ' + o.allocated_by : ''}`
          : `<b>${o.store}</b> — not allocated to a house yet (Order Allocation page)`) : '');
      return;
    }

    body.innerHTML = '<div class="loading" style="padding:20px 0;">Loading order details...</div>';
    // Opening a second order before the first finishes loading: only the
    // latest one may fill the popup.
    const detailId = ++detailReqId;
    try {
      const data = await api.get('shopify.order_detail', { store: o.store_key, id: o.id });
      if (detailId !== detailReqId) return;
      const d = data.order;

      const itemsHtml = `
        <table style="width:100%; border-collapse:collapse; margin:10px 0;">
          <thead><tr>
            <th style="text-align:left; font-size:11.5px; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line);">Product</th>
            <th style="text-align:center; font-size:11.5px; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line);">Qty</th>
            <th style="text-align:right; font-size:11.5px; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line);">Price</th>
            <th style="text-align:right; font-size:11.5px; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line);">Total</th>
          </tr></thead>
          <tbody>${d.line_items.map(li => `
            <tr>
              <td style="padding:7px 8px; border-bottom:1px solid #f2f2f2; font-size:13.5px;">${li.title}${li.variant ? `<div style="font-size:12px; color:var(--muted);">${li.variant}</div>` : ''}</td>
              <td style="padding:7px 8px; border-bottom:1px solid #f2f2f2; text-align:center;">${li.quantity}</td>
              <td style="padding:7px 8px; border-bottom:1px solid #f2f2f2; text-align:right;">${fmtMoney(li.price, d.currency)}</td>
              <td style="padding:7px 8px; border-bottom:1px solid #f2f2f2; text-align:right; font-weight:600;">${fmtMoney(li.total, d.currency)}</td>
            </tr>`).join('')}
          </tbody>
        </table>`;

      const totalsHtml = `
        <div style="margin-left:auto; max-width:260px; font-size:13.5px;">
          <div style="display:flex; justify-content:space-between; padding:3px 0;"><span>Subtotal</span><span>${fmtMoney(d.subtotal, d.currency)}</span></div>
          ${Number(d.discounts) > 0 ? `<div style="display:flex; justify-content:space-between; padding:3px 0; color:var(--ok-fg);"><span>Discount</span><span>−${fmtMoney(d.discounts, d.currency)}</span></div>` : ''}
          <div style="display:flex; justify-content:space-between; padding:3px 0;"><span>Shipping</span><span>${fmtMoney(d.shipping, d.currency)}</span></div>
          ${Number(d.tax) > 0 ? `<div style="display:flex; justify-content:space-between; padding:3px 0;"><span>Tax</span><span>${fmtMoney(d.tax, d.currency)}</span></div>` : ''}
          <div style="display:flex; justify-content:space-between; padding:6px 0; border-top:1px solid var(--line); font-weight:700;"><span>Total</span><span>${fmtMoney(d.total, d.currency)}</span></div>
        </div>`;

      const trackingHtml = (d.tracking || []).length
        ? detailRow('Tracking', d.tracking.map(t => t.url
            ? `<a href="${t.url}" target="_blank">${t.number}</a>${t.company ? ' (' + t.company + ')' : ''}`
            : `${t.number}${t.company ? ' (' + t.company + ')' : ''}`).join('<br>'))
        : '';

      body.innerHTML =
        detailRow('Date', new Date(d.created_at).toLocaleString('en-IN', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })) +
        detailRow('Customer', d.customer) +
        detailRow('Mobile', d.phone) +
        detailRow('Email', d.email) +
        detailRow('Address', (d.address || []).join('<br>')) +
        detailRow('Payment', `<span class="badge ${d.financial_status === 'paid' ? '' : 'inactive'}">${d.financial_status || '—'}</span>${d.gateway ? ' via ' + d.gateway : ''}`) +
        detailRow('Fulfillment', `<span class="badge ${d.fulfillment_status === 'fulfilled' ? '' : 'inactive'}">${d.fulfillment_status || 'unfulfilled'}</span>`) +
        trackingHtml +
        detailRow('Note', d.note) +
        detailRow('Tags', d.tags) +
        detailRow('Counted under', houseReason(o, d.tags)) +
        itemsHtml +
        totalsHtml;
    } catch (err) {
      if (detailId !== detailReqId) return;
      body.innerHTML = `<div class="alert error">${err.message}</div>`;
    }
  };
  let detailReqId = 0;

  // ---- Manual order modal
  const orderModal = document.getElementById('orderModal');

  function nowLocal() {
    const d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }

  document.getElementById('btnAddOrder').addEventListener('click', () => {
    document.getElementById('manualOrderForm').reset();
    document.getElementById('orderModalAlert').innerHTML = '';
    document.getElementById('moDate').value = nowLocal();
    orderModal.classList.add('open');
  });
  document.getElementById('btnOrderCancel').addEventListener('click', () => orderModal.classList.remove('open'));
  orderModal.addEventListener('click', (e) => { if (e.target === orderModal) orderModal.classList.remove('open'); });

  document.getElementById('manualOrderForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnOrderSave');
    btn.disabled = true;
    try {
      const dtLocal = document.getElementById('moDate').value; // yyyy-mm-ddThh:mm
      await api.post('manual_orders.save', {
        customer_name: document.getElementById('moCustomer').value.trim(),
        phone: document.getElementById('moPhone').value.trim(),
        items: Number(document.getElementById('moItems').value || 1),
        total: Number(document.getElementById('moTotal').value || 0),
        payment_status: document.getElementById('moPayment').value,
        fulfillment_status: document.getElementById('moFulfillment').value,
        order_date: dtLocal ? dtLocal.replace('T', ' ') + ':00' : '',
        order_no: document.getElementById('moOrderNo').value.trim(),
        remarks: document.getElementById('moRemarks').value.trim(),
      });
      orderModal.classList.remove('open');
      showAlert('Order added.');
      loadOrders();
    } catch (err) {
      document.getElementById('orderModalAlert').innerHTML = `<div class="alert error">${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  });

  window.deleteManual = async function (id) {
    if (!confirm('Delete this manual order?')) return;
    try {
      await api.post('manual_orders.delete', { manual_order_id: id });
      showAlert('Order deleted.');
      loadOrders();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  };

  // ================= Employee sheet (Admin / HR) =================
  // One row per sales employee for the dates above. Attendance, target,
  // queries / campaigns and ratings come from team.sheet; collection, orders,
  // COD / prepaid and bottle colours are worked out here from the orders the
  // page already loaded, so they always agree with the cards and the list.
  const ES_ROLE = (api.currentUser() || {}).role;
  const ES_ALLOWED = (ES_ROLE === 'Admin' || ES_ROLE === 'HR') && !new URLSearchParams(location.search).get('salesman');
  let teamData = null;               // last team.sheet response
  let teamReqId = 0;
  const ES_GROUPS = [
    { k: 'tgt', n: 'Target', cls: 'g-tgt' }, { k: 'ord', n: 'Orders', cls: 'g-ord' }, { k: 'qry', n: 'Query', cls: 'g-qry' },
    { k: 'cmp', n: 'Campaign', cls: 'g-cmp' }, { k: 'pay', n: 'Payments', cls: 'g-pay' }, { k: 'rat', n: 'Ratings', cls: 'g-rat' },
    { k: 'clr', n: 'Bottle colour', cls: 'g-clr' }
  ];
  const ES_COLS = {
    tgt: [['Target', 'tg'], ['Collection', 'coll']],
    ord: [['Total query', 'tq'], ['Total order', 'ord'], ['Ratio', 'ratio']],
    qry: [['Query', 'q'], ['Q order', 'qo'], ['Q ratio', 'qr'], ['Q collection', 'qc']],
    cmp: [['Campaign', 'k'], ['C order', 'ko'], ['C collection', 'kc'], ['C ratio', 'kr']],
    pay: [['COD / Paid', 'cod'], ['Prepaid', 'pre']],
    rat: [['Per order', 'or'], ['Per employee', 'er']],
    clr: [['DG · LG · WH · Other', 'col']]
  };
  const esOn = { tgt: 1, ord: 1, qry: 1, cmp: 1, pay: 1, rat: 1, clr: 1 };
  const esEl = (id) => document.getElementById(id);
  const esInr = (v) => '₹' + Math.round(v).toLocaleString('en-IN');
  const esPct = (a, b) => b > 0 ? Math.round(a / b * 1000) / 10 : null;
  const esEsc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const esRt = (v) => v === null ? '<span class="es-rt n">—</span>' : `<span class="es-rt ${v >= 25 ? 'g' : (v >= 10 ? 'a' : 'r')}">${v}%</span>`;
  // Ratings are stored 1-10 and shown as 5 stars (value / 2).
  const esStars = (v10, n) => {
    if (!v10) return '<span class="es-sl">—</span>';
    const v = v10 / 2, f = Math.max(0, Math.min(5, Math.round(v)));
    return `<span class="es-star">${'★'.repeat(f)}<span class="e">${'★'.repeat(5 - f)}</span><small>${v.toFixed(1)}${n ? ' · ' + n + ' rated' : ''}</small></span>`;
  };
  const esDots = (c) => `<span class="es-dots"><span><i class="c-dg"></i>${c[0]}</span><span><i class="c-lg"></i>${c[1]}</span><span><i class="c-wh"></i>${c[2]}</span><span><i class="c-ot"></i>${c[3]}</span></span>`;
  const esAch = (e) => e.tg ? Math.round(e.coll / e.tg * 100) : 0;

  // One-line message inside the sheet box (loading / slow / error), so it is never an empty white box.
  function esMsg(html) { esEl('esTbl').innerHTML = `<tbody><tr><td class="es-empty l" style="text-align:center;">${html}</td></tr></tbody>`; esEl('esNote').innerHTML = ''; }
  let esSlowTimer = 0;
  async function loadTeamSheet(from, to, store) {
    if (!ES_ALLOWED) return;
    const id = ++teamReqId;
    if (!teamData) esMsg('Loading employee sheet…');
    clearTimeout(esSlowTimer);
    esSlowTimer = setTimeout(() => { if (id === teamReqId && !teamData) esMsg('Still loading — the server is slow right now. <button type="button" class="btn secondary" id="esRetry" style="width:auto; margin-left:8px;">Try again</button>'); }, 15000);
    try {
      const d = await api.get('team.sheet', { date_from: from, date_to: to, store });
      if (id !== teamReqId) return;
      clearTimeout(esSlowTimer);
      if (!d || !Array.isArray(d.rows)) throw new Error('the server sent an unexpected reply — upload the latest api.php');
      teamData = d;
      try { renderTeamSheet(); } catch (re) { teamData = null; throw new Error('could not draw the sheet (' + re.message + ')'); }
      // Target with the automatic daily rule needs Shopify history, so it comes in a second, slower call.
      if (d.auto_rule) {
        api.get('team.sheet', { date_from: from, date_to: to, store, rule: 1 }).then(r => {
          if (id !== teamReqId || !teamData) return;
          teamData.rows.forEach(row => {
            const t = (r.targets || {})[row.employee_id];
            if (t !== undefined && t !== null) row.target = t;
            if ((r.src || {})[row.employee_id]) { row.target_src = r.src[row.employee_id]; row.target_how = (r.how || {})[row.employee_id] || ''; }
          });
          teamData.rule_note = r.note || '';
          renderTeamSheet();
        }).catch(() => {});
      }
    } catch (err) {
      if (id !== teamReqId) return;
      teamData = null;

  // Per-person order numbers from the loaded orders.
  function esAggregate() {

    allOrders.forEach(o => {

      const a = by[key] = by[key] || slot();
      const amt = Number(o.total) || 0, t = orderTagType(o.tags);
      a.coll += amt; a.ord++;
      if (t === 'query') { a.qo++; a.qc += amt; }
      if (t === 'campaign') { a.ko++; a.kc += amt; }
      const out = (o.outstanding === null || o.outstanding === undefined)

  function esRows() {

    if (other.ord) rows.push(Object.assign({ id: 0, n: 'Other / unassigned', c: '', p: false, days: 0, t: '', late: false, tg: 0, tsrc: 'none', how: '', tgks: [''], mark: null, man: false, tout: '', q: 0, k: 0, tot: 0, or: [0, 0], er: 0, real: false }, other));

  function slot0() { return { coll: 0, ord: 0, qo: 0, qc: 0, ko: 0, kc: 0, cod: 0, codPaid: 0, pre: 0, col: [0, 0, 0, 0] }; }

  function esVisible(all) {

  function esTotals(rows) {

      const a = ev.target.closest('.es-nm'); if (!a) return;
      ev.preventDefault(); esPick(a.dataset.n); esView('orders');
      window.scrollTo({ top: esEl('vtabs').offsetTop - 10, behavior: 'smooth' });
    });
  } else {
    esEl('paneOrders').hidden = false;
  }

  esEl('esWhoX').addEventListener('click', () => { if (!ES_ALLOWED) listType = ''; esPick(''); });

  // Platform card: click Query order / Campaign order / Total order (or the collection) to see only those orders of that platform.
  document.getElementById('platCards').addEventListener('click', (ev) => {
    const li = ev.target.closest('.li[data-go]'); if (!li) return;
    esPick('', li.dataset.h);
    if (ES_ALLOWED) esView(li.dataset.go === 'orders' ? 'orders' : li.dataset.go);
    else { listType = li.dataset.go === 'orders' ? '' : li.dataset.go; esChip(); currentPage = 1; applyFilters(); }
    const t = esEl('vtabs').hidden ? esEl('ordersCard') : esEl('vtabs');
    window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 10, behavior: 'smooth' });
  });

  // Support pre-filtered links from the Targets page:
  // orders.html?from=YYYY-MM-DD&to=YYYY-MM-DD&q=employee name
  const urlParams = new URLSearchParams(location.search);
  const urlFrom = urlParams.get('from');
  const urlTo = urlParams.get('to');
  const urlQ = urlParams.get('q');
  const urlSalesman = urlParams.get('salesman');

  document.getElementById('dateFrom').value = urlFrom || todayStr();
  document.getElementById('dateTo').value = urlTo || todayStr();
  if (urlSalesman) {
    document.querySelector('.topbar h1').textContent = 'Orders — ' + urlSalesman;
  }

  // Back: only when this page shows ONE employee's orders, opened from
  // Targets (orders.html?…&salesman=Name). It returns through browser
  // history so Targets restores its date, filters and scroll position; if
  // there's no history to go back to (link opened in a new tab), it opens
  // Targets directly.
  (function setupBack() {
    if (!urlSalesman) return;
    const btn = document.getElementById('btnBack');
    btn.hidden = false;
    btn.addEventListener('click', () => {
      let cameFromApp = false;
      try { cameFromApp = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
      if (cameFromApp && history.length > 1) history.back();
      else location.href = 'targets.html';
    });
  })();
  loadStores().then(loadOrders).then(() => {
    if (urlQ) {
      document.getElementById('orderSearch').value = urlQ;
      currentPage = 1;
      applyFilters();
    }
  });
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
