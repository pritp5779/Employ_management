<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Store Analytics — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  .sa-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .sa-top .sp{flex:1;}
  .sa-top .btn{width:auto; padding:7px 14px; min-height:0; font-size:12.5px;}
  .sa-frame{position:relative; background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden; height:calc(100vh - 150px); min-height:480px;}
  .sa-frame iframe{display:block; width:100%; height:100%; border:0;}
  .sa-load{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; background:#fff;}
  @media (max-width:820px){ .sa-frame{height:calc(100vh - 170px); border-radius:12px;} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar sa-top">
      <div><h1>Store Analytics</h1><div class="sub" style="font-size:12.5px; color:var(--muted); margin-top:2px;">Daily store report</div></div>
      <span class="sp"></span>
      <button type="button" class="btn secondary" id="saReload">↻ Reload</button>
    </div>
    <div class="content">
      <div class="sa-frame"><div class="sa-load" id="saLoad">Loading the report…</div>
        <iframe id="saFrame" title="Store Analytics report" referrerpolicy="no-referrer" loading="eager"></iframe></div>
    </div>
  </main>
</div>
<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/layout.js?v=3"></script>
<script>
  guardPage();
  // Admin only: anyone else goes back to the dashboard (the report link is in this page).
  let SA_ME = {}; try { SA_ME = JSON.parse(localStorage.getItem('hrms_user') || '{}'); } catch (e) { SA_ME = {}; }
  if (SA_ME.role !== 'Admin') { document.documentElement.style.visibility = 'hidden'; window.location.replace(SA_ME.role === 'Employee' ? 'attendance.html' : 'dashboard.html'); }
  renderSidebar('store_analytics');
  // The report opens inside this page (no new tab).
  const SA_URL = 'https://fourpirates.space/analytics/report.php?k=view_7bbd22f4811a0d2c63f7';
  const fr = document.getElementById('saFrame'), ld = document.getElementById('saLoad');
  fr.onload = () => { ld.style.display = 'none'; };
  if (SA_ME.role === 'Admin') fr.src = SA_URL;
  document.getElementById('saReload').onclick = () => { ld.style.display = 'flex'; fr.src = SA_URL + '&_=' + Date.now(); };
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
