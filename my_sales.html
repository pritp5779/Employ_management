<style>
  /* Coach (top of the page): pace, ranks and every tip of today */
  .cch{max-width:640px; margin-bottom:20px; padding:16px 18px;}
  .cch h2{font-size:15px; margin:0 0 8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .cch .pace{position:relative; height:14px; background:#e5e7eb; border-radius:8px; margin:8px 0 4px;}
  .cch .pace i{position:absolute; left:0; top:0; bottom:0; border-radius:8px; background:#16a34a;} .cch .pace.jb i{background:#f59e0b;}
  .cch .pace u{position:absolute; top:-4px; bottom:-4px; width:3px; margin-left:-1px; background:#111827; border-radius:2px;}
  .cch .sm{display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted);}
  .cch .pb{display:inline-block; border-radius:99px; padding:3px 10px; font-size:12px; font-weight:800;}
  .cch .pb.ah{background:#dcfce7; color:#166534;} .cch .pb.jb{background:#ffedd5; color:#9a3412;} .cch .pb.na{background:#f1f5f9; color:#64748b;} .cch .pb.dn{background:#ede9fe; color:#5b21b6;}
  .cch .kp{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0 4px;}
  .cch .kp div{background:#f8fafc; border-radius:10px; padding:8px 10px; font-size:11.5px; color:var(--muted);} .cch .kp b{display:block; font-size:16px; color:var(--ink);} .cch .kp small{color:#16a34a; font-weight:700;}
  .cch .ck{font-size:11px; font-weight:800; color:var(--muted); margin:12px 0 2px; letter-spacing:.3px;}
  .cch .tp{display:flex; gap:9px; border-radius:12px; padding:8px 10px; margin-top:6px; font-size:12.5px; line-height:1.45; background:#fff; border:1px solid #fed7aa; color:#334155;}
  .cch .tp .e{font-size:19px; line-height:1.1;} .cch .tp b{display:block; font-size:13px; color:var(--ink);}
  .cch .tp.push{background:#fefce8; border-color:#fde68a;} .cch .tp.win{background:#ecfdf5; border-color:#bbf7d0;} .cch .tp.focus{background:#fff7ed; border-color:#fdba74;} .cch .tp.learn{background:#eff6ff; border-color:#bfdbfe;}
  .cch .cp{margin-top:6px; font-size:12.5px; color:#7c2d12;} .cch .cp.up{color:#166534;}
  .cch .bdg{display:flex; gap:5px; flex-wrap:wrap; margin-top:8px;} .cch .bdg span{background:linear-gradient(135deg,#fde68a,#fbbf24); color:#78350f; border-radius:99px; padding:4px 10px; font-size:12px; font-weight:800;}
  .cch .nx{margin-top:9px; background:#111827; color:#fff; border-radius:99px; padding:6px 12px; font-size:12.5px; display:inline-block;} .cch .nx b{color:#fde68a;}
  .cch .mo{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); font-size:12px; color:var(--muted);} .cch .mo > b{color:var(--ink); width:100%;} .cch .mo span b{color:var(--ink);}
  .rtc .hd{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;} .rtc .hd h2{margin:0;}
  .rtc .tabs{display:flex; gap:4px;} .rtc .tabs button{width:auto; min-height:0; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:99px; padding:4px 11px; font-size:12px; font-weight:800; cursor:pointer;} .rtc .tabs button.on{background:#111827; color:#fff; border-color:#111827;}
  .rtc .top{display:flex; align-items:center; gap:12px; margin:10px 0 4px; flex-wrap:wrap;}
  .rtc .rg{width:84px; height:84px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;}
  .rtc .rg span{background:var(--surface,#fff); width:66px; height:66px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:900; font-size:22px; line-height:1;}
  .rtc .rg small{font-size:9.5px; color:var(--muted); font-weight:800; margin-top:3px; letter-spacing:.04em;}
  .rtc .rg.s{width:60px; height:60px;} .rtc .rg.s span{width:48px; height:48px; font-size:16px;}
  .rtc .lbp{display:inline-block; border-radius:99px; padding:3px 10px; font-size:12px; font-weight:800; background:#dcfce7; color:#166534;}
  .rtc .meta{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.5;}
  .rtc .spark{display:flex; align-items:flex-end; gap:3px; height:42px; margin-top:8px;} .rtc .spark i{flex:1; border-radius:3px 3px 0 0; background:#86efac; position:relative;} .rtc .spark i.lo{background:#fdba74;} .rtc .spark i.t{background:#16a34a;}
  .rtc .pt{display:grid; grid-template-columns:132px 1fr 32px; gap:8px; align-items:center; font-size:12.5px; margin-top:7px;}
  .rtc .pt .bar{height:8px; background:#e2e8f0; border-radius:6px; overflow:hidden;} .rtc .pt .bar i{display:block; height:100%; border-radius:6px;}
  .rtc .pt small{grid-column:1/-1; margin-top:-4px; font-size:11px; color:#9a3412;}
  .rtc .pt.na b{color:var(--muted); font-weight:600;}
  @media (max-width:520px){ .rtc .pt{grid-template-columns:112px 1fr 30px;} .rtc .rg{width:74px; height:74px;} .rtc .rg span{width:58px; height:58px; font-size:19px;} }
  .chc .hd{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap;}
  .chc .hd h2{margin:0;}
  .chc .lb{border:1px dashed #f87171; background:#fff; color:#b91c1c; border-radius:99px; padding:6px 12px; font-size:12.5px; font-weight:800; cursor:pointer;}
  .chc .top{display:flex; align-items:center; gap:12px; margin:10px 0 4px;}
  .chc .top b{font-size:15px;} .chc .top .s{font-size:12px; color:var(--muted);}
  .chc .sk{display:grid; grid-template-columns:1fr auto; gap:2px 10px; font-size:12.5px; margin-top:7px;}
  .chc .bar{grid-column:1/-1; position:relative; height:7px; background:#e2e8f0; border-radius:5px;}
  .chc .bar i{position:absolute; left:0; top:0; bottom:0; border-radius:5px;}
  .chc .bar u{position:absolute; top:-3px; bottom:-3px; width:3px; margin-left:-1px; background:#111827; border-radius:2px;}
  .chc .lg{font-size:11px; color:var(--muted); margin-top:6px;}
  .chc .cs{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px;} .chc .cs span{border-radius:99px; padding:4px 9px; font-size:12px;} .chc .cs .g{background:#ecfdf5; color:#166534;} .chc .cs .a{background:#fff7ed; color:#9a3412;}
  .chc .rv{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; cursor:pointer;}
  .chc .rv:last-child{border-bottom:0;} .chc .rv small{display:block; color:var(--muted); font-size:11.5px;}
  .chc .ms{margin-top:8px; background:#f8fafc; border-radius:10px; padding:8px 10px; font-size:12.5px;} .chc .ms a{font-weight:800;}
  .chc details{margin-top:12px; border-top:1px solid var(--line); padding-top:8px;} .chc summary{cursor:pointer; font-weight:800; font-size:13px;}
  .chc .pr{border-radius:12px; padding:8px 10px; margin-top:6px; font-size:12.5px; background:#f0fdf4; border:1px solid #bbf7d0;} .chc .pr b{display:block; font-size:13px;} .chc .pr .q{display:block; font-style:italic; color:#14532d; margin-top:3px;} .chc .pr small{color:var(--muted);}
  @media (max-width:520px){ .cch{padding:14px 12px;} .cch .kp b{font-size:14px;} }
  .amt-short{display:none;}
  @media (max-width:820px){ .amt-full{display:none;} .amt-short{display:inline;} }
  /* Query / Campaign counts set for him on Assign Queries, plus today's orders of each type */
  .qc{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .qc .qb{border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0;}
  .qc .qb.query{border-left:4px solid #0EA5E9;} .qc .qb.campaign{border-left:4px solid #F59E0B;}
  .qc .qt{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .qc .query .qt{color:#0C447C;} .qc .campaign .qt{color:#854F0B;}
  .qc .qn{font-size:28px; font-weight:700; line-height:1.15; margin-top:4px;} .qc .qn small{font-size:12px; font-weight:500; color:var(--muted); margin-left:4px;}
  .qc .ln{display:flex; justify-content:space-between; gap:8px; font-size:13px; padding-top:6px; margin-top:6px; border-top:1px dashed var(--line); color:var(--muted);}
  .qc .ln b{color:var(--ink); white-space:nowrap;} .qc .ln.pn{border-top:0; margin-top:2px; padding-top:0; font-size:12px;}
  /* My Target: today's order target, pace line and the hours (only for people tracked on Order Targets) */
  .ot-card{max-width:640px; margin-bottom:20px;}
  .ot-chip{font-size:11.5px; font-weight:700; border-radius:20px; padding:3px 10px; white-space:nowrap; align-self:flex-start; width:fit-content; flex:0 0 auto;}
  .ot-chip.ok{background:var(--ok-bg); color:var(--ok-fg);} .ot-chip.warn{background:#fff3df; color:#b45f06;} .ot-chip.bad{background:var(--bad-bg); color:var(--bad-fg);} .ot-chip.mute{background:#f0f1f4; color:var(--muted);}
  .ot-big{font-size:36px; font-weight:800; letter-spacing:-.02em; line-height:1;} .ot-big small{font-size:15px; font-weight:600; color:var(--muted); letter-spacing:0;}
  .ot-bar{height:16px; border-radius:10px; background:#f0f1f4; position:relative; margin:22px 0 6px;}
  .ot-bar i{position:absolute; left:0; top:0; bottom:0; border-radius:10px; background:linear-gradient(90deg,#ff9a5c,var(--accent)); max-width:100%;}
  .ot-bar u{position:absolute; top:-6px; bottom:-6px; width:3px; background:var(--ink); border-radius:2px; text-decoration:none;}
  .ot-bar u::after{content:"pace"; position:absolute; top:-15px; left:-10px; font-size:9.5px; font-weight:700; color:var(--ink);}
  .ot-leg{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted);} .ot-leg b{color:var(--ink);}
  .ot-note{font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.5;} .ot-note b{color:var(--ink);}
  .ot-sub{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line); font-size:13px; color:var(--muted); line-height:1.6;} .ot-sub b{color:var(--ink);} .ot-sub:empty{display:none;}
  .ot-hr{display:grid; grid-template-columns:70px 1fr 38px 38px; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--line); font-size:13px;}
  .ot-hr.head{border-top:0; padding-top:0; font-size:10.5px; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .ot-hr.now{font-weight:700; background:#fff7f1; border-radius:10px; padding-left:8px; padding-right:8px; margin:0 -8px;}
  .ot-hr .mini{height:7px; border-radius:5px; background:#f0f1f4; overflow:hidden;} .ot-hr .mini i{display:block; height:100%; background:var(--accent); border-radius:5px;}
  .ot-hr b.q{color:#0ea5e9; text-align:center;} .ot-hr b.c{color:#d97706; text-align:center;}
  /* Panel tabs: a person on 2+ panels sees each panel's own target */
  .ot-tabs{display:none; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .ot-tabs button{font:inherit; font-size:12.5px; font-weight:700; padding:7px 13px; border-radius:20px; border:0; background:#f0f1f4; color:var(--muted); display:inline-flex; gap:6px; align-items:center; cursor:pointer;}
  .ot-tabs button i{width:8px; height:8px; border-radius:50%; background:var(--pc,#14161a); flex:none;}
  .ot-tabs button.on{background:var(--pc,#14161a); color:#fff;} .ot-tabs button.on i{background:#fff;}
  .ot-tabs button b{color:#16945a;} .ot-tabs button.on b{color:#fff;}
  /* Archive: day by day for a month */
  .ar-r{display:grid; grid-template-columns:1.5fr .6fr 1fr 1fr 54px; gap:6px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:13px; text-align:right; white-space:nowrap;}
  .ar-r > :first-child{text-align:left; white-space:normal;}
  .ar-r.head{border-top:0; padding-top:0; font-size:10.5px; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .ar-r.tot{font-weight:800; border-top:2px solid var(--line);}
  .ar-r .off{display:block; color:var(--muted); font-style:italic; font-size:11px; font-weight:500;}
  .ar-p{display:inline-block; min-width:44px; text-align:center; border-radius:20px; padding:2px 8px; font-size:11.5px; font-weight:700;}
  #arMonth{border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:13px; background:#fff; width:auto !important; min-height:0; height:auto; margin:0; flex:0 0 auto !important; align-self:flex-start;}
  @media (max-width:520px){ .ar-r{grid-template-columns:1.5fr 1fr 1fr 50px; font-size:12px; gap:4px;} .ar-r .hm{display:none;} }
  #statGrid{grid-template-columns:repeat(3,1fr);}   /* 6 tiles = two tidy rows of three */
  /* commission tiles */
  .stat-card.com .value{color:#0f7a41;}
  .stat-card .sub{font-size:11.5px; color:var(--muted); margin-top:2px; line-height:1.3;}
  .stat-card .sub:empty{display:none;}
  .stat-card .value.wait{color:#9ca3af; font-weight:600;}
  @media (max-width:520px){ .stat-card .sub{font-size:10px;} }
  @media (max-width:520px){ .qc{gap:8px;} .qc .qb{padding:10px;} .qc .qn{font-size:24px;} .qc .ln{flex-direction:column; gap:0;} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>My Sales</h1></div>
    <div class="content">
      <div id="alertBox"></div>
      <div class="card cch rtc" id="rateCard" style="display:none;"></div>
      <div class="card cch" id="coachCard" style="display:none;"></div>
      <div class="card cch chc" id="chatCard" style="display:none;"></div>

      <div id="otWrap">
        <div class="card ot-card">
          <div class="card-head"><h2>Today's target</h2><span class="ot-chip mute" id="otChip">…</span></div>
          <div style="padding:16px 20px;">
            <div class="ot-tabs" id="otTabs"></div>
            <div class="ot-big" id="otBig">…</div>
            <div id="otBarBox"></div>
            <div class="ot-note" id="otNote"></div>
            <div class="ot-sub" id="otSub"></div>
          </div>
        </div>
        <div class="card ot-card" id="otHoursCard" style="display:none;">
          <div class="card-head"><h2>Hour by hour</h2><span style="font-size:12px; color:var(--muted);">Query · Camp.</span></div>
          <div style="padding:12px 20px 14px;" id="otHours"></div>
        </div>
      </div>

      <div class="stat-grid" id="statGrid" style="display:none;"></div>

      <div class="card" id="qcCard" style="max-width:640px; margin-bottom:20px; display:none;">
        <div class="card-head"><h2>Query &amp; Campaign</h2><span style="font-size:12.5px; color:var(--muted);">Today</span></div>
        <div style="padding:16px 20px;"><div class="qc" id="qcBox"></div></div>
      </div>

      <div class="card" id="detailCard" style="max-width:640px; display:none;">
        <div style="padding:16px 20px;" id="detailBox"></div>
      </div>

      <div class="card" id="arCard" style="max-width:640px; margin-top:20px; display:none;">
        <div class="card-head"><h2 id="arTitle">Archive</h2><select id="arMonth" aria-label="Month"></select></div>
        <div style="padding:8px 20px 16px;" id="arBody"></div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/layout.js?v=3"></script>
<script src="assets/js/ml_slab.js?v=261024a"></script>
<script src="assets/js/flash_offer.js?v=261024a"></script>
<script src="assets/js/convo.js?v=261022b"></script>
<script>
  guardPage();
  renderSidebar('my_sales');

  const inr = (v) => '₹' + Number(v || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });
  // Short amounts for the narrow stat cards on phones (₹1.2L / ₹64.1k).
  const inrShort = (v) => { v = Number(v || 0); return v >= 100000 ? '₹' + (v / 100000).toFixed(1).replace(/\.0$/, '') + 'L' : (v >= 1000 ? '₹' + (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : inr(v)); };
  const money = (v) => `<span class="amt-full">${inr(v)}</span><span class="amt-short">${inrShort(v)}</span>`;
  const pctOf = (v, t) => (t > 0 ? Math.round((v / t) * 100) : null);
  const pctColor = (p) => p >= 100 ? '#7C3AED' : (p >= 60 ? '#0f7a41' : (p >= 30 ? '#b45f06' : '#c81e1e'));

  // The Query and Campaign counts set for him (Assign Queries), the orders chosen as Query / Campaign today, and the panel split of today's counts.
  function renderQC(d) {
    if (!d.qc) return;       // older api.php without it
    const panels = Array.isArray(d.qc_panels) ? d.qc_panels : [];
    const half = (k, title) => {
      const x = d.qc[k] || {};
      const byPanel = panels.filter(p => Number(p[k]) > 0).map(p => `<div class="ln pn"><span>${esc(p.label)}</span><b>${Number(p[k])}</b></div>`).join('');
      return `<div class="qb ${k}"><div class="qt">${title}</div><div class="qn">${Number(x.today || 0)}<small>today</small></div>` +
        byPanel +
        `<div class="ln"><span>${title} orders</span><b>${Number(x.orders || 0)} · ${money(x.sales)}</b></div>` +
        `<div class="ln"><span>This month</span><b>${Number(x.month || 0)}</b></div></div>`;
    };
    document.getElementById('qcBox').innerHTML = half('query', 'Query') + half('campaign', 'Campaign');
    document.getElementById('qcCard').style.display = '';
  }
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------- Month figures and commission ----------
  // Worked out here from this employee's own orders and the commission rules — the same calculation as the Commission page
  // (slab rate by target / ticket size / prepaid share, then the order-code rules), so the numbers match what Admin sees.
  const CM = { rules: null, code: { on: false, rules: [], shares: {} }, target: {}, status: {}, idx: {}, ord: [], manual: {}, slab: null, flash: [] };
  const STORE_TO_GROUP = { tmperfumehouse: 'tmph' };
  // ---------- Panels: a person on 2+ panels has a separate target (and sales) in each ----------
  const PN = { list: [], sel: '', tgt: {}, labels: {}, sales: {}, today: '', repaint: null };
  const PORDER = ['tmph', 'tm4u', 'tmsg'];
  const PCOL = { tmph: '#1d4ed8', tm4u: '#7e22ce', tmsg: '#15803d' };
  const panelOfOrder = (o) => o.house || STORE_TO_GROUP[o.store_key] || '';
  const pLabel = (k) => PN.labels[k] || k;
  const pSales = (k, day) => ((PN.sales[k] || {})[day] || { ach: 0 }).ach;
  const pTarget = (k, day) => Number((PN.tgt[k] || {})[day] || 0);
  const pMonth = (k) => {
    let ach = 0, tgt = 0;
    Object.keys(PN.sales[k] || {}).forEach((d) => { ach += PN.sales[k][d].ach; });
    Object.keys(PN.tgt[k] || {}).forEach((d) => { tgt += Number(PN.tgt[k][d] || 0); });
    return { ach, tgt };
  };
  const panelMode = () => PN.list.length > 0 && PN.sel !== 'all';
  function setupPanels(cm, today) {
    PN.today = today; PN.tgt = cm.target_panels || {}; PN.labels = cm.panel_labels || {};
    const keys = new Set([...Object.keys(PN.tgt), ...Object.keys(PN.sales)]);
    PN.list = [...keys].filter((k) => k && (pMonth(k).tgt > 0 || pMonth(k).ach > 0)).sort((a, b) => PORDER.indexOf(a) - PORDER.indexOf(b));
    if (PN.list.length < 2) PN.list = [];            // one panel: the page stays as it was
    if (PN.sel !== 'all' && PN.list.indexOf(PN.sel) === -1) PN.sel = PN.list[0] || 'all';
  }
  function renderTabs() {
    const el = document.getElementById('otTabs');
    if (!el) return;
    if (!PN.list.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
    const hit = (k) => { const t = pTarget(k, PN.today); return t > 0 && pSales(k, PN.today) >= t; };
    el.innerHTML = PN.list.map((k) => `<button type="button" data-k="${k}" class="${PN.sel === k ? 'on' : ''}" style="--pc:${PCOL[k] || '#14161a'}"><i></i>${esc(pLabel(k))}${hit(k) ? ' <b>✓</b>' : ''}</button>`).join('')
      + `<button type="button" data-k="all" class="${PN.sel === 'all' ? 'on' : ''}">All</button>`;
    el.style.display = 'flex';
    el.querySelectorAll('button').forEach((b) => { b.onclick = () => selectPanel(b.dataset.k); });
  }
  function selectPanel(k) { PN.sel = k; renderTabs(); if (PN.repaint) PN.repaint(); renderTop(); refreshArchive(); }
  const isPre = (fs) => { fs = String(fs || '').toLowerCase(); return fs.indexOf('cod') === -1 && fs.indexOf('pending') === -1; };

  function calcCommission(achieved, target, ticket, prepaidPct) {
    const R = CM.rules;
    if (!R || !R.length || achieved <= 0) return null;
    const overPct = target > 0 ? ((achieved / target) - 1) * 100 : 0;
    const hit = target > 0 ? achieved >= target : false;
    const over = R.filter((r) => r.rule_type === 'over_target' && overPct >= Number(r.over_pct) && ticket >= Number(r.ticket_min));
    over.sort((a, b) => Number(b.over_pct) - Number(a.over_pct) || Number(b.ticket_min) - Number(a.ticket_min));
    let rate;
    if (over.length) rate = Number(over[0].rate);
    else {
      const base = R.filter((r) => r.rule_type === 'base' && Number(r.achieved_target) === (hit ? 1 : 0) && ticket >= Number(r.ticket_min));
      base.sort((a, b) => Number(b.ticket_min) - Number(a.ticket_min));
      rate = base.length ? Number(base[0].rate) : 0;
      const pm = R.filter((r) => r.rule_type === 'prepaid' && prepaidPct >= Number(r.prepaid_min));
      pm.sort((a, b) => Number(b.prepaid_min) - Number(a.prepaid_min));
      if (pm.length) rate += Number(pm[0].rate);
    }
    rate = Math.round(rate * 100) / 100;
    return { rate, hit, ticket };
  }
  // Order-code rules: a share set by hand wins, else the first switched-on rule that matches, else the full 100%.
  function shareFor(x, ctx) {
    const m = CM.code.shares[x.key];
    if (m) return { mode: m.mode || 'pct', v: Number(m.share_pct) };   // pct = share of the normal commission, rate = % of the order, flat = ₹
    if (!CM.code.on) return null;
    const has = !!x.code;
    for (const r of CM.code.rules) {
      if (!Number(r.enabled)) continue;
      if (r.houses && String(r.houses).split(',').indexOf(x.house) === -1) continue;
      const wt = r.when_target || 'any', wk = r.when_ticket || 'any';
      if (wt !== 'any' || wk !== 'any') {
        if (!ctx) continue;
        if (wt === 'hit' && !ctx.hit) continue;
        if (wt === 'miss' && ctx.hit) continue;
        if (wk === 'lt' && !(ctx.ticket < Number(r.when_ticket_val))) continue;
        if (wk === 'gte' && !(ctx.ticket >= Number(r.when_ticket_val))) continue;
      }
      if (r.match_type === 'no_code' && has) continue;
      if (r.match_type === 'has_code' && !has) continue;
      if (r.match_type === 'prefix' && !(has && String(x.code).toUpperCase().indexOf(String(r.prefix).toUpperCase()) === 0)) continue;
      return { mode: r.pay_mode, v: Number(r.pay_value) };
    }
    return null;
  }
  function calcPrice(x, ctx) {
    const sh = shareFor(x, ctx);
    if (!sh) return { eff: x.amt, flat: 0 };
    if (sh.mode === 'flat') return { eff: 0, flat: sh.v };
    if (sh.mode === 'rate') return { eff: 0, flat: x.amt * sh.v / 100 };
    return { eff: x.amt * sh.v / 100, flat: 0 };
  }
  const hasCond = () => CM.code.on && CM.code.rules.some((r) => Number(r.enabled) && ((r.when_target || 'any') !== 'any' || (r.when_ticket || 'any') !== 'any'));

  function bizDayOf(dt, dayStart) {
    const d = new Date(dt);
    const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    if (hm < dayStart[d.getDay()]) d.setDate(d.getDate() - 1);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function buildOrders(orders, from, to, dayStart) {
    CM.idx = {}; CM.ord = []; PN.sales = {};
    (orders || []).forEach((o) => {
      if (o.cancelled) return;                                                    // cancelled orders earn nothing
      if (!STORE_TO_GROUP[o.store_key] && !(o.allocated && o.house)) return;       // only the house stores (+ MySales orders moved to a panel)
      const day = o.biz_date || bizDayOf(o.created_at, dayStart);
      if (day < from || day > to) return;
      const rk = o.house === 'tm4u' ? 'tm4u' : '';
      const amt = Number(o.total || 0), pre = isPre(o.financial_status);
      const x = { key: (o.store_key || o.source || '') + ':' + o.id, house: o.house || STORE_TO_GROUP[o.store_key] || '', code: o.code || '', amt, pre, ml: o.ml == null ? null : Number(o.ml), day, rk, created: o.created_at };
      const p = calcPrice(x); x.eff = p.eff; x.flat = p.flat;
      CM.ord.push(x);
      const cell = ((CM.idx[rk] = CM.idx[rk] || {})[day] = CM.idx[rk][day] || { ach: 0, n: 0, pre: 0, eff: 0, flat: 0, orders: [] });
      cell.ach += amt; cell.n++; if (pre) cell.pre += amt; cell.eff += x.eff; cell.flat += x.flat; cell.orders.push(x);
      const pk = panelOfOrder(o);
      if (pk) { const pc = ((PN.sales[pk] = PN.sales[pk] || {})[day] = PN.sales[pk][day] || { ach: 0, n: 0 }); pc.ach += amt; pc.n++; }
    });
  }
  // ML price slab: his daily target of that day (that row) is complete? No target set = not capped.
  function slabHit(o) {
    const t = Number(((CM.target || {})[o.rk] || {})[o.day] || 0);
    if (!(t > 0)) return null;      // no target that day: no bonus, no cut
    const cell = (CM.idx[o.rk] || {})[o.day];
    return !!cell && cell.ach >= t;
  }
  // One row ('' = all panels, 'tm4u' = the TM4U row) over a set of days.
  function aggRow(rk, days, useManual) {
    let ach = 0, n = 0, pre = 0, eff = 0, flat = 0, target = 0;
    const orders = [];
    days.forEach((d) => {
      const x = (CM.idx[rk] || {})[d];
      if (x) { ach += x.ach; n += x.n; pre += x.pre; eff += x.eff; flat += x.flat; orders.push(...x.orders); }
      target += Number(((CM.target || {})[rk] || {})[d] || 0);
    });
    const ticket = n ? ach / n : 0, prePct = ach > 0 ? Math.min(100, pre / ach * 100) : 0;
    const c = calcCommission(ach, target, ticket, prePct);
    if (c && hasCond()) {                  // rules that depend on this employee's target / ticket size price each order in that context
      eff = 0; flat = 0;
      orders.forEach((o) => { const p = calcPrice(o, { hit: c.hit, ticket: c.ticket }); eff += p.eff; flat += p.flat; });
    }
    const man = useManual ? (CM.manual || {})[rk] : null;      // commission set by hand for him this month (Commission page) replaces the worked-out one
    if (man) return { ach, n, target, rate: man.rate, amount: man.amount, rated: true, manual: true };
    let amount = c ? c.rate * eff / 100 + flat : 0, slabN = 0;
    // ML price slab (same as the Commission page): an order with a known total ML pays its slab % instead of the normal rate.
    if (window.MLSLAB && (MLSLAB.on(CM.slab) || CM.flash.length)) {
      const ctx = c && hasCond() ? { hit: c.hit, ticket: c.ticket } : undefined;
      orders.forEach((o) => {
        // ⚡ Flash Offer: this size sold inside the offer's hours → the offer's flat % (price not compared); wins over the slab
        const f = CM.flash.length ? MLSLAB.flashFor(CM.flash, o.ml, o.created) : null;
        const s = f ? MLSLAB.flashCom(f, o) : (MLSLAB.on(CM.slab) ? MLSLAB.orderCom(CM.slab, Object.assign({ emp: CM.slab.me }, o), slabHit(o)) : null);   // 📅 special days for me
        if (!s) return;
        const p = ctx ? calcPrice(o, ctx) : o;
        amount += s.v - (c ? c.rate * p.eff / 100 + p.flat : 0); slabN++;
      });
    }
    if (slabN && slabN === n) return { ach, n, target, rate: ach > 0 ? Math.round(amount / ach * 10000) / 100 : 0, amount, rated: true, slab: true };
    return { ach, n, target, rate: c ? c.rate : 0, amount, rated: !!c || slabN > 0 };
  }
  function period(days, useManual) {
    const rows = ['', 'tm4u'].map((rk) => aggRow(rk, days, useManual));
    const sum = (k) => rows.reduce((a, r) => a + r[k], 0);
    const live = rows.filter((r) => (r.ach > 0 || r.manual) && r.rated);
    return { ach: sum('ach'), n: sum('n'), target: sum('target'), amount: sum('amount'), rate: live.length === 1 ? live[0].rate : null, rated: live.length > 0, manual: rows.some((r) => r.manual) };
  }
  const rateTxt = (r, man) => r === null ? (man ? 'set by Admin' : '') : (man ? 'set by Admin · ' : '') + (Math.round(r * 100) / 100) + '% rate';

  async function loadCommission(d) {

      ['tComSub', 'mComSub'].forEach((id) => { const el = document.getElementById(id); if (el) el.textContent = sub || ''; });
    };
    const fallbackMonth = () => {      // month figures as stored by the Targets page, when the live ones could not be worked out
      const a = document.getElementById('mSales'), b = document.getElementById('mOrders');

        same ? PRE.cm : api.get('my.commission'),

        PRE.tm,

        document.getElementById('tComCard').remove(); document.getElementById('mComCard').remove();
        fallbackMonth();

        return;
      }
      const dayStart = tm && Array.isArray(tm.start) && tm.start.length === 7 ? tm.start : ['10:00', '10:00', '10:00', '10:00', '10:00', '10:00', '10:00'];
      CM.rules = cm.rules || [];
      CM.code = { on: !!(cm.code && cm.code.on), rules: (cm.code && cm.code.rules) || [], shares: (cm.shares && !Array.isArray(cm.shares)) ? cm.shares : {} };
      CM.target = cm.target || {}; CM.status = cm.status || {}; CM.manual = (cm.manual && !Array.isArray(cm.manual)) ? cm.manual : {}; CM.slab = cm.ml_slab || null;
      buildOrders(od.orders || [], from, to, dayStart);
      const days = []; for (let x = from; x <= to; ) { days.push(x); const t = new Date(x + 'T00:00:00'); t.setDate(t.getDate() + 1); x = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
      const m = period(days, true), t = period([to]);
      const set = (id, html) => { const el = document.getElementById(id); if (el) { el.innerHTML = html; el.classList.remove('wait'); } };
      set('mSales', money(m.ach)); set('mOrders', String(m.n));
      set('tCom', money(t.amount)); set('mCom', money(m.amount));
      LIVE = { cm, od, dayStart, to };
      setupPanels(cm, to);
      PN.repaint = () => liveTarget(d, t);
      renderTabs(); PN.repaint(); renderTop();
      initArchive(d);
      document.getElementById('tComSub').textContent = t.rated ? rateTxt(t.rate) : (t.ach > 0 ? '' : 'No sales yet today');
      document.getElementById('mComSub').textContent = m.rated ? rateTxt(m.rate, m.manual) : (m.ach > 0 ? '' : 'No sales yet this month');
      if (!CM.rules.length) setBoth('—', 'Commission rules not set');
      const errs = (od.errors || []).filter(Boolean);
      if (errs.length) showErr('Some orders could not be loaded, so month figures may be incomplete: ' + errs.join(' · '));
    } catch (err) {

  }
  // ---------- Live target (same figure Admin sees on the Orders page) and the day-by-day archive ----------
  let LIVE = null;

  function liveTarget(d, t) {

    TOP.target = t.target > 0 ? t.target : Number(d.daily_target || 0); renderTop();
  }
  const dayTarget = (cm, d) => Number(((cm.target || {})[''] || {})[d] || 0) + Number(((cm.target || {}).tm4u || {})[d] || 0);
  function archiveRows(cm, orders, from, to, dayStart) {
    const by = {}, pk = panelMode() ? PN.sel : '';
    (orders || []).forEach((o) => {
      if (o.cancelled) return;
      if (pk && panelOfOrder(o) !== pk) return;
      if (!STORE_TO_GROUP[o.store_key] && !(o.allocated && o.house)) return;
      const day = o.biz_date || bizDayOf(o.created_at, dayStart);
      if (day < from || day > to) return;
      const x = by[day] = by[day] || { n: 0, ach: 0 };
      x.n++; x.ach += Number(o.total || 0);
    });
    const rows = [];
    for (let x = from; x <= to; ) {
      const b = by[x] || { n: 0, ach: 0 };
      rows.push({ day: x, n: b.n, ach: b.ach, tg: pk ? Number(((cm.target_panels || {})[pk] || {})[x] || 0) : dayTarget(cm, x), st: (cm.status || {})[x] || '' });
      const t = new Date(x + 'T00:00:00'); t.setDate(t.getDate() + 1);
      x = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
    }

  }
  const ST_TXT = { absent: 'Absent', leave: 'Leave', half_leave: 'Half leave', wfh: 'WFH', holiday: 'Holiday', week_off: 'Week off' };
  function renderArchive(rows) {

    let on = 0, os = 0, ot = 0, hit = 0, days = 0;
    const tr = shown.map((r) => {
      on += r.n; os += r.ach; ot += r.tg;

      const chip = p === null ? '<span style="color:var(--muted);">—</span>' : `<span class="ar-p" style="background:${p >= 100 ? '#e7f6ec' : (p >= 60 ? '#fff3df' : '#fdecec')}; color:${pctColor(p)};">${p}%</span>`;

      <div style="font-size:12px; color:var(--muted); margin-top:10px;">${days ? 'Target hit on ' + hit + ' of ' + days + ' days.' : ''} Days with no sales and no target are left out.</div>`;

  let ARCD = null;

  function initArchive(d) {

  // ---- My Target: the order target Admin set for him on Order Targets (read-only) ----
  const otTime = (hhmm) => { const m = String(hhmm || '').match(/^(\d{1,2}):(\d{2})/); if (!m) return ''; const h = Number(m[1]); return ((h % 12) || 12) + ':' + m[2] + ' ' + (h < 12 ? 'AM' : 'PM'); };
  // The top card: today's ₹ target (the same figure Admin sees) with the ₹ done so far. People tracked on Order Targets

    else {

  async function loadTarget() {
    let d = null;
    try { d = await api.get('order_targets.mine'); } catch (err) { /* older api.php or no access: the card works without it */ }
    TOP.ot = d && d.tracked ? d : null;
    const card = document.getElementById('otHoursCard');
    const shown = TOP.ot ? (TOP.ot.hours || []).filter(h => h.open).reverse() : [];
    card.style.display = shown.length ? '' : 'none';
    if (shown.length) {
      const mx = Math.max(1, ...shown.map(h => h.orders));
      document.getElementById('otHours').innerHTML = '<div class="ot-hr head"><span>Hour</span><span></span><span style="text-align:center">Q</span><span style="text-align:center">C</span></div>'
        + shown.map(h => `<div class="ot-hr${h.hour === TOP.ot.now_hour ? ' now' : ''}"><span>${h.label}${h.hour === TOP.ot.now_hour ? ' ●' : ''}</span><div class="mini"><i style="width:${h.orders / mx * 100}%"></i></div><b class="q">${h.query || 0}</b><b class="c">${h.campaign || 0}</b></div>`).join('');
    }
    renderTop();
  }
  // ---------- Coach (top): pace — where you should be by now (from the store's real hourly pattern) vs where you are — ranks, every tip ----------
  async function loadCoach() {
    const box = document.getElementById('coachCard');
    let d; try { d = await api.get('my.coach'); } catch (e) { return; }
    const m = d && d.me; if (!m) { box.style.display = 'none'; return; }
    const ce = (x) => String(x == null ? '' : x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const rs = (v) => '₹' + Math.round(Number(v) || 0).toLocaleString('en-IN');
    const T = Number(m.target) || 0, G = d.goal || { mode: 'none' }, goalMode = G.mode === 'newgoal';
    const barT = goalMode ? Number(G.goal) : T, cls = G.mode === 'ahead' || G.mode === 'done' ? '' : 'jb';
    // Never red for the salesperson: ahead = green, behind = amber Focus / Catch-up, out of reach today = a new goal they can win.
    const badge = G.mode === 'none' ? '<span class="pb na">No target today</span>'
      : G.mode === 'done' ? `<span class="pb dn">🏆 Target done${d.bonus > 0 ? ' · +' + d.bonus + '% on every order' : ''}</span>`
      : G.mode === 'ahead' ? `<span class="pb ah">🟢 Ahead of time by ${Math.round(m.pct - m.should_pct)}%</span>`
      : G.mode === 'near' ? `<span class="pb jb">🎯 Focus: ${rs(G.behind)} to get back on track</span>`
      : G.mode === 'catchup' ? `<span class="pb jb">🎯 Catch-up mode · ${rs(G.behind)} · ~${G.orders} order${G.orders == 1 ? '' : 's'}</span>`
      : `<span class="pb jb">🎯 Today's goal: ${rs(G.goal)}</span>`;
    const tm = d.team || {}, rk = (k) => { const n = (tm.ranked || {})[k] || 0, r = m['rank_' + k]; return n >= 3 && r && r <= Math.max(1, Math.min(10, Math.floor(n / 3))) ? `<small> · #${r}</small>` : ''; };      // rank shown only in the real top third (#3 of 3 is last place)
    const leftShare = m.should_pct != null ? Math.max(0, Math.round(100 - m.should_pct)) : null;
    const teamLine = G.mode === 'ahead' && tm.people > 1 ? `👥 Team: ફક્ત ${tm.ahead} of ${tm.people} time કરતાં આગળ — તમે એમાંના એક 🔥`
      : (G.mode !== 'done' && leftShare != null && leftShare >= 15 ? `⏳ આજના આશરે ${leftShare}% orders હજુ આવવાના બાકી છે — હજુ પૂરો સમય છે 💪` : '');
    const yd = Number(m.yest_same) || 0;
    const cmp = yd > 0 ? (m.sales > yd ? `<div class="cp up">📈 ગઈકાલ આ સમય કરતાં <b>${rs(m.sales - yd)}</b> આગળ</div>` : `<div class="cp">ગઈકાલે આ સમયે ${rs(yd)} — બસ <b>${rs(yd - m.sales)}</b> અને તમે આગળ 📈</div>`) : '';
    const mm = m.month || {};
    const order = { push: 0, win: 1, focus: 2, learn: 3 };
    const tips = (d.tips || []).slice().sort((a, b) => (order[a.kind] ?? 9) - (order[b.kind] ?? 9));
    box.innerHTML = `<h2>💡 Today · ${ce(m.name)} ${badge}</h2>
      ${barT > 0 ? `<div class="pace ${cls}"><i style="width:${Math.min(100, m.sales / barT * 100)}%"></i>${!goalMode && G.mode !== 'done' && m.should_pct != null ? `<u style="left:${Math.min(100, m.should_pct)}%" title="Where you should be by now"></u>` : ''}</div>
      <div class="sm"><span>${rs(m.sales)} / ${rs(barT)}${goalMode ? ' goal' : ' · ' + m.pct + '%'}</span><span>${goalMode || G.mode === 'done' ? '' : 'should be ' + Math.round(m.should_pct) + '% now'}</span></div>` : ''}
      ${teamLine ? `<div class="sm" style="margin-top:4px;">${teamLine}</div>` : ''}${cmp}
      <div class="kp"><div>Orders<b>${m.orders}${rk('orders')}</b></div><div>Commission today<b>${rs(m.com_today)}</b></div><div>Ticket size<b>${m.orders ? rs(m.ticket) : '—'}${rk('ticket')}</b></div></div>
      ${(d.won || []).length ? `<div class="bdg">${d.won.map((x) => `<span>${x[0]} ${ce(x[1])}</span>`).join('')}</div>` : ''}
      ${d.next ? `<div class="nx">⏭️ Next: <b>${ce(d.next)}</b></div>` : ''}
      ${tips.length ? `<div class="ck">YOUR COACH · TODAY</div>` + tips.map((t) => `<div class="tp ${t.kind}"><span class="e">${t.icon}</span><div><b>${ce(t.title)}</b>${ce(t.text)}</div></div>`).join('') : `<div class="ck">YOUR COACH</div><div class="tp win"><span class="e">👍</span><div><b>ચાલો શરૂ કરીએ!</b>આજનો પહેલો order કરો — tips અહીં દેખાશે.</div></div>`}
      ${mm.days ? `<div class="mo"><b>📅 This month</b><span>Target done <b>${mm.done}/${mm.days}</b> days</span><span>Best day <b>${rs(m.best_day)}</b></span><span>Best week <b>${rs(mm.best_week)}</b></span><span>Avg day <b>${rs(m.avg_day)}</b></span></div>` : ''}`;
    box.style.display = '';
  }

  // ---------- My Rating (top): one mix rating out of 10 from ten parts — today (live) and this month — with the biggest lift ----------
  const RT = { d: null, view: 'today' };
  const rtCol = (v) => v >= 8 ? '#16a34a' : v >= 6.5 ? '#22c55e' : '#f59e0b';          // never red for the salesperson
  const rtRing = (v, cls, sub) => `<div class="rg ${cls || ''}" style="background:conic-gradient(${v == null ? '#e2e8f0' : rtCol(v)} ${v == null ? 0 : v * 10}%, #e2e8f0 0)"><span>${v == null ? '—' : Number(v).toFixed(1)}${sub ? `<small>${sub}</small>` : ''}</span></div>`;
  async function loadRating() {
    try { RT.d = await api.get('rating.mine'); } catch (e) { return; }
    renderRating();
  }
  function renderRating() {
    const box = document.getElementById('rateCard'), d = RT.d;
    if (!d || !d.applicable || (!d.today && !d.month)) { box.style.display = 'none'; return; }
    const ce = (x) => String(x == null ? '' : x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    if (RT.view === 'today' && !d.today) RT.view = 'month';
    const cur = RT.view === 'today' ? d.today : d.month, P = d.parts || {};
    const fmt = (v) => v == null ? '—' : Number(v).toFixed(1);
    const tv = d.today ? d.today.score : null, mv = d.month ? d.month.score : null;
    const arrow = tv != null && d.yesterday != null ? (tv > d.yesterday ? ' 📈' : tv < d.yesterday ? '' : ' ↔') : '';
    const mx = Math.max(10, ...(d.trend || []).map((t) => t.score));
    let h = `<div class="hd"><h2>⭐ My Rating</h2><div class="tabs">${d.today ? `<button type="button" data-rtv="today" class="${RT.view === 'today' ? 'on' : ''}">Today</button>` : ''}${d.month ? `<button type="button" data-rtv="month" class="${RT.view === 'month' ? 'on' : ''}">This month</button>` : ''}</div></div>
      <div class="top">${rtRing(tv, '', 'TODAY')}${rtRing(mv, 's', 'MONTH')}<div style="flex:1; min-width:160px;">${cur && cur.label ? `<span class="lbp">${ce(cur.label)}</span>` : ''}
        <div class="meta">${d.yesterday != null && tv != null ? `ગઈકાલ ${fmt(d.yesterday)} → આજે ${fmt(tv)}${arrow}<br>` : ''}${d.last_month != null && mv != null ? `Last month ${fmt(d.last_month)} → this month ${fmt(mv)}${mv > d.last_month ? ' 📈' : ''}<br>` : ''}${d.best != null ? `Personal best ${fmt(d.best)} (${ce(String(d.best_day).slice(8, 10) + '/' + String(d.best_day).slice(5, 7))})` : ''}</div></div></div>`;
    if ((d.trend || []).length > 1) h += `<div class="spark">${d.trend.map((t, i) => `<i class="${i === d.trend.length - 1 ? 't' : t.score < 6 ? 'lo' : ''}" style="height:${Math.max(6, t.score / mx * 100)}%" title="${ce(t.day)}: ${fmt(t.score)}"></i>`).join('')}</div><div class="meta">Last ${d.trend.length} days</div>`;
    if (cur) {
      h += Object.keys(P).map((k) => {
        const v = cur.parts[k];
        if (v == null) return `<div class="pt na"><span>${P[k].icon} ${ce(P[k].label)}</span><div class="bar"></div><b>—</b></div>`;
        return `<div class="pt"><span>${P[k].icon} ${ce(P[k].label)}</span><div class="bar"><i style="width:${v * 10}%; background:${rtCol(v)}"></i></div><b>${fmt(v)}</b>${v < 7 && cur.notes && cur.notes[k] ? `<small>🎯 ${ce(cur.notes[k])}</small>` : ''}</div>`;
      }).join('');
      const I = cur.insight || {};
      if ((I.strong || []).length) h += `<div class="tp win"><span class="e">✅</span><div><b>Strongest</b>${I.strong.map((k) => ce(P[k].label) + ' ' + fmt(cur.parts[k])).join(' · ')}</div></div>`;
      if (I.lift) h += `<div class="tp focus"><span class="e">🚀</span><div><b>Biggest lift: ${ce(P[I.lift.k].label)} ${fmt(I.lift.from)} → ${I.lift.to} = rating +${I.lift.gain} → ${fmt(Math.min(10, cur.score + I.lift.gain))}</b>${ce(I.lift.fix || '')}</div></div>`;
      else h += `<div class="tp win"><span class="e">🌟</span><div><b>બધા parts 8+ છે!</b>આમ જ ચાલુ રાખો — તમે team માટે example છો.</div></div>`;
    }
    box.innerHTML = h; box.style.display = '';
  }
  document.getElementById('rateCard').addEventListener('click', (e) => { const b = e.target.closest('[data-rtv]'); if (b) { RT.view = b.dataset.rtv; renderRating(); } });

  // ---------- Chat coach: the AI reviews of my WhatsApp chats / calls (assets/js/convo.js), my skills next to the top sellers', the team playbook ----------
  async function loadChat() {
    const box = document.getElementById('chatCard');
    if (!window.Convo) return;
    let d; try { d = await api.get('convo.mine'); } catch (e) { return; }
    Convo.setCfg(d.cfg);
    const [ct, pm] = await Promise.all([api.get('convo.calls_today').catch(() => null), api.get('premsg.list').catch(() => null)]);
    const ce = (x) => String(x == null ? '' : x).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const w = d.week || {}, list = d.list || [];
    const word = (s) => s >= 8 ? 'Great conversations 🌟' : s >= 6.5 ? 'Good conversations 👏' : s >= 5 ? 'Good base — small fixes 💪' : 'Let\'s improve together 💪';
    let h = `<div class="hd"><h2>💬 Chat coach</h2><button type="button" class="lb" id="chLost" title="Customer asked but did not order">＋ Lost chat</button></div>`;
    if (ct && (ct.required > 0 || ct.uploaded > 0)) h += `<div class="ms">📞 આજના call recordings: <b>${ct.uploaded} / ${ct.required || ct.uploaded}</b>${ct.queries ? ' (' + ct.queries + ' queries)' : ''}${ct.required > ct.uploaded ? ' — Punch Out પહેલાં ' + (ct.required - ct.uploaded) + ' બાકી' : ' ✅'} <a href="#" id="chCalls">Upload →</a></div>`;
    else h += `<div class="ms">📞 Call recordings upload કરો — AI order વાળા અને no-order calls બંને માંથી coaching આપશે. <a href="#" id="chCalls">Upload →</a></div>`;
    if (w.avg != null) {
      h += `<div class="top">${Convo.ring(w.avg)}<div><b>${word(w.avg)}</b><div class="s">Last 7 days · ${w.n} chat${w.n === 1 ? '' : 's'}${w.calls ? ' · ' + w.calls + ' call' + (w.calls === 1 ? '' : 's') + (w.call_avg != null ? ' (📞 ' + Number(w.call_avg).toFixed(1) + ')' : '') : ''}</div>`
        + (w.prev != null ? `<div class="s">${w.avg >= w.prev ? '📈' : '↔'} Previous week ${Number(w.prev).toFixed(1)} → ${Number(w.avg).toFixed(1)}</div>` : '') + `</div></div>`;
    } else if (!list.length) {
      h += `<div class="ms">📎 Order allocate કર્યા પછી <b>Chat proof</b> માં chat ના ${d.cfg.min_shots}+ screenshots (અને ઈચ્છો તો call recording) upload કરો — AI બતાવશે શું સારું ગયું અને આગળ શું try કરવું. <a href="order_allocation.html">Order Allocation →</a></div>`;
    }
    if (d.missing > 0 && list.length) h += `<div class="ms">📎 આ week ના <b>${d.missing}</b> orders ની chat હજુ upload નથી — જેટલી વધારે chats, એટલું સારું coaching. <a href="order_allocation.html">Upload →</a></div>`;
    if ((d.skills || []).length) {
      const chatSk = d.skills.filter((k) => k.k.startsWith('s_')), callSk = d.skills.filter((k) => k.k.startsWith('c_'));
      h += `<div class="ck">YOUR CHAT SKILLS · LAST 30 DAYS</div>` + chatSk.map((k) => `<div class="sk"><span>${ce(k.label)}</span><b>${Number(k.me).toFixed(1)}</b><div class="bar"><i style="width:${k.me * 10}%;background:${k.me >= 7 ? '#16a34a' : '#f59e0b'}"></i>${k.top != null ? `<u style="left:${k.top * 10}%" title="Top sellers ${k.top}"></u>` : ''}</div></div>`).join('')
        + (callSk.length ? `<div class="ck">📞 CALL SKILLS</div><div class="cs">${callSk.map((k) => `<span class="${k.me >= 7 ? 'g' : 'a'}">${ce(k.label.replace(' (call)', ''))} <b>${Number(k.me).toFixed(1)}</b></span>`).join('')}</div>` : '')
        + (d.skills.some((k) => k.top != null) ? `<div class="lg">▍ = this month's top sellers</div>` : (d.is_top ? `<div class="lg">⭐ તમે આ month ના top sellers માં છો — તમારી chats team માટે example છે.</div>` : ''));
    }
    if (list.length) {
      h += `<div class="ck">YOUR REVIEWS</div>` + list.slice(0, 8).map((u) => `<div class="rv" data-cvid="${u.id}"><div>${u.kind === 'qcall' && !u.order_name ? '📞 Call · AI checking' : u.kind === 'lost' ? (u.has_call && !u.shots ? '📞 Call · no order' : '💔 Lost chat') : (u.has_call && !u.shots ? '📞 ' : '') + ce(u.order_name || 'Order')}<small>${ce(String(u.created_at).slice(5, 16).replace('-', '/'))}${u.summary_focus ? ' · 🎯 ' + ce(u.summary_focus.slice(0, 70)) + (u.summary_focus.length > 70 ? '…' : '') : ''}</small></div>${Convo.chip(u)}</div>`).join('');
    }
    const pms = pm && pm.rows ? pm.rows.filter((x) => x.rating != null && x.rating >= 6.5).slice(0, 3) : [];
    if (pms.length) h += `<div class="ck">✍️ BEST PRE-MESSAGES · FROM OUR CHATS</div>` + pms.map((x) => `<div class="pr"><b>${ce(x.title)} · ${Number(x.rating).toFixed(1)} ${ce(x.label.split(' ')[0])}</b><small>${x.uses} chats · customer replied ${Math.round((x.reply_rate || 0) * 100)}% · order ${Math.round((x.order_rate || 0) * 100)}%</small><span class="q">${ce(x.body.slice(0, 160))}${x.body.length > 160 ? '…' : ''}</span><button type="button" class="lb" style="margin-top:6px; border-color:#16a34a; color:#166534;" data-pmcopy="${x.id}">📋 Copy</button></div>`).join('');
    RT.pm = pm ? pm.rows : [];
    const pb = d.playbook;
    if (pb && (pb.rules || []).length) {
      h += `<details><summary>🏆 Winning playbook — what top sellers do (${ce(String(pb.built_at).slice(0, 10))})</summary>`
        + pb.rules.map((r, i) => `<div class="pr"><b>${i + 1}. ${ce(r.title)}</b><small>${ce(r.why)}</small>${r.try_line ? `<span class="q">💬 "${ce(r.try_line)}"</span>` : ''}</div>`).join('')
        + ((pb.avoid || []).length ? `<div class="ms">🚫 Lost chats માં દેખાય છે: ${pb.avoid.map(ce).join(' · ')}</div>` : '') + `</details>`;
    }
    const keepOpen = box.querySelector('details') && box.querySelector('details').open;
    box.innerHTML = h; box.style.display = '';
    if (keepOpen && box.querySelector('details')) box.querySelector('details').open = true;
  }
  document.getElementById('chatCard').addEventListener('click', (e) => {
    if (e.target.closest('#chLost')) { Convo.open({ kind: 'lost', onChange: () => { loadChat(); loadCoach(); } }); return; }
    if (e.target.closest('#chCalls')) { e.preventDefault(); Convo.calls({ onChange: () => { loadChat(); } }); return; }
    const cp = e.target.closest('[data-pmcopy]');
    if (cp) { const x = (RT.pm || []).find((y) => y.id === Number(cp.dataset.pmcopy)); if (x && navigator.clipboard) navigator.clipboard.writeText(x.body).then(() => { cp.textContent = '✓ Copied'; setTimeout(() => { cp.textContent = '📋 Copy'; }, 1500); }).catch(() => {}); return; }
    const r = e.target.closest('[data-cvid]');
    if (r) Convo.open({ id: Number(r.dataset.cvid), onChange: () => { loadChat(); loadCoach(); } });
  });

  // Start every call at once when the page opens (the slow ones used to wait for each other).
  const dayStartOf = (tm) => tm && Array.isArray(tm.start) && tm.start.length === 7 ? tm.start : ['10:00', '10:00', '10:00', '10:00', '10:00', '10:00', '10:00'];
  const PRE = {};
  PRE.stats = api.get('my.stats');
  PRE.tm = api.get('day_timing.get').catch(() => null);
  PRE.cm = api.get('my.commission');
  PRE.to = PRE.tm.then((tm) => bizDayOf(new Date(), dayStartOf(tm)));
  PRE.od = PRE.to.then((to) => api.get('shopify.orders', { date_from: to.slice(0, 8) + '01', date_to: to, lite: 1 }));
  [PRE.stats, PRE.cm, PRE.od].forEach((p) => p.catch(() => {}));
  loadTarget();
  loadRating();
  loadCoach();
  loadChat();
  setInterval(() => { if (!document.hidden) { loadTarget(); loadCoach(); } }, 60000);
  setInterval(() => { if (!document.hidden) loadRating(); }, 300000);
  setInterval(() => { if (!document.hidden && !document.querySelector('.cvx')) loadChat(); }, 180000);

  load();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
