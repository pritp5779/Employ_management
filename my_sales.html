<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>My Sales — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  .amt-short{display:none;}
  @media (max-width:820px){ .amt-full{display:none;} .amt-short{display:inline;} }
  /* Query / Campaign counts set for him on Assign Queries, plus today's orders of each type */
  .qc{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .qc .qb{border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0;}
  .qc .qb.query{border-left:4px solid #0EA5E9;} .qc .qb.campaign{border-left:4px solid #F59E0B;}
  .qc .qt{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;}
  .qc .query .qt{color:#0C447C;} .qc .campaign .qt{color:#854F0B;}
  .qc .qn{font-size:28px; font-weight:700; line-height:1.15; margin-top:4px;} .qc .qn small{font-size:12px; font-weight:500; color:var(--muted); margin-left:4px;}
  .qc .ln{display:flex; justify-content:space-between; gap:8px; font-size:13px; padding-top:6px; margin-top:6px; border-top:1px dashed var(--line); color:var(--muted);}
  .qc .ln b{color:var(--ink); white-space:nowrap;} .qc .ln.pn{border-top:0; margin-top:2px; padding-top:0; font-size:12px;}
  @media (max-width:520px){ .qc{gap:8px;} .qc .qb{padding:10px;} .qc .qn{font-size:24px;} .qc .ln{flex-direction:column; gap:0;} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>My Sales</h1></div>
    <div class="content">
      <div id="alertBox"></div>

      <div class="stat-grid" id="statGrid" style="display:none;"></div>

      <div class="card" id="qcCard" style="max-width:640px; margin-bottom:20px; display:none;">
        <div class="card-head"><h2>Query &amp; Campaign</h2><span style="font-size:12.5px; color:var(--muted);">Today</span></div>
        <div style="padding:16px 20px;"><div class="qc" id="qcBox"></div></div>
      </div>

      <div class="card" style="max-width:640px;">
        <div class="card-head"><h2 id="detailTitle">Details</h2></div>
        <div style="padding:16px 20px;">
          <div id="detailBox" class="loading" style="padding:0;">Loading...</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/layout.js?v=3"></script>
<script>
  guardPage();
  renderSidebar('my_sales');

  const inr = (v) => '₹' + Number(v || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 });
  // Short amounts for the narrow stat cards on phones (₹1.2L / ₹64.1k).
  const inrShort = (v) => { v = Number(v || 0); return v >= 100000 ? '₹' + (v / 100000).toFixed(1).replace(/\.0$/, '') + 'L' : (v >= 1000 ? '₹' + (v / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : inr(v)); };
  const money = (v) => `<span class="amt-full">${inr(v)}</span><span class="amt-short">${inrShort(v)}</span>`;
  const pctOf = (v, t) => (t > 0 ? Math.round((v / t) * 100) : null);
  const pctColor = (p) => p >= 100 ? '#7C3AED' : (p >= 60 ? '#0f7a41' : (p >= 30 ? '#b45f06' : '#c81e1e'));

  function bar(value, target) {
    const p = pctOf(value, target);
    if (p === null) return '<span style="font-size:12px; color:var(--muted);">No target set</span>';
    const width = Math.min(100, p);
    return `
      <div style="display:flex; align-items:center; gap:8px; margin-top:6px;">
        <div style="flex:1; height:8px; background:var(--bg); border-radius:4px; overflow:hidden;"><div style="width:${width}%; height:8px; background:${pctColor(p)};"></div></div>
        <span style="white-space:nowrap; font-size:12.5px; font-weight:700; color:${pctColor(p)};">${p}%${p >= 100 ? ' 🎯' : ''}</span>
      </div>`;
  }

  // The Query and Campaign counts set for him (Assign Queries), the orders chosen as Query / Campaign today, and the panel split of today's counts.
  function renderQC(d) {
    if (!d.qc) return;       // older api.php without it
    const panels = Array.isArray(d.qc_panels) ? d.qc_panels : [];
    const half = (k, title) => {
      const x = d.qc[k] || {};
      const byPanel = panels.filter(p => Number(p[k]) > 0).map(p => `<div class="ln pn"><span>${esc(p.label)}</span><b>${Number(p[k])}</b></div>`).join('');
      return `<div class="qb ${k}"><div class="qt">${title}</div><div class="qn">${Number(x.today || 0)}<small>today</small></div>` +
        byPanel +
        `<div class="ln"><span>${title} orders</span><b>${Number(x.orders || 0)} · ${money(x.sales)}</b></div>` +
        `<div class="ln"><span>This month</span><b>${Number(x.month || 0)}</b></div></div>`;
    };
    document.getElementById('qcBox').innerHTML = half('query', 'Query') + half('campaign', 'Campaign');
    document.getElementById('qcCard').style.display = '';
  }
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  async function load() {
    try {
      const d = await api.get('my.stats');
      renderQC(d);
      if (!d.tag) {
        document.getElementById('detailBox').innerHTML = 'No order tag is set on your profile yet — ask Admin to add one, then your sales will show here.';
        return;
      }

      const grid = document.getElementById('statGrid');
      grid.innerHTML = `
        <div class="stat-card"><div class="label">Today Sales</div><div class="value">${money(d.today.sales)}</div></div>
        <div class="stat-card"><div class="label">Today Orders</div><div class="value">${d.today.orders}</div></div>
        <div class="stat-card"><div class="label">Month Sales</div><div class="value">${money(d.month.sales)}</div></div>
        <div class="stat-card"><div class="label">Month Orders</div><div class="value">${d.month.orders}</div></div>
      `;
      grid.style.display = 'grid';

      const dayLabel = new Date(d.business_day + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short' });
      document.getElementById('detailBox').innerHTML = `
        <div style="margin-bottom:16px;">
          <div style="font-size:12px; color:var(--muted); text-transform:uppercase; font-weight:600;">Today — ${dayLabel} (10 AM to next day 10 AM)</div>
          <div style="font-size:14px; margin-top:4px;">${inr(d.today.sales)} of ${d.daily_target > 0 ? inr(d.daily_target) : '—'} daily target</div>
          ${d.ladder ? `<div style="font-size:12px; color:var(--muted); margin-top:2px;">New joiner target — week ${d.ladder.week} of 4</div>` : ''}
          ${bar(d.today.sales, d.daily_target)}
        </div>
        <div>
          <div style="font-size:12px; color:var(--muted); text-transform:uppercase; font-weight:600;">This Month</div>
          <div style="font-size:14px; margin-top:4px;">${inr(d.month.sales)} of ${d.month.target > 0 ? inr(d.month.target) : '—'} monthly target</div>
          ${bar(d.month.sales, d.month.target)}
        </div>
        ${d.today.error ? `<div class="alert error" style="margin-top:12px;">${d.today.error}</div>` : ''}
      `;
      document.getElementById('detailTitle').textContent = d.name + ' — tag "' + d.tag + '"';
    } catch (err) {
      document.getElementById('detailBox').innerHTML = `<div class="alert error">${err.message}</div>`;
    }
  }

  load();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
