<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=1">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>Users</h1></div>
    <div class="content">
      <div id="alertBox"></div>

      <div class="card">
        <div class="card-head">
          <h2>Add a login</h2>
        </div>
        <div style="padding:20px; max-width:420px;">
          <div class="field">
            <label for="newUsername">Username</label>
            <input autocomplete="off" name="hrms-new-user" type="text" id="newUsername" maxlength="100">
          </div>
          <div class="field">
            <label for="newPassword">Password (min 6 characters)</label>
            <input autocomplete="new-password" name="hrms-new-pass" type="password" id="newPassword" maxlength="100">
          </div>
          <div class="field">
            <label for="newRole">Role</label>
            <select id="newRole">
              <option value="Employee">Employee (attendance only)</option>
              <option value="HR">HR</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
          <div class="field">
            <label for="newEmployee">Linked Employee <span style="text-transform:none; font-weight:400;">(required for Employee role)</span></label>
            <select id="newEmployee">
              <option value="">— None —</option>
            </select>
          </div>
          <button type="button" class="btn" id="btnCreateUser" style="width:auto; margin-top:10px;">Create User</button>
          <div id="createUserMsg" style="font-size:13px; margin-top:10px;"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2 id="usersTitle">All Users</h2>
        </div>
        <table>
          <thead><tr><th>Username</th><th>Role</th><th style="width:100px;">Actions</th></tr></thead>
          <tbody id="usersTableBody">
            <tr><td colspan="3" class="loading">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/config.js?v=1"></script>
<script src="assets/js/api.js?v=1"></script>
<script src="assets/js/layout.js?v=1"></script>
<script>
  guardPage();

  const currentUser = api.currentUser() || {};
  if (currentUser.role !== 'Admin') {
    // Non-admin roles may still have this page granted via Roles.
    api.get('me.flags').then((d) => {
      if (!(d.permissions || []).includes('users')) {
        document.body.innerHTML = '<div style="padding:40px; font-family:sans-serif;">You do not have access to this page.</div>';
      }
    }).catch(() => {});
  }

  renderSidebar('users');

  const alertBox = document.getElementById('alertBox');
  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => (alertBox.innerHTML = ''), 4000);
  }

  async function loadUsers() {
    const tbody = document.getElementById('usersTableBody');
    try {
      const data = await api.get('users.list');
      document.getElementById('usersTitle').textContent = `All Users (${data.users.length})`;

      if (data.users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty-state">No users yet.</td></tr>';
        return;
      }

      tbody.innerHTML = data.users.map(u => `
        <tr>
          <td>${u.username}</td>
          <td><span class="badge">${u.role}</span></td>
          <td>
            <div class="row-actions">
              <button style="background:none; border:none; cursor:pointer; color:var(--accent); font-weight:600; font-size:13px; padding:0; margin-right:10px;" onclick="editUser(${u.user_id}, '${u.username.replace(/'/g, "\\'")}', '${u.role}', '${u.employee_id || ''}')">Edit</button>
              <button class="danger-link" onclick="deleteUser(${u.user_id}, '${u.username.replace(/'/g, "\\'")}')">Delete</button>
            </div>
          </td>
        </tr>`).join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="3"><div class="alert error">${err.message}</div></td></tr>`;
    }
  }

  window.deleteUser = async function (id, username) {
    if (!confirm(`Delete login "${username}"? This cannot be undone.`)) return;
    try {
      await api.post('users.delete', { user_id: id });
      showAlert('User deleted.');
      loadUsers();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  };

  document.getElementById('btnCreateUser').addEventListener('click', async () => {
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value;
    const role = document.getElementById('newRole').value;
    const msg = document.getElementById('createUserMsg');
    const btn = document.getElementById('btnCreateUser');

    msg.textContent = '';
    if (!username || !password) {
      msg.style.color = '#c0392b';
      msg.textContent = 'Username and password are required.';
      return;
    }

    btn.disabled = true;
    try {
      const employeeId = document.getElementById('newEmployee').value || null;
      await api.post('users.create', { username, password, role, employee_id: employeeId });
      msg.style.color = '#1a7a3c';
      msg.textContent = `"${username}" created as ${role}.`;
      document.getElementById('newUsername').value = '';
      document.getElementById('newPassword').value = '';
      loadUsers();
    } catch (err) {
      msg.style.color = '#c0392b';
      msg.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  loadUsers();

  (async function loadEmployeeOptions() {
    try {
      const data = await api.get('employees.list');
      const sel = document.getElementById('newEmployee');
      sel.innerHTML = '<option value="">— None —</option>' +
        (data.employees || []).map(e => `<option value="${e.employee_id}">${e.full_name} (${e.employee_code})</option>`).join('');
    } catch (e) { /* select stays with None */ }
  })();

  // ---- Edit user (username + role + linked employee)
  window.editUser = function (id, username, role, employeeId) {
    let m = document.getElementById('editUserModal');
    if (!m) {
      document.body.insertAdjacentHTML('beforeend', `
        <div class="modal-overlay" id="editUserModal">
          <div class="modal" style="max-width:380px;">
            <h3>Edit User</h3>
            <div class="field"><label for="euName">Username</label><input type="text" id="euName"></div>
            <div class="field"><label for="euRole">Role</label>
              <select id="euRole">
                <option value="Employee">Employee (attendance only)</option>
                <option value="HR">HR</option>
                <option value="Admin">Admin</option>
              </select>
            </div>
            <div class="field"><label for="euEmployee">Linked Employee <span style="text-transform:none; font-weight:400;">(required for Employee role)</span></label>
              <select id="euEmployee"><option value="">— None —</option></select>
            </div>
            <div class="actions">
              <button type="button" class="btn secondary" id="euCancel">Cancel</button>
              <button type="button" class="btn" id="euSave">Save</button>
            </div>
          </div>
        </div>`);
      m = document.getElementById('editUserModal');
      document.getElementById('euCancel').addEventListener('click', () => m.classList.remove('open'));
      document.getElementById('euSave').addEventListener('click', async () => {
        const btn = document.getElementById('euSave');
        btn.disabled = true;
        try {
          await api.post('users.update', {
            user_id: Number(m.dataset.userId),
            username: document.getElementById('euName').value.trim(),
            role: document.getElementById('euRole').value,
            employee_id: document.getElementById('euEmployee').value || null,
          });
          m.classList.remove('open');
          showAlert('User updated.');
          loadUsers();
        } catch (err) {
          showAlert(err.message, 'error');
        } finally {
          btn.disabled = false;
        }
      });
    }
    // Employee options: copy from the add-form select (already loaded)
    document.getElementById('euEmployee').innerHTML = document.getElementById('newEmployee').innerHTML;
    const euRole = document.getElementById('euRole');
    if (window._customRoleOpts && !euRole.dataset.customsAdded) {
      euRole.insertAdjacentHTML('beforeend', window._customRoleOpts);
      euRole.dataset.customsAdded = '1';
    }
    m.dataset.userId = id;
    document.getElementById('euName').value = username;
    document.getElementById('euRole').value = role;
    document.getElementById('euEmployee').value = employeeId || '';
    m.classList.add('open');
  };

  // Load custom roles into both role selects (system roles stay hardcoded).
  (async function loadRoleOptions() {
    try {
      const data = await api.get('roles.list');
      const customs = (data.roles || []).filter(r => !['Admin', 'HR', 'Employee'].includes(r.role_name));
      if (!customs.length) return;
      const opts = customs.map(r => `<option value="${r.role_name}">${r.role_name}</option>`).join('');
      document.getElementById('newRole').insertAdjacentHTML('beforeend', opts);
      window._customRoleOpts = opts; // used when the edit modal opens
    } catch (e) { /* roles table not created yet — system roles still work */ }
  })();
</script>
</body>
</html>
