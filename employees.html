<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employees — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=1">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar"><h1>Employees</h1></div>
    <div class="content">
      <div id="alertBox"></div>
      <div class="card">
        <div class="card-head">
          <h2 id="cardTitle">Employees</h2>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <select id="deptFilter" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
              <option value="">All Departments</option>
            </select>
            <select id="sortFilter" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
              <option value="">Sort by</option>
              <option value="joining_desc">Joining date: New to Old</option>
              <option value="joining_asc">Joining date: Old to New</option>
              <option value="name_asc">Name: A to Z</option>
              <option value="name_desc">Name: Z to A</option>
            </select>
            <div class="search-box"><input type="text" id="tableSearch" placeholder="Search name, code, email, mobile..."></div>
            <button class="btn secondary" id="btnExport" style="width:auto;">Export to Excel</button>
            <button class="btn" id="btnAddNew">+ Add Employee</button>
          </div>
        </div>
        <table>
          <thead>
            <tr><th style="width:48px;"></th><th>Code</th><th>Name</th><th>Department</th><th>Mobile</th><th>Joining Date</th><th>Pending Docs</th><th style="width:140px;">Actions</th></tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="8" class="loading">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" id="formModal">
  <div class="modal wide">
    <h3 id="modalTitle">Add Employee</h3>
    <div id="modalAlert"></div>
    <form id="empForm">
      <input type="hidden" id="recordId">

      <div class="field">
        <label>Photo</label>
        <div style="display:flex; align-items:center; gap:14px;">
          <div id="photoPreview" style="width:64px; height:64px; border-radius:50%; overflow:hidden; background:#f2f2f4; border:2px solid #eee; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#999; cursor:pointer;" title="Click to choose a photo">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          </div>
          <div>
            <button type="button" id="photoPickBtn" class="btn secondary" style="width:auto;">Choose photo</button>
            <button type="button" id="photoCameraBtn" class="btn secondary" style="width:auto;">Take photo</button>
            <input type="file" id="photoInput" accept=".jpg,.jpeg,.png,.webp" style="display:none;">
          </div>
        </div>

        <div id="cameraPanel" style="display:none; margin-top:12px; max-width:360px;">
          <video id="cameraVideo" autoplay playsinline style="width:100%; border-radius:8px; background:#000; transform:scaleX(-1);"></video>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <button type="button" id="cameraCaptureBtn" class="btn" style="width:auto;">Capture</button>
            <button type="button" id="cameraCancelBtn" class="btn secondary" style="width:auto;">Cancel</button>
          </div>
          <div id="cameraMsg" style="font-size:13px; font-weight:600; color:#c0392b; margin-top:8px; line-height:1.5;"></div>
        </div>
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="fullName">Full Name *</label>
          <input type="text" id="fullName" required maxlength="150">
        </div>
        <div class="field">
          <label for="department">Department</label>
          <select id="department"><option value="">— Select —</option></select>
        </div>
      </div>

      <div class="field-grid">
        <div class="field" style="position:relative;">
          <label for="managerSearchInput">Reporting Manager</label>
          <input type="text" id="managerSearchInput" placeholder="Search employee..." autocomplete="off">
          <input type="hidden" id="reportingManager">
          <div id="managerDropdown" style="display:none; position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line,#ddd); border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,0.12); max-height:220px; overflow-y:auto; z-index:50;"></div>
        </div>
        <div></div>
      </div>

      <div class="field">
        <label>WhatsApp Groups</label>
        <div id="waGroupsBox" style="display:flex; flex-wrap:wrap; gap:6px 18px; padding:6px 0;">
          <span style="color:#888; font-size:13px;">Loading groups...</span>
        </div>
      </div>

      <div class="field">
        <label>Excel Files</label>
        <div id="excelFilesBox" style="display:flex; flex-wrap:wrap; gap:6px 18px; padding:6px 0;">
          <span style="color:#888; font-size:13px;">Loading files...</span>
        </div>
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="mobile">Mobile</label>
          <input type="text" id="mobile" maxlength="20">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" maxlength="150">
        </div>
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="joiningDate">Joining Date *</label>
          <input type="date" id="joiningDate" required>
        </div>
        <div class="field">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob">
        </div>
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="employmentType">Employment Type</label>
          <input type="text" id="employmentType" placeholder="Full-time / Part-time / Contract" maxlength="50">
        </div>
        <div class="field">
          <label for="basicSalary">Basic Salary</label>
          <input type="number" id="basicSalary" step="0.01" min="0">
        </div>
      </div>

      <div class="field">
        <label for="address">Address</label>
        <textarea id="address" rows="2"></textarea>
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="emName">Emergency Contact Name</label>
          <input type="text" id="emName" maxlength="150">
        </div>
        <div class="field">
          <label for="emMobile">Emergency Contact Mobile</label>
          <input type="text" id="emMobile" maxlength="20">
        </div>
      </div>
      <div class="field">
        <label for="emRelation">Emergency Contact Relation</label>
        <input type="text" id="emRelation" maxlength="50">
      </div>

      <div class="actions">
        <button type="button" class="btn secondary" id="btnCancel">Cancel</button>
        <button type="submit" class="btn" id="btnSave">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="assets/js/config.js?v=1"></script>
<script src="assets/js/api.js?v=1"></script>
<script src="assets/js/layout.js?v=1"></script>
<script>
  guardPage();
  renderSidebar('employees');

  const tableBody = document.getElementById('tableBody');
  const alertBox = document.getElementById('alertBox');
  const overlay = document.getElementById('formModal');
  const modalAlert = document.getElementById('modalAlert');
  let departments = [];
  let searchTimer = null;

  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => (alertBox.innerHTML = ''), 4000);
  }

  async function loadWaGroups() {
    const box = document.getElementById('waGroupsBox');
    try {
      const data = await api.get('whatsapp_groups.list');
      const groups = data.groups || [];
      if (groups.length === 0) {
        box.innerHTML = '<span style="color:#888; font-size:13px;">No groups yet — add them on the <a href="whatsapp_groups.html">WhatsApp Groups</a> page.</span>';
        return;
      }
      box.innerHTML = groups.map(g => `
        <label style="display:inline-flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; font-weight:normal;">
          <input type="checkbox" class="wa-group-cb" value="${g.group_id}" style="width:auto; margin:0;"> ${g.group_name}
        </label>`).join('');
    } catch (err) {
      box.innerHTML = `<span style="color:#c0392b; font-size:13px;">${err.message}</span>`;
    }
  }

  async function loadExcelFiles() {
    const box = document.getElementById('excelFilesBox');
    try {
      const data = await api.get('excel_files.list');
      const files = data.files || [];
      if (files.length === 0) {
        box.innerHTML = '<span style="color:#888; font-size:13px;">No files yet — add them on the <a href="excel_files.html">Excel Files</a> page.</span>';
        return;
      }
      box.innerHTML = files.map(f => `
        <label style="display:inline-flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; font-weight:normal;">
          <input type="checkbox" class="excel-file-cb" value="${f.file_id}" style="width:auto; margin:0;"> ${f.file_name}
        </label>`).join('');
    } catch (err) {
      box.innerHTML = `<span style="color:#c0392b; font-size:13px;">${err.message}</span>`;
    }
  }

  async function loadDepartmentsIntoSelects() {
    const data = await api.get('departments.list');
    departments = data.departments;
    const options = departments.map(d => `<option value="${d.department_id}">${d.department_name}</option>`).join('');
    document.getElementById('department').innerHTML = '<option value="">— Select —</option>' + options;
    document.getElementById('deptFilter').innerHTML = '<option value="">All Departments</option>' + options;
  }

  let allEmployeesForManager = [];

  async function loadManagerOptions() {
    const data = await api.get('employees.list');
    allEmployeesForManager = data.employees;
  }

  const managerSearchInput = document.getElementById('managerSearchInput');
  const managerHidden = document.getElementById('reportingManager');
  const managerDropdown = document.getElementById('managerDropdown');
  let managerExcludeId = null;

  function renderManagerDropdown(filterText) {
    const q = (filterText || '').trim().toLowerCase();
    const matches = allEmployeesForManager.filter(e => {
      if (managerExcludeId && String(e.employee_id) === String(managerExcludeId)) return false;
      if (!q) return true;
      return e.full_name.toLowerCase().includes(q) || e.employee_code.toLowerCase().includes(q);
    });

    const noneRow = `<div class="manager-option" data-id="" data-name="" style="padding:9px 12px; cursor:pointer; color:#888;">— None —</div>`;
    const rows = matches.map(e => `
      <div class="manager-option" data-id="${e.employee_id}" data-name="${e.full_name.replace(/"/g, '&quot;')}" style="padding:9px 12px; cursor:pointer;">
        ${e.full_name} <span class="badge">${e.employee_code}</span>
      </div>
    `).join('');

    managerDropdown.innerHTML = noneRow + (rows || '<div style="padding:9px 12px; color:#888;">No matches.</div>');
    managerDropdown.querySelectorAll('.manager-option').forEach(row => {
      row.addEventListener('mousedown', (e) => {
        e.preventDefault(); // keep focus so click registers before blur closes the dropdown
        managerHidden.value = row.dataset.id;
        managerSearchInput.value = row.dataset.name;
        managerDropdown.style.display = 'none';
      });
      row.addEventListener('mouseenter', () => { row.style.background = '#f5f5f5'; });
      row.addEventListener('mouseleave', () => { row.style.background = ''; });
    });
  }

  managerSearchInput.addEventListener('focus', () => {
    renderManagerDropdown(managerSearchInput.value);
    managerDropdown.style.display = 'block';
  });
  managerSearchInput.addEventListener('input', () => {
    managerHidden.value = ''; // typing invalidates any prior selection until they pick again
    renderManagerDropdown(managerSearchInput.value);
    managerDropdown.style.display = 'block';
  });
  managerSearchInput.addEventListener('blur', () => {
    setTimeout(() => { managerDropdown.style.display = 'none'; }, 100);
  });

  function setManagerField(employeeId, excludeId) {
    managerExcludeId = excludeId || null;
    if (employeeId) {
      const match = allEmployeesForManager.find(e => String(e.employee_id) === String(employeeId));
      managerSearchInput.value = match ? match.full_name : '';
      managerHidden.value = employeeId;
    } else {
      managerSearchInput.value = '';
      managerHidden.value = '';
    }
  }

  const PHOTO_ICON_SVG = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
  const photoInput = document.getElementById('photoInput');
  const photoPreview = document.getElementById('photoPreview');
  const photoPickBtn = document.getElementById('photoPickBtn');
  const photoCameraBtn = document.getElementById('photoCameraBtn');
  const cameraPanel = document.getElementById('cameraPanel');
  const cameraVideo = document.getElementById('cameraVideo');
  const cameraMsg = document.getElementById('cameraMsg');

  let selectedPhotoFile = null; // set from either the file picker or a camera capture
  let cameraStream = null;

  photoPreview.addEventListener('click', () => photoInput.click());
  photoPickBtn.addEventListener('click', () => photoInput.click());

  photoInput.addEventListener('change', () => {
    const file = photoInput.files[0];
    if (file) {
      selectedPhotoFile = file;
      photoPreview.innerHTML = `<img src="${URL.createObjectURL(file)}" style="width:100%;height:100%;object-fit:cover;">`;
    }
  });

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    cameraPanel.style.display = 'none';
  }

  photoCameraBtn.addEventListener('click', async () => {
    cameraMsg.textContent = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      cameraPanel.style.display = 'block';
      cameraMsg.textContent = 'Camera access is not available in this browser.';
      return;
    }
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
      cameraVideo.srcObject = cameraStream;
      cameraPanel.style.display = 'block';
    } catch (err) {
      cameraPanel.style.display = 'block';
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        cameraMsg.innerHTML = 'Camera access is blocked for this site. Click the icon in your browser\'s address bar, set Camera to "Allow", then reload the page and try again.';
      } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
        cameraMsg.textContent = 'No camera was found on this device.';
      } else {
        cameraMsg.textContent = 'Could not access the camera (' + err.name + ').';
      }
    }
  });

  document.getElementById('cameraCancelBtn').addEventListener('click', stopCamera);

  document.getElementById('cameraCaptureBtn').addEventListener('click', () => {
    const canvas = document.createElement('canvas');
    canvas.width = cameraVideo.videoWidth;
    canvas.height = cameraVideo.videoHeight;
    const ctx = canvas.getContext('2d');
    // Mirror the capture to match the mirrored preview (feels natural, like a selfie camera).
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(cameraVideo, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(blob => {
      selectedPhotoFile = new File([blob], `photo_${Date.now()}.jpg`, { type: 'image/jpeg' });
      photoPreview.innerHTML = `<img src="${URL.createObjectURL(blob)}" style="width:100%;height:100%;object-fit:cover;">`;
      stopCamera();
    }, 'image/jpeg', 0.9);
  });

  function openModal(emp = null) {
    document.getElementById('empForm').reset();
    modalAlert.innerHTML = '';
    document.getElementById('recordId').value = '';
    photoInput.value = '';
    selectedPhotoFile = null;
    stopCamera();
    photoPreview.innerHTML = (emp && emp.photo)
      ? `<img src="${API_BASE_URL.replace('/api.php', '')}/${emp.photo}" style="width:100%;height:100%;object-fit:cover;">`
      : PHOTO_ICON_SVG;
    setManagerField(emp ? emp.reporting_manager_id : null, emp ? emp.employee_id : null);

    const empGroupIds = new Set(((emp && emp.whatsapp_groups) || []).map(g => String(g.group_id)));
    document.querySelectorAll('.wa-group-cb').forEach(cb => { cb.checked = empGroupIds.has(cb.value); });

    const empFileIds = new Set(((emp && emp.excel_files) || []).map(f => String(f.file_id)));
    document.querySelectorAll('.excel-file-cb').forEach(cb => { cb.checked = empFileIds.has(cb.value); });

    if (emp) {
      document.getElementById('modalTitle').textContent = `Edit Employee (${emp.employee_code})`;
      document.getElementById('recordId').value = emp.employee_id;
      document.getElementById('fullName').value = emp.full_name || '';
      document.getElementById('department').value = emp.department_id || '';
      document.getElementById('mobile').value = emp.mobile || '';
      document.getElementById('email').value = emp.email || '';
      document.getElementById('joiningDate').value = emp.joining_date || '';
      document.getElementById('dob').value = emp.date_of_birth || '';
      document.getElementById('employmentType').value = emp.employment_type || '';
      document.getElementById('basicSalary').value = emp.basic_salary || '';
      document.getElementById('address').value = emp.address || '';
      document.getElementById('emName').value = emp.emergency_contact_name || '';
      document.getElementById('emMobile').value = emp.emergency_contact_mobile || '';
      document.getElementById('emRelation').value = emp.emergency_contact_relation || '';
    } else {
      document.getElementById('modalTitle').textContent = 'Add Employee';
    }
    overlay.classList.add('open');
  }
  function closeModal() { overlay.classList.remove('open'); stopCamera(); }

  document.getElementById('btnAddNew').addEventListener('click', () => openModal());
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  function sortRows(rows) {
    const sortBy = document.getElementById('sortFilter').value;
    const sorted = rows.slice();

    if (sortBy === 'joining_desc') {
      sorted.sort((a, b) => new Date(b.joining_date || 0) - new Date(a.joining_date || 0));
    } else if (sortBy === 'joining_asc') {
      sorted.sort((a, b) => new Date(a.joining_date || 0) - new Date(b.joining_date || 0));
    } else if (sortBy === 'name_asc') {
      sorted.sort((a, b) => (a.full_name || '').localeCompare(b.full_name || ''));
    } else if (sortBy === 'name_desc') {
      sorted.sort((a, b) => (b.full_name || '').localeCompare(a.full_name || ''));
    }

    return sorted;
  }

  function renderTable(rows) {
    rows = sortRows(rows);
    document.getElementById('cardTitle').textContent = `Employees (${rows.length})`;
    if (rows.length === 0) {
      tableBody.innerHTML = '<tr><td colspan="8" class="empty-state">No employees found.</td></tr>';
      return;
    }
    tableBody.innerHTML = rows.map(r => {
      const photoHtml = r.photo
        ? `<img src="${API_BASE_URL.replace('/api.php','')}/${r.photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">`
        : `<div style="width:36px;height:36px;border-radius:50%;background:#f2f2f4;border:1px solid #eee;display:flex;align-items:center;justify-content:center;color:#999;">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
           </div>`;
      const pending = Number(r.pending_count || 0);
      const pendingHtml = pending > 0
        ? `<span class="badge inactive">${pending} missing</span>`
        : `<span class="badge">All complete</span>`;
      const nameSuffix = r.status === 'pending'
        ? ' <span class="badge inactive" title="Added by HR, waiting for Admin approval">Pending Approval</span>'
        : '';

      return `
      <tr>
        <td><a href="employee_detail.html?id=${r.employee_id}">${photoHtml}</a></td>
        <td><a href="employee_detail.html?id=${r.employee_id}"><span class="badge">${r.employee_code}</span></a></td>
        <td><a href="employee_detail.html?id=${r.employee_id}" style="color:inherit; text-decoration:none;">${r.full_name}</a>${nameSuffix}</td>
        <td>${r.department_name || '—'}</td>
        <td>${r.mobile || '—'}</td>
        <td>${r.joining_date ? new Date(r.joining_date).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}) : '—'}</td>
        <td>${pendingHtml}</td>
        <td>
          <div class="row-actions">
            <button onclick='editEmployee(${r.employee_id})'>Edit</button>
            <button class="danger-link" onclick="deleteEmployee(${r.employee_id}, '${(r.full_name||'').replace(/'/g,"\\'")}')">Delete</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  let currentRows = [];

  async function loadEmployees() {
    const search = document.getElementById('tableSearch').value.trim();
    const deptId = document.getElementById('deptFilter').value;
    const params = {};
    if (search) params.search = search;
    if (deptId) params.department_id = deptId;

    try {
      const data = await api.get('employees.list', params);
      currentRows = data.employees;
      renderTable(currentRows);
    } catch (err) {
      tableBody.innerHTML = `<tr><td colspan="8"><div class="alert error">${err.message}</div></td></tr>`;
    }
  }

  window.editEmployee = async function (id) {
    try {
      const data = await api.get('employees.get', { id });
      openModal(data.employee);
    } catch (err) {
      showAlert(err.message, 'error');
    }
  };

  window.deleteEmployee = async function (id, name) {
    if (!confirm(`Move "${name}" to Ex-Employees?\n\nTheir profile and documents stay saved — you can Rejoin or permanently delete them from the Ex-Employees page.`)) return;
    try {
      await api.post('employees.delete', { employee_id: id });
      showAlert('Employee moved to Ex-Employees.');
      loadEmployees();
    } catch (err) {
      showAlert(err.message, 'error');
    }
  };

  document.getElementById('empForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('recordId').value;
    const btn = document.getElementById('btnSave');
    btn.disabled = true;

    const fields = {
      full_name: document.getElementById('fullName').value.trim(),
      department_id: document.getElementById('department').value || '',
      reporting_manager_id: document.getElementById('reportingManager').value || '',
      mobile: document.getElementById('mobile').value.trim(),
      email: document.getElementById('email').value.trim(),
      joining_date: document.getElementById('joiningDate').value,
      date_of_birth: document.getElementById('dob').value || '',
      employment_type: document.getElementById('employmentType').value.trim(),
      basic_salary: document.getElementById('basicSalary').value || 0,
      address: document.getElementById('address').value.trim(),
      emergency_contact_name: document.getElementById('emName').value.trim(),
      emergency_contact_mobile: document.getElementById('emMobile').value.trim(),
      emergency_contact_relation: document.getElementById('emRelation').value.trim(),
      whatsapp_group_ids: JSON.stringify(
        Array.from(document.querySelectorAll('.wa-group-cb:checked')).map(cb => Number(cb.value))
      ),
      excel_file_ids: JSON.stringify(
        Array.from(document.querySelectorAll('.excel-file-cb:checked')).map(cb => Number(cb.value))
      ),
    };
    if (id) fields.employee_id = id;

    const newPhoto = selectedPhotoFile;

    try {
      let res;
      if (newPhoto) {
        // A photo was chosen — send multipart so the file goes along with the fields.
        const formData = new FormData();
        Object.entries(fields).forEach(([key, val]) => formData.append(key, val));
        formData.append('photo', newPhoto);

        const headers = {};
        const token = api.token();
        if (token) headers['Authorization'] = 'Bearer ' + token;

        const response = await fetch(`${API_BASE_URL}?action=employees.save`, {
          method: 'POST',
          headers,
          body: formData,
        });
        res = await response.json();
        if (!response.ok) throw new Error(res.error || 'Save failed.');
      } else {
        // No new photo — plain JSON, keeps whatever photo (if any) is already saved.
        const payload = { ...fields };
        if (payload.department_id === '') payload.department_id = null;
        if (payload.reporting_manager_id === '') payload.reporting_manager_id = null;
        if (payload.date_of_birth === '') payload.date_of_birth = null;
        res = await api.post('employees.save', payload);
      }

      closeModal();
      showAlert(id ? 'Employee updated.' : `Employee added (code: ${res.employee_code}).`);
      loadEmployees();
    } catch (err) {
      modalAlert.innerHTML = `<div class="alert error">${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('tableSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(loadEmployees, 350);
  });
  document.getElementById('deptFilter').addEventListener('change', loadEmployees);
  document.getElementById('sortFilter').addEventListener('change', () => renderTable(currentRows));

  /*
   * Export the currently filtered + sorted rows (whatever's on screen right
   * now — search term, department filter, and sort order all apply) to an
   * .xlsx file. For a full unfiltered export, use the Dashboard's export button.
   */
  document.getElementById('btnExport').addEventListener('click', () => {
    const btn = document.getElementById('btnExport');
    const rows = sortRows(currentRows);

    if (rows.length === 0) {
      showAlert('No rows to export — adjust your filters first.', 'error');
      return;
    }

    const exportRows = rows.map(r => ({
      'Code': r.employee_code,
      'Full Name': r.full_name,
      'Department': r.department_name || '',
      'Mobile': r.mobile || '',
      'Email': r.email || '',
      'Joining Date': r.joining_date || '',
    }));

    const worksheet = XLSX.utils.json_to_sheet(exportRows);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, 'Employees');

    const today = new Date().toISOString().slice(0, 10);
    XLSX.writeFile(workbook, `employees_filtered_${today}.xlsx`);
  });

  (async function init() {
    await loadDepartmentsIntoSelects();
    await loadManagerOptions();
    await loadWaGroups();
    await loadExcelFiles();

    const urlParams = new URLSearchParams(window.location.search);
    const deptFromUrl = urlParams.get('department_id');
    if (deptFromUrl) {
      document.getElementById('deptFilter').value = deptFromUrl;
      history.replaceState(null, '', 'employees.html');
    }

    await loadEmployees();

    const editId = urlParams.get('edit');
    if (editId) {
      window.editEmployee(editId);
    }

    if (urlParams.get('resubmit')) {
      const raw = sessionStorage.getItem('resubmitEmployee');
      sessionStorage.removeItem('resubmitEmployee');
      history.replaceState(null, '', 'employees.html');
      if (raw) {
        try {
          const payload = JSON.parse(raw);
          openModal(); // fresh "Add Employee" mode
          document.getElementById('fullName').value = payload.full_name || '';
          document.getElementById('mobile').value = payload.mobile || '';
          document.getElementById('email').value = payload.email || '';
          document.getElementById('address').value = payload.address || '';
          document.getElementById('dob').value = payload.date_of_birth || '';
          document.getElementById('joiningDate').value = payload.joining_date || '';
          document.getElementById('department').value = payload.department_id || '';
          document.getElementById('basicSalary').value = payload.basic_salary || '';
          document.getElementById('employmentType').value = payload.employment_type || '';
          document.getElementById('emName').value = payload.emergency_contact_name || '';
          document.getElementById('emMobile').value = payload.emergency_contact_mobile || '';
          document.getElementById('emRelation').value = payload.emergency_contact_relation || '';
          setManagerField(payload.reporting_manager_id || null, null);
          showAlert('Form pre-filled from the declined submission — review and Save to resubmit.');
        } catch (e) {
          showAlert('Could not load the declined submission data.', 'error');
        }
      }
    }
  })();
</script>
</body>
</html>
