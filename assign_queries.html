<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Assign Queries — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=1">
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar">
      <h1>Assign Queries</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <input type="text" id="empSearch" placeholder="Search employee..." style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; width:170px;">
        <select id="groupPick" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
          <option value="">All groups</option>
          <option value="tmph">TM Perfume House</option>
          <option value="tmf">TM Fragrance</option>
          <option value="tm4u">TM4U</option>
        </select>
        <input type="date" id="dayPick" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
      </div>
    </div>
    <div class="content">
      <div id="alertBox"></div>

      <div class="card" style="max-width:760px;">
        <div class="card-head">
          <h2 id="cardTitle">Today</h2>
          <span style="font-size:12.5px; color:var(--muted);">
            Scout <b id="sumScout" style="color:#0C447C;">0</b> ·
            Champion <b id="sumChamp" style="color:#854F0B;">0</b> ·
            Total <b id="totalCount" style="color:var(--ink);">0</b>
          </span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Employee</th>
              <th style="text-align:center; color:#0C447C; background:#F0F7FD;">Scout</th>
              <th style="text-align:center; color:#854F0B; background:#FDF7EC;">Champion</th>
              <th style="text-align:center;">Total</th>
            </tr>
          </thead>
          <tbody id="empList">
            <tr><td colspan="4" class="loading">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/config.js?v=1"></script>
<script src="assets/js/api.js?v=1"></script>
<script src="assets/js/layout.js?v=1"></script>
<script>
  guardPage();
  renderSidebar('assign_queries');

  const alertBox = document.getElementById('alertBox');
  let rows = [];

  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => (alertBox.innerHTML = ''), 4000);
  }

  function day() { return document.getElementById('dayPick').value; }
  function groupFilter() { return document.getElementById('groupPick').value || ''; }

  function matchesSearch(r) {
    const q = (document.getElementById('empSearch').value || '').trim().toLowerCase();
    if (!q) return true;
    return (r.full_name || '').toLowerCase().includes(q)
      || (r.employee_code || '').toLowerCase().includes(q);
  }

  function updateSums() {
    // Sums always reflect every employee for the day, regardless of search —
    // only the visible rows are filtered.
    document.getElementById('sumScout').textContent = rows.reduce((t, r) => t + r.scout_count, 0);
    document.getElementById('sumChamp').textContent = rows.reduce((t, r) => t + r.champion_count, 0);
    document.getElementById('totalCount').textContent = rows.reduce((t, r) => t + r.query_count, 0);
  }

  function render() {
    const list = document.getElementById('empList');
    if (!rows.length) {
      list.innerHTML = '<tr><td colspan="4" class="empty-state">No sales employees.</td></tr>';
      return;
    }
    updateSums();
    const shown = rows.filter(matchesSearch);
    if (!shown.length) {
      list.innerHTML = '<tr><td colspan="4" class="empty-state">No matching employees.</td></tr>';
      return;
    }
    const counter = (r, kind, color, bg) => `
      <td style="text-align:center; background:${bg};">
        <span style="display:inline-flex; align-items:center; gap:6px;">
          <button onclick="bump(${r.employee_id}, '${kind}', -1, this)" title="Undo one"
            style="width:30px; height:32px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--muted); font-size:15px; cursor:pointer;">−</button>
          <span id="cnt-${kind}-${r.employee_id}" style="font-size:18px; font-weight:700; min-width:30px; text-align:center;">${r[kind + '_count']}</span>
          <button onclick="bump(${r.employee_id}, '${kind}', 1, this)"
            style="width:46px; height:34px; border-radius:6px; border:none; background:${color}; color:#fff; font-size:14px; font-weight:700; cursor:pointer;">+1</button>
        </span>
      </td>`;
    list.innerHTML = shown.map(r => `
      <tr>
        <td>${r.full_name}<div style="font-size:11px; color:var(--muted);">${r.employee_code}</div></td>
        ${counter(r, 'scout', '#0EA5E9', '#F7FBFE')}
        ${counter(r, 'champion', '#F59E0B', '#FEFBF5')}
        <td style="text-align:center; font-size:16px; font-weight:700;" id="cnt-total-${r.employee_id}">${r.query_count}</td>
      </tr>`).join('');
  }

  window.bump = async function (empId, kind, delta, btn) {
    btn.disabled = true;
    try {
      const d = await api.post('queries.assign_bump', { employee_id: empId, kind, delta, date: day() });
      const row = rows.find(r => r.employee_id === empId);
      if (row) { row.query_count = d.query_count; row.scout_count = d.scout_count; row.champion_count = d.champion_count; }
      const scoped = document.getElementById('cnt-' + kind + '-' + empId);
      if (scoped) scoped.textContent = d[kind + '_count'];
      const total = document.getElementById('cnt-total-' + empId);
      if (total) total.textContent = d.query_count;
      updateSums();
    } catch (err) {
      showAlert(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  };

  async function load() {
    document.getElementById('cardTitle').textContent =
      new Date(day() + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'short' });
    try {
      const data = await api.get('queries.assign_list', { date: day(), store_group: groupFilter() });
      rows = data.employees || [];
      render();
    } catch (err) {
      document.getElementById('empList').innerHTML = `<tr><td colspan="4"><div class="alert error">${err.message}</div></td></tr>`;
    }
  }

  const now = new Date();
  document.getElementById('dayPick').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  document.getElementById('dayPick').addEventListener('change', load);
  document.getElementById('groupPick').addEventListener('change', load);
  let searchTimer = null;
  document.getElementById('empSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 150);
  });
  load();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
