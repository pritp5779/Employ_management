<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Assign Queries — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  /* Employee label colour: two fixed colours (blue / yellow) or none,
     picked with one click in the name cell; the cell takes a soft tint. */
  .emp-cell{position:relative; padding-right:66px !important;}
  .color-pick{position:absolute; right:10px; top:14px; display:flex; gap:5px;}
  .color-pick .sw{width:16px; height:16px; border-radius:50%; cursor:pointer; border:2px solid transparent; box-shadow:0 0 0 1px var(--line);}
  .color-pick .sw.blue{background:#2563eb;} .color-pick .sw.yellow{background:#facc15;}
  .color-pick .sw.none{background:#fff; position:relative;}
  .color-pick .sw.none::after{content:""; position:absolute; left:2px; right:2px; top:5px; height:2px; background:#9ca3af; transform:rotate(-45deg);}
  .color-pick .sw.on{border-color:var(--ink); transform:scale(1.15);}
  .color-pick .sw:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  @media (max-width:820px){ .color-pick .sw{width:20px; height:20px;} .emp-cell{padding-right:82px !important;} }
</style>
<style>
  .th-sub{display:block; font-size:9.5px; font-weight:400; letter-spacing:0; text-transform:none; color:var(--muted); margin-top:2px;}
  .type-cell{vertical-align:middle; padding:8px 12px !important;}
  .type-grid{display:grid; grid-template-columns:auto auto; gap:3px 12px; align-items:center;}
  .type-grid .lbl{font-size:10px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted);}
  .ctl{display:inline-flex; align-items:center; gap:5px;}
  .ctl .minus{width:28px; height:30px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--muted); font-size:15px; cursor:pointer; min-height:0; padding:0;}
  .ctl .plus{width:38px; height:30px; border-radius:6px; border:none; color:#fff; font-size:12.5px; font-weight:700; cursor:pointer; min-height:0; padding:0;}
  .ctl .cnt-in{width:50px; height:30px; font-size:16px; font-weight:700; text-align:center; border:1px solid transparent; border-radius:6px; background:transparent; padding:0;}
  .ctl .cnt-in:focus{border-color:var(--accent); background:#fff; outline:none;}
  .ord b{font-size:14px;} .ord small{font-size:10.5px; color:var(--muted); margin-left:4px;}
  .rt{font-weight:700; font-size:13px;} .rt.g{color:#0f7a41;} .rt.a{color:#b45f06;} .rt.r{color:#c81e1e;} .rt.z{color:var(--muted); font-weight:400;}
  .tot-cell{vertical-align:middle; white-space:nowrap;} .tot-cell b{font-size:16px;} .tot-cell .lbl{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .tot-sub{font-size:11px; color:var(--muted); margin-top:2px;}
  @media (max-width:820px){ .type-grid{grid-template-columns:1fr 1fr;} .ctl .cnt-in{font-size:16px;} }
  /* Hour view: chips for each hour of the day + a banner saying which hour is shown */
  .hr-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .hr-chip{padding:6px 12px; border:1px solid var(--line); border-radius:20px; font-size:12.5px; background:#fff; cursor:pointer; user-select:none; white-space:nowrap;}
  .hr-chip.on{background:#111827; color:#fff; border-color:#111827;}
  .hr-chip.empty{color:var(--muted);}
  .hr-chip b{margin-left:6px;}
  .hr-chip.day{margin-left:auto; border-style:dashed;}
  .hr-banner{margin:0 0 12px; padding:9px 14px; border-radius:8px; font-size:12.5px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .hr-banner.cur{background:#EEF2FF; color:#3730a3;} .hr-banner.past{background:#FFF8E6; color:#8a5a00;} .hr-banner.dayv{background:#F3F4F6; color:#374151;}
  .hr-banner .btn{width:auto; margin-left:auto; padding:5px 12px; min-height:0; font-size:12px;}
  .hour-table tbody tr{cursor:pointer;} .hour-table tbody tr:hover td{background:#F5F7FF;}
  .hour-table tr.sel td{background:#EEF2FF; box-shadow:inset 3px 0 0 #3730a3;}
  @media (max-width:820px){
    .hr-chips{flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; scrollbar-width:none;}
    .hr-chips::-webkit-scrollbar{display:none;}
    .hr-chip{flex:0 0 auto; padding:6px 10px; font-size:12px;}
    .hr-chip.day{margin-left:0;}
  }
  .aq-wrap{display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap;}
  .aq-wrap > .card{min-width:0;}
  /* The employee table scrolls sideways inside its card when the window is
     narrower than its columns — it never runs past the card's edge. */
  .tscroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  #empTable{min-width:640px;}
  #empTable th, #empTable td{padding-left:10px; padding-right:10px;}
  #empTable th:first-child, #empTable td:first-child{padding-left:20px;}
  /* Hour view: compact counter for that hour, orders + ratio underneath */
  .hr-ctl{display:flex; flex-direction:column; align-items:flex-start; gap:4px;}
  .mini{font-size:11px; color:var(--muted); white-space:nowrap;}
  .mini b{color:var(--ink); font-size:12px;}
  .mini .rt{font-size:11.5px;}
  .tot-cell.hr{white-space:normal;} .tot-cell.hr .tot-sub{white-space:nowrap;}
  @media (max-width:820px){ .tscroll{overflow:visible;} #empTable{min-width:0;} #empTable th, #empTable td{padding-left:0; padding-right:0;} }
  /* The card takes the space left beside the employee table, so the four
     columns always have room — it never stays at a fixed narrow width. On a
     window too small for both side by side it moves to its own line, so the
     employee table keeps its Total column too. */
  .hour-card{flex:1 1 360px; max-width:560px; margin-bottom:20px;}
  @media (max-width:1400px){ .hour-card{flex-basis:100%;} }
  /* 24 rows is a long list — it scrolls inside the card, with the header and
     the Total row pinned so they stay readable while scrolling. If a device
     makes the text wider than the card, this box scrolls sideways too, so
     the Total column can never be cut off. */
  .hour-scroll{max-height:60vh; overflow:auto; -webkit-overflow-scrolling:touch;}
  .hour-table{width:100%; min-width:0;}
  .hour-table thead th{position:sticky; top:0; z-index:2; background:#FAFBFC;}
  .hour-table tfoot td{position:sticky; bottom:0; z-index:2;}
  .hour-table th{text-align:center; padding:8px 6px;}
  .hour-table th:first-child, .hour-table td:first-child{text-align:left; padding-left:12px; white-space:normal;}
  /* The time itself never breaks; the "● now" badge drops to a second line
     instead of making the row wider than the card. */
  .hour-table .hr-t{white-space:nowrap;}
  .hour-table .hr-now{font-size:10px; color:#3730a3; white-space:nowrap;}
  .hour-table td{text-align:center; padding:7px 6px; font-size:13px;}
  .hour-table td.q{color:#0C447C; font-weight:700;} .hour-table td.c{color:#854F0B; font-weight:700;} .hour-table td.t{font-weight:700;}
  .hour-table tr.cur td{background:#EEF2FF;}
  .hour-table tfoot td{border-top:2px solid var(--line); background:#FAFBFC; font-weight:700;}
  @media (max-width:820px){
    .hour-card{flex:1 1 100%; max-width:none;}
    .hour-table{min-width:0 !important; display:table !important;}
    .hour-table th, .hour-table td{padding:7px 4px; font-size:12.5px;}
    .hour-table th:first-child, .hour-table td:first-child{padding-left:10px;}
    .hour-scroll{max-height:56vh;}
  }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar">
      <h1>Assign Queries</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <input type="text" id="empSearch" placeholder="Search employee..." style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; width:170px;">
        <select id="groupPick" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
          <option value="tmph">TM Perfume House</option>
          <option value="tmf">TM Fragrance</option>
          <option value="tm4u">TM4U</option>
        </select>
        <input type="date" id="dayPick" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
      </div>
    </div>
    <div class="content">
      <div id="alertBox"></div>
      <div class="hr-chips" id="hourChips"></div>
      <div class="hr-banner cur" id="hourBanner" style="display:none;"></div>

      <div class="aq-wrap">
      <div class="card" style="max-width:900px; flex:1 1 520px; min-width:0;">
        <div class="card-head">
          <h2 id="cardTitle">Today</h2>
          <span style="font-size:12.5px; color:var(--muted);">
            Query <b id="sumScout" style="color:#0C447C;">0</b> ·
            Campaign <b id="sumChamp" style="color:#854F0B;">0</b> ·
            Total <b id="totalCount" style="color:var(--ink);">0</b>
          </span>
        </div>
        <div class="tscroll">
        <table id="empTable">
          <thead>
            <tr>
              <th>Employee</th>
              <th style="width:150px;">House</th>
              <th style="color:#0C447C; background:#F0F7FD;">Query <span class="th-sub" id="thQ">count · orders tagged query · ratio</span></th>
              <th style="color:#854F0B; background:#FDF7EC;">Campaign <span class="th-sub" id="thC">count · orders tagged campaign · ratio</span></th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="empList">
            <tr><td colspan="5" class="loading">Loading...</td></tr>
          </tbody>
        </table>
        </div>
      </div>

      <!-- By hour: the team's counts grouped by the hour each +1 / − was clicked -->
      <div class="card hour-card" id="hourCard">
        <div class="card-head"><h2>By hour</h2><span id="hourSub" style="font-size:12px; color:var(--muted);">click a time</span></div>
        <div class="hour-scroll">
          <table class="no-stack hour-table">
            <thead><tr><th>Time</th><th>Query</th><th>Campaign</th><th>Total</th></tr></thead>
            <tbody id="hourBody"><tr><td colspan="4" class="loading" style="padding:16px;">Loading...</td></tr></tbody>
            <tfoot id="hourFoot"></tfoot>
          </table>
        </div>
      </div>
      </div>
    </div>
  </main>
</div>

</div>
<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/layout.js?v=3"></script>
<script>
  guardPage();

  // ---------- Employee label colour (blue / yellow / none) ----------
  const BLUE = '#2563eb', YELLOW = '#facc15';
  const tint = (c) => c ? `background:${c}2b;` : '';
  async function saveColor(empId, groupKey, color, pick) {
    try {
      await api.post('employees.set_color', { employee_id: empId, group_key: groupKey, color });
      pick.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', (b.dataset.color || '') === color));
      pick.closest('td').style.background = color ? color + '2b' : '';
      const row = employees.find(e => Number(e.employee_id) === empId);
      const grp = row && row.groups.find(x => x.group_key === groupKey); if (grp) grp.color = color;
      render();       // moves the row into its colour group
    } catch (err) { showAlert(err.message, 'error'); }
  }
  document.addEventListener('click', (e) => {
    const sw = e.target.closest('.color-pick .sw'); if (!sw) return;
    const pick = sw.closest('.color-pick');
    saveColor(Number(pick.dataset.emp), pick.dataset.group || '', sw.dataset.color || '', pick);
  });
  document.addEventListener('keydown', (e) => {
    const sw = e.target.closest && e.target.closest('.color-pick .sw');
    if (sw && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); sw.click(); }
  });
  renderSidebar('assign_queries');

  const alertBox = document.getElementById('alertBox');
  let employees = []; // each: { employee_id, full_name, employee_code, groups: [{group_key, group_label, query_count, scout_count, champion_count}] }

  // House label -> accent color, so the same house reads consistently
  // everywhere (Assign Queries, Targets, Performance).
  const HOUSE_COLOR = { tmph: '#2563EB', tmf: '#D97706', tm4u: '#7C3AED', '': '#6B7280' };

  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => (alertBox.innerHTML = ''), 4000);
  }

  function day() { return document.getElementById('dayPick').value; }
  // One house at a time (there is no "All houses"): the page shows the chosen
  // house's employees, one row each, and colours are per employee per house.
  function groupFilter() { return document.getElementById('groupPick').value || 'tmph'; }

  // ---------- Which hour the table shows ----------
  // null = whole day (the old view); a number = that clock hour only. Today
  // opens on the running hour, and every row starts that hour at 0.
  let viewHour = null;
  let nowHour = new Date().getHours();
  let bizToday = bizTodayStr();
  const isBizToday = () => day() === bizToday;
  const hourMode = () => viewHour !== null;
  const isCurHour = () => hourMode() && isBizToday() && viewHour === nowHour;
  const hourRange = (h) => `${fmtHour(h)} – ${fmtHour((h + 1) % 24)}`;
  // Which type-count a row shows: the hour's count in hour mode, else the day's.
  const shownCount = (g, kind) => hourMode() ? (g['hour_' + kind] || 0) : (g[kind + '_count'] || 0);
  function defaultHour() { return isBizToday() ? nowHour : null; }
  window.setHour = function (h) {
    viewHour = (h === null || h === undefined || h === '') ? null : Number(h);
    load();
  };

  function matchesSearch(e) {
    const q = (document.getElementById('empSearch').value || '').trim().toLowerCase();
    if (!q) return true;
    return (e.full_name || '').toLowerCase().includes(q)
      || (e.employee_code || '').toLowerCase().includes(q);
  }

  function updateSums() {
    // Sums reflect every employee/house shown for the day, regardless of
    // the search box — only which ROWS are visible is filtered by search.
    let scout = 0, champ = 0, total = 0;
    employees.forEach(e => e.groups.forEach(g => { scout += shownCount(g, 'scout'); champ += shownCount(g, 'champion'); total += shownCount(g, 'scout') + shownCount(g, 'champion'); }));
    document.getElementById('sumScout').textContent = scout;
    document.getElementById('sumChamp').textContent = champ;
    document.getElementById('totalCount').textContent = total;
  }

  // One block per type: the count (typed or − / +1), the orders today that
  // carry this type's tag, and orders ÷ count.
  const TYPE = {
    scout:    { label: 'query',    color: '#0EA5E9', bg: '#F7FBFE', ink: '#0C447C' },
    champion: { label: 'campaign', color: '#F59E0B', bg: '#FEFBF5', ink: '#854F0B' },
  };
  const ratioHtml = (o, n) => {
    if (n === undefined || o === undefined) return '<span class="rt z">—</span>';
    if (!n) return '<span class="rt z">—</span>';
    const p = Math.round(o / n * 100);
    return `<span class="rt ${p >= 25 ? 'g' : (p >= 10 ? 'a' : 'r')}">${p}%</span>`;
  };
  // Hour view: "26 orders · 26%" under the counter (orders today ÷ today's count)
  const miniOrders = (o, dayCount) => o === undefined
    ? (ordersLoading ? '…' : '—')
    : `<b>${o}</b> orders · ${ratioHtml(o, dayCount)}`;
  function typeBlock(e, g, kind) {
    const t = TYPE[kind], empId = e.employee_id, groupKey = g.group_key;
    const n = shownCount(g, kind);
    const oc = ordersFor(e.full_name); const o = oc ? oc[kind] : undefined;
    if (hourMode()) {
      // One hour: the counter for that hour, with today's orders for this
      // employee and the ratio on one small line underneath. Orders come
      // from Shopify for the whole day — they are not split per hour.
      return `<td class="type-cell" style="background:${t.bg};">
      <div class="hr-ctl">
        <span class="ctl">
          <button type="button" onclick="bump(${empId}, '${groupKey}', '${kind}', -1, this)" title="Take one away from this hour" class="minus">−</button>
          <input type="number" inputmode="numeric" min="0" max="9999" id="cnt-${kind}-${empId}-${groupKey}" value="${n}"
            data-emp="${empId}" data-group="${groupKey}" data-kind="${kind}" class="cnt-in" title="Type a number, or use − / +1">
          <button type="button" onclick="bump(${empId}, '${groupKey}', '${kind}', 1, this)" class="plus" style="background:${t.color};">+1</button>
        </span>
        <span class="mini" id="ord-${kind}-${empId}-${groupKey}" title="Orders tagged ${t.label} today · orders ÷ today's count">${miniOrders(o, g[kind + '_count'] || 0)}</span>
      </div>
    </td>`;
    }
    return `<td class="type-cell" style="background:${t.bg};">
      <div class="type-grid">
        <span class="lbl">Count</span>
        <span class="ctl">
          <button type="button" onclick="bump(${empId}, '${groupKey}', '${kind}', -1, this)" title="Take one away" class="minus">−</button>
          <input type="number" inputmode="numeric" min="0" max="9999" id="cnt-${kind}-${empId}-${groupKey}" value="${n}"
            data-emp="${empId}" data-group="${groupKey}" data-kind="${kind}" class="cnt-in" title="Type a number, or use − / +1">
          <button type="button" onclick="bump(${empId}, '${groupKey}', '${kind}', 1, this)" class="plus" style="background:${t.color};">+1</button>
        </span>
        <span class="lbl">Orders</span>
        <span class="ord" id="ord-${kind}-${empId}-${groupKey}">${o === undefined ? (ordersLoading ? '…' : '—') : `<b>${o}</b><small>tagged ${t.label}</small>`}</span>
        <span class="lbl">Ratio</span>
        <span id="ratio-${kind}-${empId}-${groupKey}">${ratioHtml(o, n)}</span>
      </div>
    </td>`;
  }
  function totalCell(e, g) {
    if (hourMode()) {
      const th = shownCount(g, 'scout') + shownCount(g, 'champion');
      const td = (g.scout_count || 0) + (g.champion_count || 0);
      return `<b id="cnt-total-${e.employee_id}-${g.group_key}">${th}</b> <span class="lbl">${isCurHour() ? 'this hour' : 'in hour'}</span>
        <div class="tot-sub"><b style="font-size:13px; color:var(--ink);">${td}</b> day</div>
        <div class="tot-sub"><span style="color:#0C447C;">Q ${g.scout_count || 0}</span> · <span style="color:#854F0B;">C ${g.champion_count || 0}</span></div>`;
    }
    const tq = (g.scout_count || 0) + (g.champion_count || 0);
    const oc = ordersFor(e.full_name);
    const to = oc ? oc.scout + oc.champion + oc.other : undefined;
    return `<b id="cnt-total-${e.employee_id}-${g.group_key}">${tq}</b> <span class="lbl">queries</span>
      <div class="tot-sub">${to === undefined ? '—' : `${to} order${to === 1 ? '' : 's'}${oc && oc.other ? ` · ${oc.other} other` : ''}`}</div>
      <div class="tot-sub">${ratioHtml(to, tq)} overall</div>`;
  }

  function render() {
    const list = document.getElementById('empList');
    if (!employees.length) {
      list.innerHTML = '<tr><td colspan="5" class="empty-state">No sales employees.</td></tr>';
      return;
    }
    updateSums();
    // Order: blue first, then yellow, then no colour (for the selected
    // house's colour); A–Z within each group.
    const colourRank = (e) => { const g = e.groups.find(x => x.group_key === groupFilter()) || e.groups[0]; const c = g && g.color; return c === BLUE ? 0 : (c === YELLOW ? 1 : 2); };
    const shown = employees.filter(matchesSearch).sort((a, b) => colourRank(a) - colourRank(b) || a.full_name.localeCompare(b.full_name));
    if (!shown.length) {
      list.innerHTML = '<tr><td colspan="5" class="empty-state">No matching employees.</td></tr>';
      return;
    }

    // One row per (employee, house) — the employee's name spans all of
    // their house rows with rowspan, so multi-house employees read as one
    // block instead of repeating the name each time.
    list.innerHTML = shown.map(e => {
      const groups = e.groups.length ? e.groups : [{ group_key: '', group_label: 'Ungrouped', query_count: 0, scout_count: 0, champion_count: 0 }];
      return groups.map((g, i) => {
        const nameCell = i === 0
          ? `<td rowspan="${groups.length}" class="emp-cell" style="vertical-align:top; ${groups.length > 1 ? 'border-right:2px solid var(--line);' : ''} ${tint(g.color)}">
               ${e.full_name}<div style="font-size:11px; color:var(--muted);">${e.employee_code}</div>
               <span class="color-pick" data-emp="${e.employee_id}" data-group="${g.group_key}">
                 <b class="sw blue ${g.color === BLUE ? 'on' : ''}" data-color="${BLUE}" role="button" tabindex="0" title="Blue"></b>
                 <b class="sw yellow ${g.color === YELLOW ? 'on' : ''}" data-color="${YELLOW}" role="button" tabindex="0" title="Yellow"></b>
                 <b class="sw none ${!g.color ? 'on' : ''}" data-color="" role="button" tabindex="0" title="No colour"></b>
               </span>
             </td>`
          : '';
        const color = HOUSE_COLOR[g.group_key] || HOUSE_COLOR[''];
        return `<tr>
          ${nameCell}
          <td><span style="display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; color:${color}; background:${color}18;">${g.group_label}</span></td>
          ${typeBlock(e, g, 'scout')}
          ${typeBlock(e, g, 'champion')}
          <td class="tot-cell ${hourMode() ? 'hr' : ''}" id="tot-${e.employee_id}-${g.group_key}">${totalCell(e, g)}</td>
        </tr>`;
      }).join('');
    }).join('');
  }

  // +1 / − feel instant: the number changes on the spot and the save goes
  // in the background. Clicks on the same row are sent one after another
  // (so the server applies them in order); if a save fails, the row is
  // put back to the server's figures and the error shown.
  const pendingByRow = {};
  function paintRow(empId, groupKey, grp) {
    const emp = employees.find(x => x.employee_id === empId);
    ['scout', 'champion'].forEach(kind => {
      const inp = document.getElementById(`cnt-${kind}-${empId}-${groupKey}`);
      if (inp && document.activeElement !== inp) inp.value = shownCount(grp, kind);
      const rc = document.getElementById(`ratio-${kind}-${empId}-${groupKey}`);
      const oc = emp && ordersFor(emp.full_name);
      if (rc) rc.innerHTML = ratioHtml(oc ? oc[kind] : undefined, grp[kind + '_count'] || 0);
      // hour view: the orders line under the counter follows the day count
      const od = document.getElementById(`ord-${kind}-${empId}-${groupKey}`);
      if (od && hourMode()) od.innerHTML = miniOrders(oc ? oc[kind] : undefined, grp[kind + '_count'] || 0);
    });
    const tc = document.getElementById(`tot-${empId}-${groupKey}`);
    if (tc && emp) tc.innerHTML = totalCell(emp, grp);
  }
  window.bump = function (empId, groupKey, kind, delta) {
    const emp = employees.find(e => e.employee_id === empId);
    const grp = emp && emp.groups.find(g => g.group_key === groupKey);
    if (!grp) return;
    const field = kind + '_count', hField = 'hour_' + kind;
    if (delta < 0 && shownCount(grp, kind) <= 0) return;   // nothing to take away
    if (hourMode()) grp[hField] = (grp[hField] || 0) + delta;
    grp[field] = Math.max(0, (grp[field] || 0) + delta);
    grp.query_count = grp.scout_count + grp.champion_count;
    paintRow(empId, groupKey, grp);
    updateSums();
    scheduleHourly();

    const key = empId + '|' + groupKey;
    const dateForClick = day(), hourForClick = viewHour;
    pendingByRow[key] = (pendingByRow[key] || Promise.resolve()).then(async () => {
      try {
        const d = await api.post('queries.assign_bump', { employee_id: empId, group_key: groupKey, kind, delta, date: dateForClick, hour: hourForClick });
        // Server figures win once every queued click for this row is done.
        if (pendingByRow[key] === chain) {
          grp.query_count = d.query_count; grp.scout_count = d.scout_count; grp.champion_count = d.champion_count;
          if (d.hour_scout !== undefined && hourForClick === viewHour) { grp.hour_scout = d.hour_scout; grp.hour_champion = d.hour_champion; }
          paintRow(empId, groupKey, grp);
          updateSums();
        }
      } catch (err) {
        showAlert(err.message, 'error');
        try {   // put the row back to what the server has
          const fresh = await api.get('queries.assign_list', { date: dateForClick, store_group: groupFilter(), hour: hourForClick === null ? '' : hourForClick });
          const fe = (fresh.employees || []).find(e => e.employee_id === empId);
          const fg = fe && fe.groups.find(g => g.group_key === groupKey);
          if (fg) { Object.assign(grp, fg); paintRow(empId, groupKey, grp); updateSums(); }
        } catch (e2) { /* keep the optimistic number; the next load corrects it */ }
      }
    });
    const chain = pendingByRow[key];
  };

  // ---------- Orders today, per employee, for the selected house ----------
  // Today's Shopify orders with the house-tag rule (a tag beats the store),
  // counted per salesman for the house being viewed only.
  const HOUSE_TAGS = { tm4u: 'tm4u', tmph: 'tmph', 'tm perfume house': 'tmph', tmf: 'tmf', 'tm fragrance': 'tmf' };
  const STORE_HOUSE = { tmperfumehouse: 'tmph', tmfragrance: 'tmf' };
  const HOUSE_NAME = { tmph: 'TM Perfume House', tmf: 'TM Fragrance', tm4u: 'TM4U' };
  function houseOf(o) {
    if (o.house) return o.house;
    const ht = [...new Set(String(o.tags || '').split(',').map(t => HOUSE_TAGS[t.trim().toLowerCase()]).filter(Boolean))];
    return ht.length === 1 ? ht[0] : (STORE_HOUSE[o.store_key] || '');
  }
  // salesman name -> { scout, champion, other } orders today in the selected house
  let ordersByName = {};
  const SCOUT_TAGS = ['query', 's'], CHAMPION_TAGS = ['campaign', 'c'];
  function orderType(tags) {
    const t = String(tags || '').split(',').map(x => x.trim().toLowerCase());
    if (t.some(x => SCOUT_TAGS.includes(x))) return 'scout';
    if (t.some(x => CHAMPION_TAGS.includes(x))) return 'champion';
    return 'other';
  }
  const ordersFor = (name) => ordersByName[name];
  let ordersLoadedFor = '';
  let ordersLoading = false;
  async function loadOrdersCount() {
    const key = day() + '|' + groupFilter();
    if (ordersLoadedFor === key) return;
    ordersLoading = true;
    try {
      const d = await api.get('shopify.orders', { date_from: day(), date_to: day() });
      const map = {};
      (d.orders || []).forEach(o => {
        if (!o.salesman || !STORE_HOUSE[o.store_key]) return;   // MySales / manual belong to no house
        if (houseOf(o) !== groupFilter()) return;
        map[o.salesman] = map[o.salesman] || { scout: 0, champion: 0, other: 0 };
        map[o.salesman][orderType(o.tags)]++;
      });
      employees.forEach(e => { if (!map[e.full_name]) map[e.full_name] = { scout: 0, champion: 0, other: 0 }; });
      ordersByName = map;
      ordersLoadedFor = key;
    } catch (err) {
      ordersByName = {};
    } finally {
      ordersLoading = false;
      render();
    }
  }

  // Typing a number sets that count exactly (saved on Enter or when you
  // leave the box). The − / +1 buttons still add or take one.
  document.addEventListener('change', (e) => {
    const inp = e.target.closest('.cnt-in'); if (!inp) return;
    const empId = Number(inp.dataset.emp), groupKey = inp.dataset.group, kind = inp.dataset.kind;
    let value = Math.max(0, Math.min(9999, Math.round(Number(inp.value) || 0)));
    inp.value = value;
    const emp = employees.find(x => x.employee_id === empId);
    const grp = emp && emp.groups.find(g => g.group_key === groupKey);
    if (!grp) return;
    if (hourMode()) {
      const diff = value - (grp['hour_' + kind] || 0);
      grp['hour_' + kind] = value;
      grp[kind + '_count'] = Math.max(0, (grp[kind + '_count'] || 0) + diff);
    } else {
      grp[kind + '_count'] = value;
    }
    grp.query_count = grp.scout_count + grp.champion_count;
    paintRow(empId, groupKey, grp);
    updateSums();
    scheduleHourly();
    const key = empId + '|' + groupKey, dateForClick = day(), hourForClick = viewHour;
    pendingByRow[key] = (pendingByRow[key] || Promise.resolve()).then(async () => {
      try {
        const d = await api.post('queries.assign_set', { employee_id: empId, group_key: groupKey, kind, value, date: dateForClick, hour: hourForClick });
        grp.query_count = d.query_count; grp.scout_count = d.scout_count; grp.champion_count = d.champion_count;
        if (d.hour_scout !== undefined && hourForClick === viewHour) { grp.hour_scout = d.hour_scout; grp.hour_champion = d.hour_champion; }
        paintRow(empId, groupKey, grp); updateSums();
      } catch (err) { showAlert(err.message, 'error'); }
    });
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.closest('.cnt-in')) e.target.blur(); });
  document.addEventListener('focusin', (e) => { const i = e.target.closest('.cnt-in'); if (i) i.select(); });

  // The By hour grid refreshes shortly after the last click, not on every one.
  let hourlyTimer = null;
  function scheduleHourly() { clearTimeout(hourlyTimer); hourlyTimer = setTimeout(loadHourly, 700); }

  // ---------- By hour grid ----------
  const fmtHour = (h) => `${((h + 11) % 12) + 1} ${h >= 12 ? 'PM' : 'AM'}`;
  async function loadHourly() {
    const body = document.getElementById('hourBody'), foot = document.getElementById('hourFoot');
    try {
      const d = await api.get('queries.hourly', { date: day(), store_group: groupFilter() });
      const nowHour = new Date().getHours(), isToday = day() === new Date().toISOString().slice(0, 10) || day() === bizTodayStr();
      document.getElementById('hourSub').textContent = new Date(day() + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
      const rows = [];
      if (d.earlier && (d.earlier.scout || d.earlier.champion)) rows.push(`<tr onclick="setHour(null)" title="Counts entered before the hour log existed — shown in the whole-day view"><td>Earlier</td><td class="q">${d.earlier.scout}</td><td class="c">${d.earlier.champion}</td><td class="t">${d.earlier.scout + d.earlier.champion}</td></tr>`);
      // The server sends every hour of the business day in order (10 AM …
      // 11 PM, 12 AM … 9 AM), empty ones included — do not re-sort, or the
      // after-midnight hours jump to the top.
      const hoursList = (d.hours || []).slice();
      if (isToday && !hoursList.some(h => h.hour === nowHour)) hoursList.push({ hour: nowHour, scout: 0, champion: 0 });
      hoursList.forEach(h => {
        const isNow = h.now || (isToday && h.hour === nowHour);
        const later = !!h.future && !isNow;   // hour has not started yet today
        const cell = (v) => later ? '—' : v;
        rows.push(`<tr class="${isNow ? 'cur' : ''} ${viewHour === h.hour ? 'sel' : ''}"${later ? ' style="opacity:.45;"' : ''} onclick="setHour(${h.hour})" title="${later ? 'This hour has not started yet' : 'Click to view / edit this hour per employee'}"><td><span class="hr-t">${hourRange(h.hour)}</span>${isNow ? ' <span class="hr-now">● now</span>' : ''}</td><td class="q">${cell(h.scout)}</td><td class="c">${cell(h.champion)}</td><td class="t">${cell(h.scout + h.champion)}</td></tr>`);
      });
      body.innerHTML = rows.join('') || '<tr><td colspan="4" class="empty-state" style="padding:16px;">Nothing added yet.</td></tr>';
      renderChips(hoursList, d.total || { scout: 0, champion: 0 }, isToday);
      const t = d.total || { scout: 0, champion: 0 };
      foot.innerHTML = `<tr><td>Total</td><td class="q">${t.scout}</td><td class="c">${t.champion}</td><td class="t">${t.scout + t.champion}</td></tr>`;
    } catch (err) {
      body.innerHTML = `<tr><td colspan="4"><div class="alert error" style="margin:8px;">${err.message}</div></td></tr>`;
      foot.innerHTML = '';
    }
  }
  // Chips above the table: one per hour with data (plus the running hour),
  // and "Whole day" for the old all-hours view.
  function renderChips(hoursList, total, isToday) {
    const el = document.getElementById('hourChips');
    const chips = hoursList.filter(h => !h.future || h.now).map(h => `<span class="hr-chip ${viewHour === h.hour ? 'on' : ''} ${!(h.scout + h.champion) && !(isToday && h.hour === nowHour) ? 'empty' : ''}" onclick="setHour(${h.hour})">${hourRange(h.hour)}${isToday && h.hour === nowHour ? ' · now' : ''}<b>${h.scout + h.champion}</b></span>`);
    chips.push(`<span class="hr-chip day ${viewHour === null ? 'on' : ''}" onclick="setHour(null)">Whole day<b>${total.scout + total.champion}</b></span>`);
    el.innerHTML = chips.join('');
  }
  function renderBanner() {
    const b = document.getElementById('hourBanner');
    b.style.display = '';
    if (!hourMode()) {
      b.className = 'hr-banner dayv';
      b.innerHTML = `<b>Whole day</b> · counts for the full day (all hours together) · click a time in By hour to work hour-wise${isBizToday() ? ` <button type="button" class="btn secondary" onclick="setHour(${nowHour})">Go to current hour</button>` : ''}`;
    } else if (isCurHour()) {
      b.className = 'hr-banner cur';
      b.innerHTML = `<b>Current hour ${hourRange(viewHour)}</b> · every row started this hour at 0 · each +1 / − is saved under this hour · at ${fmtHour(viewHour + 1)} the rows start from 0 again (day total keeps counting)`;
    } else {
      b.className = 'hr-banner past';
      b.innerHTML = `<b>Editing ${hourRange(viewHour)}</b> · the numbers given in that hour · − / +1 or typing changes that hour (day total moves too) ${isBizToday() ? `<button type="button" class="btn secondary" onclick="setHour(${nowHour})">← Back to current hour</button>` : `<button type="button" class="btn secondary" onclick="setHour(null)">Whole day</button>`}`;
    }
    document.getElementById('thQ').textContent = hourMode() ? (isCurHour() ? 'this hour · orders today' : 'in this hour · orders today') : 'count · orders tagged query · ratio';
    document.getElementById('thC').textContent = hourMode() ? (isCurHour() ? 'this hour · orders today' : 'in this hour · orders today') : 'count · orders tagged campaign · ratio';
  }
  function bizTodayStr() { const d = new Date(); if (d.getHours() < 10) d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  let loadedFor = '';
  async function load() {
    nowHour = new Date().getHours(); bizToday = bizTodayStr();
    // A new date opens on its default view: today = the running hour, any other day = whole day.
    const dayKey = day() + '|' + groupFilter();
    if (loadedFor !== dayKey) { viewHour = defaultHour(); loadedFor = dayKey; }
    loadHourly();
    ordersLoadedFor = ''; ordersByName = {};
    const dateTxt = new Date(day() + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'short' });
    document.getElementById('cardTitle').textContent = hourMode() ? `${hourRange(viewHour)} · ${dateTxt}${isCurHour() ? ' · current hour' : ''}` : dateTxt;
    renderBanner();
    document.getElementById('empList').innerHTML = '<tr><td colspan="5" class="loading">Loading...</td></tr>';
    try {
      const data = await api.get('queries.assign_list', { date: day(), store_group: groupFilter(), hour: viewHour === null ? '' : viewHour });
      employees = data.employees || [];
      if (data.biz_today) bizToday = data.biz_today;
      loadOrdersCount();
      render();
    } catch (err) {
      document.getElementById('empList').innerHTML = `<tr><td colspan="5"><div class="alert error">${err.message}</div></td></tr>`;
    }
  }

  const now = new Date();
  document.getElementById('dayPick').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  document.getElementById('dayPick').addEventListener('change', load);
  document.getElementById('groupPick').addEventListener('change', load);
  let searchTimer = null;
  document.getElementById('empSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 150);
  });
  load();
  // When the clock moves to the next hour while the running hour is open,
  // switch to the new hour so the rows start again from 0.
  setInterval(() => {
    const h = new Date().getHours();
    if (h !== nowHour && isBizToday() && viewHour === nowHour) { nowHour = h; viewHour = h; load(); }
    else nowHour = h;
  }, 30000);
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
