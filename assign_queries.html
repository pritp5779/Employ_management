<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HRMS">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Assign Queries — HRMS</title>
<link rel="stylesheet" href="assets/css/style.css?v=4">
<style>
  /* Employee label colour: a rainbow dot in the name cell opens a colour
     wheel; the chosen colour tints the cell and the dot shows it exactly. */
  .emp-cell{position:relative; padding-right:34px !important;}
  .color-dot{position:absolute; right:10px; top:14px; width:18px; height:18px; border-radius:50%; cursor:pointer;
    background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red); box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line);}
  .color-dot.on{background:var(--c);}
  .color-dot:focus-visible{outline:2px solid var(--accent); outline-offset:3px;}
  .cw{position:absolute; z-index:120; background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px; display:none; flex-direction:column; align-items:center; gap:8px; box-shadow:0 10px 30px rgba(0,0,0,.18); width:200px;}
  .cw.open{display:flex;}
  .cw-wheel{position:relative; width:160px; height:160px; border-radius:50%; cursor:crosshair; touch-action:none;
    background:radial-gradient(circle,#fff 0,rgba(255,255,255,0) 70%),conic-gradient(red,yellow,lime,cyan,blue,magenta,red); box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
  .cw-cur{position:absolute; width:14px; height:14px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.4); transform:translate(-50%,-50%); pointer-events:none;}
  .cw-prev{display:flex; align-items:center; gap:8px; width:100%; font-size:11px;}
  .cw-prev i{width:26px; height:26px; border-radius:8px; border:1px solid var(--line); flex:none;}
  .cw-prev code{flex:1; font-size:11px; color:var(--muted);}
  .cw-acts{display:flex; gap:6px; width:100%;}
  .cw-acts .btn{flex:1; padding:6px; font-size:12px; min-height:0;}
  @media (max-width:820px){ .color-dot{width:22px; height:22px; top:12px;} .cw{width:220px;} .cw-wheel{width:180px; height:180px;} }
</style>
</head>
<body>
<div class="app">
  <div id="sidebar"></div>
  <main class="main">
    <div class="topbar">
      <h1>Assign Queries</h1>
      <div style="display:flex; gap:10px; align-items:center;">
        <input type="text" id="empSearch" placeholder="Search employee..." style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px; width:170px;">
        <select id="groupPick" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
          <option value="tmph">TM Perfume House</option>
          <option value="tmf">TM Fragrance</option>
          <option value="tm4u">TM4U</option>
        </select>
        <input type="date" id="dayPick" style="padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
      </div>
    </div>
    <div class="content">
      <div id="alertBox"></div>

      <div class="card" style="max-width:860px;">
        <div class="card-head">
          <h2 id="cardTitle">Today</h2>
          <span style="font-size:12.5px; color:var(--muted);">
            Scout <b id="sumScout" style="color:#0C447C;">0</b> ·
            Champion <b id="sumChamp" style="color:#854F0B;">0</b> ·
            Total <b id="totalCount" style="color:var(--ink);">0</b>
          </span>
        </div>
        <table>
          <thead>
            <tr>
              <th>Employee</th>
              <th style="width:150px;">House</th>
              <th style="text-align:center; color:#0C447C; background:#F0F7FD;">Scout</th>
              <th style="text-align:center; color:#854F0B; background:#FDF7EC;">Champion</th>
              <th style="text-align:center;">Total</th>
            </tr>
          </thead>
          <tbody id="empList">
            <tr><td colspan="5" class="loading">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<div class="cw" id="colorWheel" role="dialog" aria-label="Pick a colour">
  <div class="cw-wheel" id="cwWheel"><span class="cw-cur" id="cwCur" style="display:none;"></span></div>
  <div class="cw-prev"><i id="cwPrev"></i><code id="cwHex">—</code></div>
  <div class="cw-acts"><button type="button" class="btn secondary" id="cwNone">None</button><button type="button" class="btn" id="cwUse">Use colour</button></div>
</div>
<script src="assets/js/config.js?v=2"></script>
<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/layout.js?v=3"></script>
<script>
  guardPage();

  // ---------- Employee label colour ----------
  const tint = (c) => c ? `background:${c}2b;` : '';
  const cw = document.getElementById('colorWheel'), cwWheel = document.getElementById('cwWheel'), cwCur = document.getElementById('cwCur');
  let cwEmp = 0, cwGroup = '', cwPick = '';
  function hsvToHex(h, s, v) { const f = (n, k = (n + h / 60) % 6) => v - v * s * Math.max(Math.min(k, 4 - k, 1), 0); return '#' + [f(5), f(3), f(1)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join(''); }
  function cwSet(hex, x, y) {
    cwPick = hex || '';
    document.getElementById('cwPrev').style.background = hex || 'transparent';
    document.getElementById('cwHex').textContent = hex || '—';
    if (x !== undefined) { cwCur.style.display = 'block'; cwCur.style.left = x + 'px'; cwCur.style.top = y + 'px'; cwCur.style.background = hex; }
    else cwCur.style.display = 'none';
  }
  function cwFromEvent(ev) {
    const r = cwWheel.getBoundingClientRect(); const cx = r.width / 2, cy = r.height / 2;
    let x = ev.clientX - r.left, y = ev.clientY - r.top, dx = x - cx, dy = y - cy;
    const dist = Math.hypot(dx, dy) || 1; const sat = Math.min(1, dist / cx);
    if (dist > cx) { dx *= cx / dist; dy *= cx / dist; x = cx + dx; y = cy + dy; }
    const hue = ((Math.atan2(dy, dx) * 180 / Math.PI) + 90 + 360) % 360;
    cwSet(hsvToHex(hue, sat, 1), x, y);
  }
  let cwDrag = false;
  cwWheel.addEventListener('pointerdown', (e) => { cwDrag = true; cwWheel.setPointerCapture(e.pointerId); cwFromEvent(e); });
  cwWheel.addEventListener('pointermove', (e) => { if (cwDrag) cwFromEvent(e); });
  cwWheel.addEventListener('pointerup', () => { cwDrag = false; });
  function openWheel(dot) {
    cwEmp = Number(dot.dataset.emp);
    cwGroup = dot.dataset.group || '';
    const r = dot.getBoundingClientRect();
    cw.style.left = Math.max(8, Math.min(r.left + window.scrollX - 90, document.documentElement.clientWidth - 212)) + 'px';
    cw.style.top = (r.bottom + window.scrollY + 8) + 'px';
    cw.classList.add('open');
    cwSet(dot.dataset.color || '');
  }
  async function saveColor(color) {
    cw.classList.remove('open');
    try {
      await api.post('employees.set_color', { employee_id: cwEmp, group_key: cwGroup, color });
      const dot = document.querySelector(`.color-dot[data-emp="${cwEmp}"][data-group="${cwGroup}"]`);
      if (dot) { dot.dataset.color = color; dot.style.setProperty('--c', color || 'transparent'); dot.classList.toggle('on', !!color); dot.closest('td').style.background = color ? color + '2b' : ''; }
      const row = employees.find(e => Number(e.employee_id) === cwEmp);
      const grp = row && row.groups.find(x => x.group_key === cwGroup); if (grp) grp.color = color;
    } catch (err) { showAlert(err.message, 'error'); }
  }
  document.getElementById('cwUse').addEventListener('click', () => saveColor(cwPick));
  document.getElementById('cwNone').addEventListener('click', () => saveColor(''));
  document.addEventListener('click', (e) => {
    const dot = e.target.closest('.color-dot');
    if (dot) { e.preventDefault(); openWheel(dot); return; }
    if (!e.target.closest('.cw')) cw.classList.remove('open');
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cw.classList.remove('open'); const dot = e.target.closest && e.target.closest('.color-dot'); if (dot && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openWheel(dot); } });
  renderSidebar('assign_queries');

  const alertBox = document.getElementById('alertBox');
  let employees = []; // each: { employee_id, full_name, employee_code, groups: [{group_key, group_label, query_count, scout_count, champion_count}] }

  // House label -> accent color, so the same house reads consistently
  // everywhere (Assign Queries, Targets, Performance).
  const HOUSE_COLOR = { tmph: '#2563EB', tmf: '#D97706', tm4u: '#7C3AED', '': '#6B7280' };

  function showAlert(msg, type = 'success') {
    alertBox.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => (alertBox.innerHTML = ''), 4000);
  }

  function day() { return document.getElementById('dayPick').value; }
  // One house at a time (there is no "All houses"): the page shows the chosen
  // house's employees, one row each, and colours are per employee per house.
  function groupFilter() { return document.getElementById('groupPick').value || 'tmph'; }

  function matchesSearch(e) {
    const q = (document.getElementById('empSearch').value || '').trim().toLowerCase();
    if (!q) return true;
    return (e.full_name || '').toLowerCase().includes(q)
      || (e.employee_code || '').toLowerCase().includes(q);
  }

  function updateSums() {
    // Sums reflect every employee/house shown for the day, regardless of
    // the search box — only which ROWS are visible is filtered by search.
    let scout = 0, champ = 0, total = 0;
    employees.forEach(e => e.groups.forEach(g => { scout += g.scout_count; champ += g.champion_count; total += g.query_count; }));
    document.getElementById('sumScout').textContent = scout;
    document.getElementById('sumChamp').textContent = champ;
    document.getElementById('totalCount').textContent = total;
  }

  function counterCell(empId, groupKey, group, kind, color, bg) {
    return `
      <td style="text-align:center; background:${bg}; vertical-align:middle;">
        <span style="display:inline-flex; align-items:center; gap:6px;">
          <button onclick="bump(${empId}, '${groupKey}', '${kind}', -1, this)" title="Undo one"
            style="width:30px; height:32px; border-radius:6px; border:1px solid var(--line); background:#fff; color:var(--muted); font-size:15px; cursor:pointer;">−</button>
          <span id="cnt-${kind}-${empId}-${groupKey}" style="font-size:18px; font-weight:700; min-width:30px; text-align:center;">${group[kind + '_count']}</span>
          <button onclick="bump(${empId}, '${groupKey}', '${kind}', 1, this)"
            style="width:46px; height:34px; border-radius:6px; border:none; background:${color}; color:#fff; font-size:14px; font-weight:700; cursor:pointer;">+1</button>
        </span>
      </td>`;
  }

  function render() {
    const list = document.getElementById('empList');
    if (!employees.length) {
      list.innerHTML = '<tr><td colspan="5" class="empty-state">No sales employees.</td></tr>';
      return;
    }
    updateSums();
    const shown = employees.filter(matchesSearch);
    if (!shown.length) {
      list.innerHTML = '<tr><td colspan="5" class="empty-state">No matching employees.</td></tr>';
      return;
    }

    // One row per (employee, house) — the employee's name spans all of
    // their house rows with rowspan, so multi-house employees read as one
    // block instead of repeating the name each time.
    list.innerHTML = shown.map(e => {
      const groups = e.groups.length ? e.groups : [{ group_key: '', group_label: 'Ungrouped', query_count: 0, scout_count: 0, champion_count: 0 }];
      return groups.map((g, i) => {
        const nameCell = i === 0
          ? `<td rowspan="${groups.length}" class="emp-cell" style="vertical-align:top; ${groups.length > 1 ? 'border-right:2px solid var(--line);' : ''} ${tint(g.color)}">
               ${e.full_name}<div style="font-size:11px; color:var(--muted);">${e.employee_code}</div>
               <span class="color-dot ${g.color ? 'on' : ''}" style="--c:${g.color || 'transparent'};" data-emp="${e.employee_id}" data-group="${g.group_key}" data-color="${g.color || ''}" role="button" tabindex="0" title="Pick a colour for ${e.full_name} in ${g.group_label}"></span>
             </td>`
          : '';
        const color = HOUSE_COLOR[g.group_key] || HOUSE_COLOR[''];
        return `<tr>
          ${nameCell}
          <td><span style="display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; font-weight:600; color:${color}; background:${color}18;">${g.group_label}</span></td>
          ${counterCell(e.employee_id, g.group_key, g, 'scout', '#0EA5E9', '#F7FBFE')}
          ${counterCell(e.employee_id, g.group_key, g, 'champion', '#F59E0B', '#FEFBF5')}
          <td style="text-align:center; font-size:16px; font-weight:700; vertical-align:middle;" id="cnt-total-${e.employee_id}-${g.group_key}">${g.query_count}</td>
        </tr>`;
      }).join('');
    }).join('');
  }

  window.bump = async function (empId, groupKey, kind, delta, btn) {
    btn.disabled = true;
    try {
      const d = await api.post('queries.assign_bump', { employee_id: empId, group_key: groupKey, kind, delta, date: day() });
      const emp = employees.find(e => e.employee_id === empId);
      const grp = emp && emp.groups.find(g => g.group_key === groupKey);
      if (grp) { grp.query_count = d.query_count; grp.scout_count = d.scout_count; grp.champion_count = d.champion_count; }
      const scoped = document.getElementById(`cnt-${kind}-${empId}-${groupKey}`);
      if (scoped) scoped.textContent = d[kind + '_count'];
      const total = document.getElementById(`cnt-total-${empId}-${groupKey}`);
      if (total) total.textContent = d.query_count;
      updateSums();
    } catch (err) {
      showAlert(err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  };

  async function load() {
    document.getElementById('cardTitle').textContent =
      new Date(day() + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'short' });
    try {
      const data = await api.get('queries.assign_list', { date: day(), store_group: groupFilter() });
      employees = data.employees || [];
      render();
    } catch (err) {
      document.getElementById('empList').innerHTML = `<tr><td colspan="5"><div class="alert error">${err.message}</div></td></tr>`;
    }
  }

  const now = new Date();
  document.getElementById('dayPick').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  document.getElementById('dayPick').addEventListener('change', load);
  document.getElementById('groupPick').addEventListener('change', load);
  let searchTimer = null;
  document.getElementById('empSearch').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 150);
  });
  load();
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
